title: 圆形监狱
updated: 2026-07-08
summary: |
  午后的阳光映照在污浊的洪水上，甚至呈现出一种诡异又残忍的美感，像是某种生物大灭绝。

  而他和石马修，正站在这座孤岛的中央。
status: finished
chapters:
  - title: Day 1
    body: |-
      
      睡眼惺忪的朴乾煜从卧室晃悠出来的时候，石马修正在厨房研究着他的神秘菜谱，Gia则蹲在窗边眺望远方，细长的尾巴毫无规律地甩着。

      明明是正午时分，天气却是阴沉沉的。



      他抽了抽鼻子，在空气里隐约闻到一股苦味，于是大喊一声：“马修哥，好像有什么东西糊了！！”

      石马修回过头来，一脸疑惑：“是吗？可是我还没开火呢！”

      “啊……那应该是我闻错了。”朴乾煜挠挠头，只当是自己鼻炎还没好透，趿着拖鞋走进了卫生间。



      待朴乾煜洗漱完毕，石马修已经端坐在餐桌前，边吃希腊酸奶，边机械地刷着手机。

      他朝着另一个餐盘努努嘴，“给你热了两片吐司，过来吃吧。”——说是两片吐司，其实还煎了鸡蛋和培根，又顺手撒了一小把莓果，丰盛得很。

      “谢谢哥。”朴乾煜自觉地与石马修并排坐着，安静地吃起了爱心早餐。



      “你还能连得上网吗？”石马修有些生气地碎碎念：“今早起来之后，手机网络就时好时坏！现在居然连Plus Chat都发不出去了……”

      朴乾煜从兜里掏出了手机：“让我试试。”



      🔝건욱이：马修哥给我做了早餐！

      🔝건욱이：[图片]

      🔝건욱이：真好吃ㅋㅋㅋ



      “发出去了！”朴乾煜咬了一大口吐司，口齿不清道：“哥，断开家里的Wi-Fi试试呢？”

      石马修拖着长音回答：“早就试过了……”他撅着嘴，“三星怎么可能会比iPhone的信号更差呢？我不能接受！”

      朴乾煜笑得上气不接下气：“这种事情也是偶尔会出现的啦！”



      他又划了两下手机，随手点开了粉丝们的回复——平日里刷屏的韩文此刻却寥寥无几，放眼望去几乎是清一色的外语。



      “哥，确实有点奇怪……韩国粉丝们都不见了呢……”朴乾煜下意识皱起了眉头，他打开常用的社交媒体，试图搜索网络异常的消息，却一无所获。

      “什么呀，难道是全国网络故障吗？”石马修也吓了一跳，接着乐呵呵道：“嘿嘿，我就说不是三星的问题嘛！”



      朴乾煜一连给几个熟人发了信息，全部显示「已送达」，但没有一条被读。

      他忽然开始有些紧张。



      “帮我给成员们发一条吧，就说马修没信号啦！”石马修把脑袋凑了过来。



      两人一起盯着朴乾煜的手机。

      消息果然又是石沉大海。



      石马修故作轻松地耸耸肩：“还好今天没有行程，否则经理都联系不上我们。”

      朴乾煜面色有些凝重：“我试试电话能不能拨通。”



      -



      万幸的是，电话通了。



      朴乾煜压低声音开口：“哥，你看到我发的信息了吗？”

      “我的天啊，是Gunwookie！”不知为何，电话那头很吵，经理在大声咆哮着：“你现在和马修在一起吗？”

      朴乾煜的心跳很快，语速也快了起来：“是的，我们在家里。”



      中年男人几乎用尽全身力气：“你们这几天千万不要出去！！！”



      “什么？”

      “我会想办法——”



      电话断了。

      信号栏变成了「无服务」。



      朴乾煜握着手机的手微微发抖。



      -



      “说不定又有私生蹲在外面了，别紧张。”石马修安抚地拍了拍朴乾煜的后背，“既然不让我们出去，要不要来我房间玩PS5呀？”

      朴乾煜心神不宁地点点头，随他进屋，席地而坐。

      Gia紧跟着两人，乖巧地趴在地毯上。



      -



      和石马修待在一起总是很轻松。

      朴乾煜很快便沉浸在电子游戏之中，先前的惴惴不安被抛诸脑后。



      毕竟他已经在这个国家安全地生活了二十几年。

      信号不稳定肯定只是暂时的。



      -



      “马修哥！又耍赖！”朴乾煜把手柄扔在地毯上，双手握住石马修的胳膊摇来摇去。

      男人笑得狂妄：“哈哈！你呆在我的房间，就得听我的规矩！马修可是非常公平的！”



      朴乾煜轻哼一声，“那我以后不来了呗。”说着就松开了手，准备起身往外走。

      “哎呀，我开玩笑的啦！”笑得前仰后合的石马修顺势倒在年轻人怀里，不许他离开。



      朴乾煜习惯性地收紧手臂，搂住了爱耍赖的哥哥。

      他正打算说点什么，电视机屏幕突然一闪——原本的游戏画面被一行血红的大字取代：



      自然灾害预警！请市民们关好门窗，避免外出！



      朴乾煜的脸色瞬间惨白。

      原来什么都没变，只是他躲进了茧房里。



      “「自然灾害」是什么？”石马修的韩语仍不足以让他读懂这行字。

      朴乾煜哑着嗓子解释道：“比如说地震、洪水……”



      他的话音未落，耳边顿时劈过一道惊雷，像是宣告着开始。

      紧接着是满天暴雨倾下，整个城市被淹没在令人窒息的黑色雨幕之中。



      -



      石马修快步走到落地窗前，一把拉上窗帘，挡住了朴乾煜望向窗外的视线。

      也许是感受到了年轻人的不安，他笑着安抚道：“夏天下暴雨也不奇怪啦！我们就在家里待着，冰箱里的东西也够吃好几天，不会有事的。”



      “我明白的，哥。”朴乾煜点点头，面色依旧不佳：“只是有点担心家里……手机也没了信号……”

      “或许晚点信号就恢复了呢？”石马修轻轻拥抱了朴乾煜，希望小小的安慰在这种时刻能派上用场。



      -



      直到这天结束，信号依然没有恢复的迹象。

      而窗外的雨越下越大了。
  - title: Day 2
    body: |
      
      石马修这一宿睡得并不安稳。
      在半梦半醒间，他隐约听到了远方的尖叫和哭喊，还有什么东西被摔碎的巨响。
      他不敢细想，只好轻轻抚摸着熟睡中的Gia。

      -

      “马修哥，早啊。”朴乾煜顶着两个大大的黑眼圈出现，石马修看了一眼就知道，他一定也没睡好。
      朴乾煜用力拉开客厅的窗帘，外面依旧是一片漆黑，狂风暴雨混作一团，叫人分不清楚。

      从昨天下午开始，暴雨便一刻不停地砸着屋顶，石马修甚至怀疑再这么下去，天花板都要塌了。
      他们所在的顶层公寓在风雨之中也摇晃得更加厉害了。

      两个人都没心情做饭，只是简单地吃了点希腊酸奶，维持最基本的生命体征。
      餐桌上朴乾煜随口讲了个不太好笑的笑话，石马修握着和板砖无异的手机，也跟着干笑了两声。

      -

      饭后，石马修主动提出要出门去看看。
      朴乾煜立刻打断他的话：“哥，我跟你一起去！”

      “不用啦，我只是在楼道里转转。”石马修摆摆手，“万一邻居看见咱俩一起出现，以为我们是来打劫的怎么办？”
      朴乾煜瘪了瘪嘴：“我怕外面不安全。”
      石马修笑眯眯地回答：“放心吧，没人能打得过你马修哥。”

      -

      公司为了保护艺人们的隐私，特意给他们租了一梯一户的高档公寓，还配有24小时的安保巡逻。
      坏处就是——他们连一个邻居都不认识。

      石马修本想坐电梯到一楼的公寓前台了解情况，却发现电梯不知在什么时候悄悄停运了。
      他顿时打消了去一楼的念头，没人想靠自己的双腿往返三十几层楼。

      他推开楼梯间的大门，往下走了几层。
      无一例外，全部都是大门紧锁，也不知道有没有人在——不知道是因为天气原因没能赶回来，还是也像他们一样躲在了家里。

      几分钟后，石马修一无所获地回了家。

      他冲朴乾煜摇了摇头：“电梯停了，我想我们这几天是没办法下去了。”
      “啊……”朴乾煜对此并不感到意外，叹了口气，“还好刚搬家的时候，我们囤了不少泡面和饮料。”
      石马修也跟着叹了口气：“是啊，还好……”

      -

      夜深了，外面的雨依旧下得震耳欲聋。
      毫无睡意的两人并排坐在客厅的沙发上。朴乾煜麻木地翻着手机相册，试图找点乐子；石马修手里拿了一根逗猫棒，有一搭没一搭地摇晃。
      Gia则在地毯上懒洋洋地打着滚儿。

      “不少地势低的地方恐怕要被淹了。”朴乾煜冷不丁地开口。
      石马修紧盯着手里的逗猫棒，动作慢了下来：“也不知道泰来在老家怎么样了……”

      朴乾煜把脸靠在石马修的肩膀上，没再说话。
  - title: Day 3
    body: |
      
      清晨，朴乾煜被刺眼的阳光晒醒。
      他从床上猛地坐起身来，朝着屋外兴奋地大喊：“马修哥！雨停了！！”

      “是啊，雨停了。”石马修的语气非常平静，听起来像是已经醒了好一段时间：“我正好煮了面，来一起吃点吧。”

      根本顾不上洗漱，朴乾煜快步走到客厅，一把拉开了窗帘。
      他起得太急，没戴眼镜，却依然被窗外的景象吓得倒退了两步——水。目光所及，到处都是浑黑色的洪水，足足有两三层楼那么深，甚至仍有攀升之势。
      在地势相对低矮之处，那些夹杂着泥沙的水正在以难以置信的速度摧毁着房屋，像是要……吞噬一切。

      他下意识地回头检查石马修的表情。
      两个人都在彼此的眼睛里看见了闪烁着的不安。

      石马修率先移开了视线：“快来吃吧，面要坨成一团了。”
      “好，谢谢哥。”朴乾煜重新拉上窗帘，坐到了餐桌前，夹了一大筷子泡面塞进嘴里，却尝不出是什么滋味。

      -

      午后时分，两个人并排坐在沙发上发呆。
      不知是谁先拉起了对方的手，指腹在手背上无意识地摩挲着。

      突然，公寓里所有的灯都灭了。
      房间再次陷入了一片漆黑。

      朴乾煜起身拉开窗帘，对着窗外的洪水重重地叹了一口气。又去查看了电闸，并没有发现什么故障。
      石马修像是想到了什么，立刻跑到厨房——冰箱的灯也灭了。冰箱内存放着他们当下最重要的生活物资，一旦食物变质，后果将不堪设想。

      “看来是停电了。”石马修麻利地将食物按照变质速度依次排序，计划着先吃最易腐烂的肉类蔬果，最后再吃常温保存也没问题的熏肉泡菜之类的食物。
      他又打开厨房的水龙头，看着流出来的自来水：“还好没停水，我们不至于被渴死。”

      “是啊，还好……”朴乾煜麻木地应和着。
      他盯着石马修被水沾湿的手指看了一会儿，突然惊叫出声：“不对！”

      -

      在去往天台的路上，朴乾煜用尽可能易懂的韩语给石马修解释为什么绝对不能再接自来水喝了。

      洪灾之后，大量污水倒灌，极易污染自来水。喝了不干净的水，轻则上吐下泻，重则可能染上疫病。
      因此，他们的当务之急是要获得干净的水。

      朴乾煜立刻想到了先前看过的科普文章。
      为了解决高层水压不足的问题，绝大多数现代公寓的楼顶上都安装了二次供水水箱，里面的水哪怕并不符合直接饮用的标准，也绝对是他们现阶段（除了去打劫邻居外）能获得的最干净的水资源了。

      于是他叫上石马修，带着几个能装水的容器，火速爬上了天台。

      -

      站在天台上，朴乾煜才终于看清这一切。
      这座城市已经被洪水彻底淹没了。

      世界安静极了，平日里那些嘈杂的都市噪音全都不见了，连带着所有生机也消失了。
      无数的花草树木被连根拔起，与被损毁的人类造物搅在一起，一并流向那些更加低矮的地区。
      午后的阳光映照在污浊的洪水上，甚至呈现出一种诡异又残忍的美感，像是某种生物大灭绝。

      而他和石马修，正站在这座孤岛的中央。

      -

      朴乾煜并没忘记自己的任务，咬紧了嘴唇，不再往下看一眼，专注地寻找着像是水箱的东西。

      “Gunwookie，你说的是不是这个？”石马修用力拉开一道铁门，露出了里面的水箱。
      朴乾煜一路小跑过来：“是的！就是它！”

      石马修掀开水箱的盖子，用手舀起一捧水，喝了一口：“是干净的水。”
      朴乾煜稍松了一口气，立刻忙活起来。

      家里并没有那么多储水的容器，两人干脆给公寓里的浴缸套上了塑料膜，把打回来的水全部倒进了浴缸中。
      在浴缸装满后，又把所有的容器装满了水才作罢。

      “这些水，够吗？”石马修轻轻问道。
      朴乾煜盯着哥哥的眼睛，点点头，又摇摇头。

      -

      “抱歉泰来，我们实在是走投无路了！”石马修对着室友的房门小声道歉，然后推开了门。
      几分钟后，他带着一袋子零食和几瓶零卡汽水走了出来，和他们剩余的食物共同摆在客厅的一角。

      朴乾煜刚好检查完燃气管道：“情况还不算太糟，我没有闻到煤气味道，灶台也可以正常使用。但热水器需要用电，也许今天得洗冷水澡了。”
      石马修戳了戳年轻人的胳膊：“水都不够喝，还洗什么澡呀！”

      “我们要优先消耗掉这些冻肉，顶多再过一天，它们就要变质了。其次是这些蔬果。”石马修仔细规划着两个人的口粮，语气极其沉重：“刚才在天台上，我没有看到任何救援的迹象。”

      朴乾煜盯着放在墙角的盆栽：“我们的食物还能坚持多久？”
      石马修面色凝重：“五天。最多一周。”
      “一周后……会有人来救我们吗？”朴乾煜喃喃自语。

      没人知道。
  - title: Day 4
    body: |
      
      起床时，两人浑身上下汗湿得像是被水浇过。

      天边升起的不再是太阳，而是一颗炽热的火球。
      在热浪一波接一波地袭击下，顶层公寓顿时变成了一个巨大的蒸箱，他们无处可逃，只得换上最轻薄的衣物。

      还没吃几口东西，石马修就被热得青筋暴起，一把脱下了贴身的背心：“没开玩笑，我怀疑今天室温得有四十五度。”
      朴乾煜没心情欣赏男人的好身材，他看了一眼热得直吐舌头的Gia，起身走到窗边，试图在停水停电的困境下找到降温的法子。

      拉开侧窗通风的下一秒，朴乾煜就知道这是一个绝对错误的选择——他的鼻子瞬间就罢工了。
      “呕！！！”闻到空气中的臭味，石马修立刻干呕起来，朴乾煜连忙关上窗户，脸上写满了歉意。

      那种臭并不是排泄物或是食物腐败的臭味，更像是唤醒了刻在人类灵魂深处对于死亡的恐惧的……尸臭。

      “估计是洪水被晒得发酵了。”朴乾煜不好意思地挠挠后脑勺，额头上又多冒出了几颗汗珠。
      石马修摆摆手，他宁愿就这么热着，也不愿再闻到那种臭味了。

      -

      石马修在Gia身上浇了一盆水，猫很震惊，但降温效果是立竿见影的——原本急促的呼吸立刻放缓了许多。
      可是存水并不足以让两个成年男人都洗上冷水澡。

      简单用水擦了擦身体后，两个人四仰八叉地躺在地板上，有一搭没一搭地聊天。

      石马修已经没有能脱的衣服了。
      热得意识模糊之际，他忽然记起来当年在加拿大听网课的时候学过的物理降温方法。

      “家里有酒精吗？”石马修突然开口。
      朴乾煜的反应也慢了半拍：“哥，现在，喝酒？”

      闻言，石马修的眼睛一下亮了起来：“酒也行！有没有酒精度数高一点的？”
      朴乾煜的神色忽然有些古怪。他慢吞吞地爬起来，从自己的卧室里拿出了一瓶开过封的威士忌，递给了石马修。

      没想到石马修拧开瓶盖后，并没有猛灌一口，而是倒在自己的手心，然后均匀地抹在了朴乾煜的手腕、后颈和太阳穴上。

      酒精挥发得很快，带来了片刻的清凉。
      可石马修的指尖却在他的皮肤上留下了滚烫的痕迹，久久没有散去。

      朴乾煜紧闭双眼，轻声说了一句：“谢谢哥。”
      石马修的语气有些冷：“想不到你小子还在房间里偷喝烈酒呢。”

      朴乾煜连忙睁开眼，想要解释几句，却撞见了石马修这几天来最灿烂的一个笑容。

      -

      “那瓶威士忌买来之后，我只喝过一次，太辣了。”朴乾煜明明没喝酒，却控制不住地讲起了真心话：“有时觉得自己真的坚持不下去了，但酒醒后又能缓过来了。或许只是欠缺一个情绪的出口。”
      石马修安静地听着，主动握住了年轻人的大手。

      “哥肯定能懂的吧？”朴乾煜顿了一下：“明明心里有很多委屈，可是一旦说出口的话，又像是自己太软弱了。”
      石马修捏了捏他汗湿的掌心：“Gunwookie已经做得很好了。”

      “可是就像现在……”朴乾煜怕再说下去自己就要哭出来了。
      石马修仿佛忘记了两人身上黏腻的汗水，用力地把朴乾煜拉进了怀里：“无论结局，有我一直陪着你。”

      -

      这时，朴乾煜的手机突然响了两声。
      两人难以置信地对视一眼，几乎以为是幻听。

      朴乾煜连滚带爬地找到了自己的手机，最后3%的电量刚好足够他查看发生了什么。

      或许是手机信号短暂恢复了几秒钟，他居然收到了亲哥在3天前发送的短信：

      “你现在还好吗？爸妈和我在一起，别担心。
      此次灾难的范围非常广，务必保护好自己。”

      读完短信，朴乾煜鼻尖一酸，视线瞬间被泪水模糊了。
      他飞快地敲打出一行字：“一切都好，替我照顾好爸妈，多保重”。
      在按下发送的几秒钟后，手机最后一点电量耗尽，彻底化为了一块板砖。

      朴乾煜不知道这条短信有没有发出去，可他的意志却变得前所未有的坚定——
      他必须要活到救援到来的那天，他必须要平安地和家人们团聚，他必须要和马修哥一起活下去。
  - title: Day 5
    body: |
      
      夜里实在太热，两人干脆在客厅打了地铺——说是地铺，也只多了并排摆放的两个枕头。
      在极端高温下，被子是最不被需要的东西。

      可朴乾煜依然越睡越热。

      他朦朦胧胧睁开双眼，石马修正紧紧缩在他的怀里，身体却不停打着哆嗦。
      两人早就脱掉了碍事的背心，体温毫无阻隔地传递着——有哪里不对劲。

      怎么会这么烫。

      朴乾煜慢半拍地意识到石马修正在发烧，睡意一下子消散了，赶紧拍了拍男人的脸颊。
      “马修哥，马修哥，快醒醒，你在发烧！”朴乾煜怕极了，连声音都在发抖。

      以往石马修有个头疼脑热，他都会担心得不行，更何况是现在。
      他的脑海里甚至浮现了最坏的猜想——万一是疫病呢？

      石马修没有睁眼，只是极其难受地呻吟了一声。
      朴乾煜摸了摸他的额头，非常烫手。他连忙把石马修抱了起来，送回床上，又掖紧了被子。

      窗外天色微亮，没有手机能看时间，朴乾煜已经对时间失去了概念，只能估摸着是清晨时分。
      借着微弱的光线，他努力翻找着药箱。

      没有找到退烧药，勉强翻出了一瓶有退烧效果的止疼药。
      这药还是马修哥前一阵子手腕受伤时买的。石马修很少叫疼，可他那时依然心疼坏了。

      朴乾煜扶着石马修迷迷糊糊地坐起身，又喂他迷迷糊糊地吃了药，重新把他塞回了被子。
      马不停蹄地做完这一系列事情，他才后知后觉地意识到自己也在发抖。

      -

      止疼药并不是毫无作用，至少石马修看起来没有刚才那么痛苦了，身体也不再发抖了。
      可是他的体温一直没有降下来，朴乾煜急坏了。

      不能再这么坐以待毙了。
      他第一次单独离开了公寓。

      -

      正如石马修上次探路的情况，朴乾煜连续下了几层楼，大门全都是紧锁的。
      他试图敲门，里面也无一人应答。

      又下了几层楼，情况开始发生变化了：有的房门不知被谁撬开了，大剌剌地敞开着。

      朴乾煜谨慎地敲门后进入，却发现里面的生活物资早就被扫荡一空，贵重的包包首饰却根本无人在意。
      他仔细地寻找着退烧药，始终一无所获，倒是发现了一根水银体温计和几包降温贴。

      在下楼的过程中，朴乾煜也遇见了几户居民，他用尽这辈子最真诚的语言向他们求助。

      可人们透过猫眼，只看见了一个面相并不好惹的高壮男人，此刻正喘得上气不接下气，用力拍打着自家的房门。
      像是走投无路，又像是来者不善。

      无论朴乾煜怎么解释自己只是想求一片退烧药、绝对不会伤害他们的，依旧没人敢给他开门，甚至有人隔着门板冲他怒吼：“滚远点！”

      他第一次感到了无比的绝望。

      -

      朴乾煜继续往下走了一层，他一边拍门，一边麻木地重复着请求：“请问有人在吗？我的家人发烧了，想求一片退烧药，无论什么条件都可以答应。”

      出乎意料的是，公寓内传来了一句疑惑的英语：“Excuse me?”
      朴乾煜愣了一下，马上切换成了磕磕巴巴的英语：“你好，我的家人生病了，请问……请问……”

      房门打开一条缝，露出了一双绿色的眼睛。
      这层的住户是一位年轻的异国男人，身形同样高大——或许这就是他愿意开门的原因。

      异国男人紧皱着眉头，继续用英语问他：“你需要帮助吗？我的食物和水也不是很多了。”
      “请问你有药吗？”朴乾煜非常着急地比划着，情急之下他忘记了“发烧”该怎么说，只能一个劲拍着自己的额头，不停做着夸张的动作。

      “你需要退烧药吗？”异国男人猜测着。
      朴乾煜更加听不懂“退烧药”这个词，他只恨自己光跟马修哥学会了怎么写英语歌词，却没记住这些基础生活词汇。
      他努力地一个词一个词往外蹦：“HOT!”、“SICK!!”

      异国男人眯起了眼睛，明白了他的意思：“稍等。”
      很快，他从屋里递出一片被修剪过的铝箔包装，里面装着两颗白色的药片。

      朴乾煜通过铝箔背面的韩文认出，异国男人给了他两颗退烧药。是马修哥的救命药。
      他激动地几乎要哭出来，连忙给男人郑重地鞠了一躬，嘴里不停地说：“谢谢！我替他谢谢你！”

      异国男人笑眯眯地问他：“He?Your boyfriend?”
      朴乾煜脱口而出：“No. My love.”

      -

      朴乾煜匆忙记了一下异国男人的楼层，就三步并作两步地飞奔回去了。

      还没等他赶到家门口，却先在楼梯间里遇见了脸色煞白的石马修。
      那副摇摇欲坠的模样看得朴乾煜的整颗心都揪了起来。

      “石马修你特么疯了？你不知道自己发烧了吗？？”朴乾煜头一次对哥哥发这么大的火。
      也不等他回答，打横抱起他就往家里走。

      石马修紧紧抓着朴乾煜的衣领，轻声解释道：“我醒了之后，找不到你，怕出事。”
      “我能有什么事？”朴乾煜又心疼又生气，咬着牙回答：“你生病了我才有事。”
      石马修没再说话，把头抵在了年轻人的肩膀上。

      -

      服下退烧药后，石马修被朴乾煜塞进了被窝。

      “其实我早就没那么难受了……”石马修试图坐起来，又被年轻人强硬地按倒，贴上了降温贴。

      石马修嘟嘟囔囔：“我今天还没喂Gia呢！”
      “我已经喂过了。”朴乾煜抿着嘴，专注地读着体温计：“38度5。哥在退烧之前，什么都不用操心。”

      石马修重新缩回被窝，乖乖地闭上了眼睛。
      朴乾煜一直坐在床边守着病号，直到他呼吸平稳，沉沉睡去才离开。

      -

      朴乾煜再次爬上了天台观察。

      此时太阳早已高高挂起，热浪夹杂着恶臭不断打在他的脸上，却不似昨天那般窒息。
      他凭体感判断，气温有所下降了。

      目光所及之处，洪水也在慢慢退去，地势高的地方已经渐渐露出了地表。
      远方偶尔传来几声尖叫，他听不清楚。
      依旧没有发现任何救援的存在。

      说不上这些迹象到底是好是坏，朴乾煜重重地叹了一口气，转身回了公寓。
      真希望马修哥能快点退烧。
  - title: Day 6
    body: |
      
      石马修再次醒来时，屋里一片漆黑。
      连那些偶尔会发出光亮的小家电，也在停电的这几天里耗尽了电量，叫人彻底失去了时间概念。

      他唯一能确定的就是自己睡了很久很久，久到把出道以来的所有日子在梦里重新过了一遍。
      他和朴乾煜明明是那么不同的两个人，却在这么长的时间里意外地合拍呢。命运可真神奇。

      可是醒过来，两人还是被困在这个小小的公寓里。

      -

      石马修出了一身汗，身上黏糊糊的，想擦洗一下。
      他坐起身，沿着床沿小心摸索，却摸到了一只温热的大手。
      他吓了一大跳，下意识缩回了手——他没想到朴乾煜会在床边守着自己。

      下一秒，那只手反握住了石马修的手。
      又伸来一只手摸了摸他的额头：“终于退烧了。”

      石马修脱口而出：“你吓死我了！！”
      “哥才是吓死我了，我以为……”朴乾煜顿了顿，没说出他之前可怕的猜想，“喝点水吧。”
      石马修接过水杯，咕咚咕咚地喝了大半杯。

      “现在几点了？”石马修问出口之后自己先笑了，捧着水杯自言自语着：“没有手机，Gunwookie应该也不知道吧……”
      “现在是中午了。”朴乾煜轻飘飘地扔下一句炸弹：“今天早上，天已经亮过了。”

      石马修花了几秒钟来消化这句话：“……然后又黑了？”
      他看不清朴乾煜的表情，却能听得出语气里的沉重：“是的。气温也在下降，我猜……很快就要下雪了。”

      -

      石马修忽然听见朴乾煜在床边洗毛巾的声音。
      他不知道从哪里变出了一条湿毛巾，递给了石马修：“哥擦擦身上吧，出了一身汗，肯定不舒服。”

      “谢谢。”石马修分明知道朴乾煜像他一样，在黑暗之中什么都看不见，却莫名地感到了一丝羞赧。
      他犹豫地脱下贴身的背心，用毛巾简单擦拭了胳膊和前胸，又小声问道：“怎么会在床边放毛巾呢？”

      “湿毛巾敷在额头上可以物理降温，”朴乾煜想起了什么，笑得格外灿烂：“哥是梦见我了吗？一直在热情地喊我的名字呢！”

      石马修愣了愣，他没想到自己还有说梦话的毛病，甚至还被当事人听见了。
      他没否认，低着声回答：“是梦见你了。”

      朴乾煜凑得更近了一点，近得呼吸都快要打在他的脸上：“是好梦吗？”
      害怕被朴乾煜听见自己震耳欲聋的心跳声，石马修支支吾吾地应付了过去。

      -

      气温越来越低了，Gia在屋里不安地踱着步，不时发出几声猫叫，最后干脆钻进了石马修的被窝。
      朴乾煜摸黑翻出来两件厚卫衣，两人一起换上了。他想起石马修盖的被子很薄，怕是抵御不住持续降温，又出去寻找足够厚的被子。

      石马修看不见朴乾煜的动作，却一直听见东西落地的声音，想来肯定没少磕磕碰碰。
      他心疼极了，身体却使不上劲，不愿帮了倒忙。

      ——古代没有电，那时的人们是怎么照明的呢？
      想到这里，石马修立刻激动地爬了起来，在卧室柜子里摸索着。

      之前朴乾煜送给过他一个卡西法的香薰蜡烛礼盒，他一直摆在柜子上，一次都没舍得点过。
      而现在正是它能发挥最大价值的时机。

      很快，石马修就找到了礼盒，里面除了蜡烛，还有一盒火柴。
      他凭感觉划动着火柴，没着。又划了一下。
      在黑暗里呆了太长时间，溅起的火星甚至让他感到了陌生。

      在烛火亮起的瞬间，他激动地朝屋外大喊：“Gunwookie！快来看！！”
      朴乾煜跌跌撞撞赶回卧室，透过微弱的烛光看见了石马修兴奋的脸庞，他也跟着笑了：“哥怎么这么厉害呢？”
      “还是多亏了Gunwookie。”石马修虔诚地捧着蜡烛，露出了这几天以来最幸福的表情。

      -

      他们把香薰蜡烛摆在床对面的电脑桌上，勉强能够照亮整个屋子，不至于再摸着黑走路。

      朴乾煜深吸了一口蜡烛散发的木质香气，干笑了两声：“早知道有今天，当时就多送给哥几个了。现在就算有钱，也花不出去了。”
      “说什么呢？”石马修戳了戳他的胸口：“能有一丝光亮，我已经是谢天谢地了。”

      两人都没什么胃口，共同分享了一包泡面。燃气停了，水也剩的不多，干啃就成为了唯一的选择。
      再喝上几口冰冷的水，就这么又糊弄过了一餐。

      吃完就并排坐在床上发呆，顺便节约点力气。
      他们在等——等晴天，等救援，等……终点。

      -

      “怎么感觉窗户漏风呢？”朴乾煜嘟囔着，又把两人身上的被子裹紧了一点。

      石马修没回答，只是扭头看着他。
      他发现年轻人的脸颊在这几天里迅速消瘦了。

      朴乾煜随意地捏了捏石马修的手，却大吃一惊：“哥的手怎么这么凉？！”
      他连忙用双手捂住，不停地摩挲着，试图把手心的温度传递给哥哥。

      “我不冷，”石马修温柔地笑笑：“之前巡演的时候，你也是这样给我暖手的。Gunwookie总是对我这么好。”
      朴乾煜没好气道：“我不对哥好，对谁好？”他继续碎碎念：“哥总说自己是Hot Boy，冬天里穿得比谁都少，怎么会不冷呢？我总摸到你的手是冰的。”

      石马修仿佛陷进了甜蜜的回忆里，微笑地低着头，默许了朴乾煜的唠叨。

      -

      到了晚上，房间里的温度越来越低了，两人呼吸间都能吐出白气，放在床边的水杯几乎结了冰。

      石马修轻抚着趴在他怀里取暖的Gia，叹了口气：“气温怕是在零下了。”
      朴乾煜还是觉得被子不够厚。他连忙爬起来，把三个人所有的被子和厚外套都一股脑地堆在了石马修的床上，然后重新钻进了被窝——就这几分钟的功夫，他都差点被冻僵了，好一会儿才缓过来。

      两个人身上裹着羽绒服，藏在被子里的身体也紧紧地贴在一起。偶尔脚碰到一起，下一秒又会默契地移开。
      烛火在微微摇曳着，木质香气散得更快了——真的有风刮了进来。

      “哥，你现在感觉怎么样？”朴乾煜盯着石马修苍白的嘴唇，又摸了摸他的额头。
      气温下降得太快，他怕石马修再烧起来。

      石马修勉强扯了扯嘴角：“我还好，你呢？”
      “我也是。”朴乾煜摇摇头，伸出胳膊环住了男人的腰，把脑袋靠了上去。他不知道怎样才能让石马修暖和起来，只想尽可能地把体温传递给他。

      石马修用右手搂住朴乾煜，轻轻拍着他的后背。
      他们从前很少有如此沉默的时刻。

      两人就这么互相依偎着，在不知不觉间睡着了。

      -

      烛火灭了，空气里只留下了沉重的香气。
      窗外，暴雪开始落下。
  - title: Day 7
    body: |
      　　
      暴风裹挟着雪粒拍打在公寓的窗户上，砸得玻璃砰砰作响，寒风呼啸着穿过楼道，留下了阵阵闷响。
      冷气从四面八方渗入公寓，叫人根本无处可躲。

      这绝不是石马修在加拿大熟悉的那种安静的雪天。
      故乡的雪只会温柔地覆盖大地，从不会伤人。

      可他竟然快要死在首尔的雪里了。

      石马修不喜欢哭，但眼泪止不住地滴了下来。
      他还没带过朴乾煜回温哥华看雪呢。
      不该结束在这里的。

      -

      暴雪落下后，窗外变得灰蒙蒙的，室内总算有了微弱的光线。

      睡梦中的朴乾煜感觉到怀里的人在颤抖，下意识搂得更紧了一点。伸出手想试他的额温，却摸到了一把逐渐冰凉的泪水。
      朴乾煜立刻惊醒：“马修哥！身体不舒服吗？”

      石马修深吸一口气：“我没事。”
      “怎么哭了？”朴乾煜的声音很低，小心翼翼的。

      石马修紧咬住自己的嘴唇，摇了摇头。
      朴乾煜叹了口气，伸手梳了梳他额前的碎发：“有我在呢。”

      -

      石马修试图平复自己的情绪，却感觉手脚发麻，思维也变得迟缓。
      他脱口而出：“好冷……”

      朴乾煜用力揉搓着石马修冰冷的手，却怎么都捂不热。
      他心一横，脱下了身上的外套和卫衣，穿着一件单衣，紧紧贴在了石马修背上。

      “你……你干嘛？”石马修吓了一跳，连声制止：“你不要命了？你会被冻坏的！”
      朴乾煜不以为意：“这样温度传递得最快。”

      石马修愣了几秒，才听懂他的意思。
      他犹豫地脱下了身上厚重的衣物，最后只剩下一件背心，钻进了朴乾煜的怀抱。

      两人面对面拥抱着，交换着彼此的呼吸。

      朴乾煜的体温让石马修感觉舒服了一些，但手脚还是僵硬得厉害，意识也逐渐模糊。
      他极其艰难地开口：“Gunwookie，如果我死了……”

      朴乾煜听到“死”字，立马伸手捂住了他的嘴：“我不会让你死的。”
      石马修挣扎着想说点什么，朴乾煜却不给他任何说话的机会，一词一顿：“我们、必须、一起、活着、出去。”

      石马修想说，我不想再被折磨下去了，太冷了，太累了，撑不下去了。
      我死了，或许你也能轻松一点。

      可是对上朴乾煜那双湿漉漉的眼睛，石马修说不出这么残忍的话。
      他点点头，假装闭目养神，眼尾却静静地流着泪。

      -

      降温仍在持续，依靠彼此的体温来取暖显然不够。

      石马修难受到了极点，甚至说起了胡话：“好热……”
      他想要挣开拥抱，却被朴乾煜死死按在怀里。

      朴乾煜清楚地知道那是什么意思。

      顾不上那么多，他只想留住面前的男人。
      他近乎疯狂地呼喊道：“马修哥，马修哥，快醒过来！不要睡！不能睡啊！！”
      又四肢并用地将石马修圈在自己怀里，不断摩挲着他的后背，希望他能暖和起来。

      可收效甚微。

      看着石马修渐渐灰白的脸，朴乾煜终于忍不住哭了出来，眼泪和鼻涕狼狈地流得到处都是。
      “醒一醒啊马修……”他不停地亲吻着男人的额头：“我还有好多话没跟你说呢……”

      -

      昏迷中的石马修听见了朴乾煜的每一句哭喊。

      他的心碎成了一片一片，却连一句回应都说不出口。
      只好在心底怒骂老天爷不长眼，害得他们共同经历了这么多磨难，却连一个告别的机会都不肯给。

      寒意袭来，他的意识再次模糊了起来，陷入了彻底的昏迷。
  - title: Day 0
    body: |
      　　
      拖着行李箱的金泰来站在石马修的卧室门口翻了个白眼，接着叩响了敞开着的房门。
      他的嗓门不小：“二位醒醒，太阳都快要下山了。”

      闻声，石马修迷迷糊糊地睁开了眼：“泰来啊……”
      “经理联系不上你俩，都快急死了。”金泰来打量着床上相拥的两人一猫：“你给他回个电话。”
      “知道了……”石马修随口应付道，他头痛得要裂开了。

      临走前，金泰来无力地吐槽道：“我回天安的几天里，你们不会一直保持着这个姿势吧？”
      没人回应。Gia连眼睛都懒得睁开，甩了甩尾巴。

      金泰来对着再次昏睡过去的石马修摇了摇头，贴心地关上了门。

      -

      朴乾煜比石马修早醒了几分钟。
      先是紧张地试了试他的呼吸，又仔细地检查了他手脚的温度，总算放下心来，安静地盯着他的睡颜。

      他第一次如此害怕失去某个人。

      -

      石马修睁开眼，正对上了朴乾煜的笑脸。

      他没好气道：“高兴什么呢？”
      朴乾煜胡乱亲了亲他的额头：“哥的身体好多了，气温似乎也恢复正常了。”

      石马修低垂着眼，害羞得耳尖都红了。
      他像是想起来什么似的，岔开了话题：“对了，你昨天说有好多话想跟我说，是什么？”

      “那个……”朴乾煜有些吃惊，他没想到石马修都听到了。
      他整张脸都红了，支支吾吾：“就是，就是……”

      突然传来了敲门的声音，把两人吓了一大跳。
      金泰来站在屋外没耐心道：“清醒了没有？醒了就赶紧给经理回电话，大半天没消息他还以为你俩私奔回加拿大了。”

      床上的两个人同时僵住了。
      金泰来怎么可能这个时间出现在家里？？

      -

      石马修一个激灵爬了起来，拿起放在床头的手机，一气呵成地解了锁。
      它本该是一块早就没电的板砖，现在却密密麻麻地弹着未读的推送。

      他抬头望向朴乾煜，满脸难以置信。

      朴乾煜的声音有些颤抖：“今天是……几号了？”
      “1号！也就是断网的那一天！”石马修激动极了，把手机扔给了朴乾煜，让他自己看。

      朴乾煜慌张地打开搜索引擎，接连搜索了“暴雨”、“洪水”、“世界末日”等字眼，可是什么都没搜到。
      “我们……回来了？”他带着几分不确定，又带着几分茫然：“那一切全都是一场梦吗？”

      石马修摇摇头，伸手指了指电脑桌。
      朴乾煜顺着他的指尖看去，发现了桌子上燃尽的蜡烛，空气里仍残留着沉重的香气。
      他倒吸了一口冷气：“或许是新的开始吗？”

      紧接着，朴乾煜又像是想起了什么，赤脚跑到卧室的窗边，用力地拉开了窗帘。

      刺眼的阳光照在两人身上，窗外万里无云。

      -

      石马修忽然笑了，他温柔地注视着阳光下的朴乾煜，伸出手捏了捏他的脸颊：“脸颊肉也回来了。前几天都饿瘦了。”
      “哥怎么一点都不紧张……”朴乾煜撅着嘴，双手搭在男人的肩膀上，轻轻摇晃着。

      “反正还是和Gunwookie在一起，我又有什么可紧张的呢？”石马修笑得眼睛眯成了一条缝：“哪怕是再死一回。”
      朴乾煜连忙捂住他的嘴：“呸呸呸！说什么呢？”

      石马修抛出了先前的问题：“所以，你本来要跟我说什么来着？”
      朴乾煜顿了顿，正准备面红耳赤地讲出心里话，却没想到——石马修踮起脚尖，在他的嘴唇上蜻蜓点水般亲了一下。

      这个吻让朴乾煜从脖子红到了耳尖。

      石马修正要退开两步，却又被朴乾煜揽着腰拖了回来。
      他直勾勾地盯着石马修那双狐狸似的眼睛。
      那双眼里没有戏弄，只有浓烈的爱意。

      朴乾煜拇指揉搓着男人的唇瓣，低声道：“可以吗？”
      石马修用力点点头，笑眯眯地抱紧了他。

      -

      挨完经理的骂，朴乾煜终于有了生活回到正轨的实感。
      “这么久没回消息，经理真的气坏了。”他长叹了一口气：“好消息是，至少到目前为止，这个世界一切正常。”

      石马修笑得前仰后合：“那以后呢？”
      “管他呢，”朴乾煜把脑袋埋在石马修的颈窝，哼哼唧唧：“只要跟哥在一起就好。”

      窗外阳光明媚，一切都好极了。
  - title: "?"
    body: |
      
      两个人在公寓一楼百无聊赖地等着电梯。
      电梯门打开，走出来一个身型高大的异国男人。

      朴乾煜专注地玩着手机，没注意到来人，擦肩而过时被他拍了拍肩膀：“Hey! So happy to see you again!”
      抬头对上了那双深绿色的眼睛，朴乾煜的记忆瞬间涌出。
      是那个愿意给他退烧药的人，他也记得。

      “Hello!" 朴乾煜激动地握住了男人的手，结结巴巴地讲着英文：“那天真的太感谢你了，我能做什么报答你吗？”

      异国男人摆摆手，他好奇地在两人之间来回打量着说：“Was he…”
      朴乾煜立刻回以灿烂的微笑：“Yes!"
      男人也很高兴，简单道别后走远了。

      坐电梯的时候，石马修拽着朴乾煜的袖子不停发问：“他是谁呀？你们什么时候认识的？没听说你还有个外国朋友呀？”
      朴乾煜故作神秘道：“SECRET!”

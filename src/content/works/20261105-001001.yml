title: 番茄炒蛋是地球上最好吃的东西吗
updated: 2025-08-20
summary: 这个问题小编也不是很清楚。
status: finished
chapters:
  - body: |
      

      “你找谁啊？”石马修隔着猫眼打量着门外的男人，凌乱的刘海几乎盖住了眼睛，莫名给人一股阴沉的感觉。
      男人沉默良久，才吝啬地吐出几个字：“……搬书。”

      石马修这才想起来，他老公前几天在书房整理出十几箱旧书，说是要捐给福利机构，会有专人来收。
      他连忙拉开大门，请人进来，又指了指去书房的路。

      男人个子很高，穿得也朴素，背心加短裤让宽肩细腰的好身材一览无余，身上的肌肉清晰流畅，这显然是常年进行体力劳动的结果。
      他一言不发地从石马修的身旁经过，空气里顿时弥漫着一股无法忽视的巧克力气息，浓郁香醇却又有一丝苦涩。

      石马修在心底暗暗感叹着：哇哦，Alpha。
      哇哦，还是快到易感期的Alpha。

      -

      石马修身穿丝质长袍，看似优雅地端坐在沙发上，随意切换着电视频道。实则肆无忌惮地往空气里释放着自己的信息素，甜蜜的黄油香气里满溢着明晃晃的渴望。
      他迫不及待地想要看见年轻Alpha慌乱的模样。

      起初，男人只是皱了皱眉，扛起箱子朝屋外大步走去，似乎完全没受到信息素的影响。

      搬完五箱后，石马修见男人的额头不停滴汗，脸颊也染上粉红，于是故意问他：“空调温度是不是太高了呀？怎么会热得满头大汗。”
      面红耳赤的Alpha没搭理他，咬着牙扛起了新的一箱。

      只剩最后两箱的时候，石马修早已不再满足于言语上的戏弄，他想戳破男人冷淡的伪装。
      他光着脚踩在地板上，快步走到Alpha身边，把手紧紧贴在男人精瘦的腰部，边摸边装模作样地惊呼道：“你身上……真的很烫。”

      他踮脚凑到Alpha的耳边轻轻吹气，一路向下的手几乎要探进短裤里，又不怀好意地开口：“是不是因为易感期要到了？”

      男人一把握住石马修那只不老实的手，眉头紧皱，语气不善：“想干嘛？”
      空气里逐渐变甜的信息素却泄露了他的情绪。

      石马修的脸上丝毫没有被抓包的羞愧，只是没心没肺地耸耸肩，口吻轻佻：“老公不在家，随便找人玩玩咯。”
      说完，他反握住男人的大手，顺势放到了自己浑圆的屁股上。

      -

      过于柔软的触感让朴乾煜意识到，石马修的睡袍下面什么都没穿。

      忽然，他的态度有了一丝松动，试探性地捏了两把饱满的臀肉，手指深深地陷在肉里。
      Alpha下手一惯没轻没重，不知是太痛还是太爽，石马修不自觉地发出一声甜腻悠长的呻吟。

      朴乾煜顿时就听硬了。

      他的耐心本就所剩无几，更何况是在易感期前。
      心底的Alpha不停在叫嚣着，恨不得将眼前的Omega生吞活剥，是他自找的。

      朴乾煜直接抬手扯烂了男人的真丝睡袍，露出大片光洁的肌肤，睡袍下果然一丝不挂。
      随即用力地抚了上去，力度大到几乎要留下红肿的指痕。

      想不到Alpha居然如此急躁，石马修震惊地张着嘴巴，都忘记出声阻止。
      见状，朴乾煜终于露出了进门后的第一个笑容，故意用挺立的性器蹭了蹭Omega的腿根：“你不是就想要这个吗？”

      回过神来的石马修，对着身上仅存的布料嘟囔：“我老公送给我的睡袍，你就这么撕坏了……”
      “不穿更好。”朴乾煜干脆伸出手把人扒了个精光，将那件真丝长袍彻底送进了垃圾桶。

      -

      只用了两根手指草草扩张，朴乾煜就很不耐烦地掰开石马修的一条腿，从后面径直捅了进去，接着毫不留情地挺动起来。

      “呜……Alpha……慢一点……”石马修唯一的支撑就是身下的餐桌，可他的力气太小，根本握不住桌角，身后的男人又要得太急，顶得他几乎趴倒在坚硬的桌板上，连站都站不稳，只得连连求饶：“不要了……呜呜……慢点……”
      男人没好气地“啧”了一声，果然放缓了动作。

      在朴乾煜稳定的输出下，石马修很快就尝到了甜头，屁股撅得越来越高，性器也颤颤巍巍地立了起来。
      他胡乱地用手揉搓着前端，口中的呻吟一声比一声高亢：“Alpha……好舒服……嗯……好会插……”

      注意到石马修偷偷自慰的动作，朴乾煜的大脑顿时被Alpha天生的控制欲所占据。
      他毫不犹豫地抓住了男人的双手，用力反剪到身后，拽着手腕便开始狠狠挺动，每下插得既重又急，两人的交合处带出了阵阵白沫。

      不再顾忌Omega的感受，朴乾煜知道他会喜欢的。

      “不行……要到了……呜……”石马修被猛然加速的Alpha顶得神智不清，双臂被压制的姿势让他动弹不得，只能被动地承受着粗暴的动作，几乎被逼出生理泪水，可是心理上却感到意外的满足。
      什么都不用想，只需要趴在这里乖乖挨操就够了。

      也许过了几分钟，又或者是几十秒，石马修再也坚持不住了，头脑一片混沌，尖叫着泄在了餐桌上。

      朴乾煜见状也不再继续折磨他，大开大合地抽动几次后，深深地射在了Omega的穴里。

      -

      进入不应期的Alpha却没有拔出，整个人都压在石马修的后背上，有一搭没一搭地舔弄着Omega裸露在外的腺体，享受着高潮后的余韵。

      “朴乾煜，”朴乾煜顿了顿，补充道：“你可以叫我的名字。”
      石马修笑眯眯地回头看他，表情像极了一只餍足的猫，却意外地吐出了冷酷的话语：“打个炮而已，我为什么要知道你的名字？”

      朴乾煜倒没有生气，只问：“怎么不跟你老公做这种事？”
      石马修像是想起了什么好笑的事情，眉飞色舞道：“你知道吗？网上都说「Alpha一过二十五，就是五十二了。」”

      闻言，朴乾煜的脸顿时黑了：“二十五怎么了？”
      “不行了呗！”石马修笑得前仰后合，连身体都在跟着抖动，一时间忘记了自己当下的处境，也忘记了易感期边缘的Alpha会有多么敏感。

      或许是被戳到了痛处，满脸不爽的朴乾煜一把捂住石马修的嘴巴，就着刚才的姿势毫不留情地贯穿了他，直奔着Omega的生殖腔而去。
      没有真正地插入，却在边缘处极其危险地试探。

      “啊啊啊啊啊帕果努你这臭小子！”石马修胡乱扑腾着两条腿，试图让男人拔出来，大声控诉道：“什么时候又硬了！为什么提前不说一声？你这样袭击Omega是要被警察抓起来坐牢的知道吗？！”

      朴乾煜轻飘飘地吐出四个字：“自证清白。”
      说完，便不再理会口嫌体直的石马修，握住他的腰身快速挺动起来。

      -

      朴乾煜把蜷缩着的石马修抱在身前，缓慢而稳定地进出着。他直勾勾地盯着男人些许迷离的双眼，忽然开口：“好多水。”
      话音刚落，Omega的后穴便狠狠痉挛了两下，接着争先恐后地涌出了更多的热流，随着交合的动作不停滴落到地板上。

      伸出手摸了摸男人泥泞不堪的腿根，朴乾煜轻笑着摇头：“没见过这么能喷的。”
      “臭小子……嗯……你才操过几个人……”石马修哼哼唧唧地说着挑衅的话，四肢却紧紧地缠在Alpha身上，他可不想做到一半被扔到地上之类的。

      “知识储备又不等于实战经验，”朴乾煜气定神闲地回答：“操过你就足够了。”

      石马修的心顿时猛跳了两下，下意识地咬住唇，却根本无法止住嘴里的呻吟，身体里的快感一波接着一波，地板上的水也越来越多，欲望像是永远不会枯竭。

      他开始感到害怕，不停推搡着年轻人结实的腹肌，试图让他停下动作，却被朴乾煜衔住了胸前的乳钉，不知轻重地撕扯起来。

      “痛、好痛……”石马修一边大声呻吟着，一边拼命挺起自己的胸脯，本能地想要男人吸得更深一点。
      他很迷恋这种痛苦，朴乾煜当然也没有停下来。

      -

      朴乾煜做惯了体力活，长时间抱着石马修也没有觉得辛苦，反而让他寻到了新的乐趣：只需要轻轻提起Omega的腰，地心引力自然会带他去到更深的地方。

      又一次擦着生殖腔入口而过的时候，石马修终于忍不住哭喊出声，灭顶般的快感让他不受控制地流下眼泪：“想要……呜……给我吧……”
      “不行。”朴乾煜斩钉截铁地拒绝，身下动作却丝毫未停，他喘着粗气，恶狠狠地恐吓道：“你就这么想怀孕吗？”

      满脸泪痕的石马修点点头又摇摇头，他被顶得说不出完整的句子，只能吐出支离破碎的呻吟：“呜……Gunwookie……求你了……”

      朴乾煜有原则，但不多。
      抗拒不了天性也是人之常情。

      他直愣愣地顶进了Omega狭窄的生殖腔，猛插几下后，浓稠的白浊彻底洗刷了柔软的内壁，顶端在欲望的催化下不断膨胀，最终形成了无法拔出的结，严丝合缝地卡在了男人的生殖腔里。

      而石马修直接在被Alpha成结的高潮中昏了过去。

      -

      “明明每次操生殖腔都会晕，偏偏每次都喊着要操……”朴乾煜把脑袋埋在石马修的颈间，闷闷地笑道：“我们马修还真是贪心啊……”
      又不停吻着他汗湿的碎发，耐心等待结的消散。

      -

      意识逐渐恢复后，石马修发现房间里的信息素浓度已经高到让他头晕目眩的程度。

      “不、不能再做了……”两轮过后，被插得双眼失神的石马修喃喃自语：“我感觉快要发情了……”
      “嗯？”朴乾煜故意用半硬的性器戳了戳他的臀肉，玩笑道：“正好我还没爽够呢，小骚货。”

      “可是我老公快回家了……”石马修有气无力地提醒，又努力朝他使了个眼色，示意到这里该结束了。
      “是吗，”朴乾煜压低嗓音，手指狠狠碾过Omega的乳钉，坏笑着说：“你也不想被你老公发现吧？”

      对于朴乾煜的拒不配合，石马修有些恼火，几乎想要骂他几句，遇上这种倔牛，多好的地都会被耕坏的。

      忽然，放在餐桌上的手机响了。
      “接电话去。”石马修紧抿着唇，用力地推开了Alpha，抬腿朝着浴室走去。

      急切的两人根本没有做任何防护措施，一股又一股的白浊顺着Omega颤抖的大腿流了下来，星星点点地滴落在地板上。

      -

      朴乾煜背对着石马修接起电话：“好的，我在家，你按门铃吧。”
      不经意间闻到了空气里的淫靡气息，他叹了口气：“算了，稍等一下，我给你送下去。”

      -

      石马修原以为朴乾煜接完电话会跟上来，想不到听见的却是沉重的关门声。

      什么人呐，提上裤子就走人了？！！

      他站在花洒下面，泄愤似的抠挖着自己的后穴。
      那地方被过度使用后又红又肿，他却像是毫无所觉，恨不得弄得再痛一点、记得再深刻一点才好。

      两人的体液乱七八糟地纠缠在一起，在水流的冲刷下，最终共同汇入了下水道。

      石马修觉得有点委屈。

      -

      几分钟后，推门进屋的朴乾煜闻到了黄油烧焦的呛人味道。
      用屁股想也知道是他把石马修惹毛了。

      朴乾煜挠挠脑壳，想不通石马修突然生气的原因。
      刚才不是演的挺好的吗？且不说搬运工的人设把握得相当准确，就连台词都是他熬夜学习Alpha片，一句句摘抄下来的精华。

      他以为石马修还在浴室清理，匆匆忙忙拉开玻璃门却只见到满屋的水蒸气。
      在屋子里转了一圈，没见到人影，最后在次卧发现了安静地蜷缩在巢穴里的石马修。

      两人同居后，石马修便不再需要睡在巢穴里来获得安全感，朴乾煜会保证他的身上时时刻刻沾满巧克力信息素。
      但筑巢是Omega永远无法舍弃的本能，两人把它搬进了次卧。朴乾煜只有在出差前，才会往里面扔几件带着自己气味的衣服，免得石马修一个人在家时太过寂寞。

      看来这下真是气得够呛。

      -

      以为人睡着了，朴乾煜蹑手蹑脚地走近，却听见了石马修怒气冲冲的呼吸声，被子也跟着上下起伏，像是随时要蹦起来和谁打上一架似的。
      他觉得又可爱又好笑，没忍住发出“扑哧”一声。

      暴怒中的石马修听见笑声，立刻回过头张牙舞爪地质问他：“你笑什么？还有，你刚才死哪儿去了？！”
      “才几分钟没见，哥就想我了？”朴乾煜嬉皮笑脸地贴上去，双手把人紧紧箍在被子里：“你老公不是快回来了吗，那野男人只好灰溜溜逃走了。”

      “滚远点——”石马修在被子底下扑腾着双腿，却被朴乾煜搂得死死的，只好耍嘴上功夫，不断口吐芬芳。
      朴乾煜悄悄释放出信息素包裹住Omega，嘴里安抚道：“哎呀，刚才搬书的师傅过来了，家里现在又不方便让人家进来，我只好送下去了。”

      石马修的怒气似乎正在消散，他瞥了朴乾煜一眼，狐疑地问道：“真的？”
      “真的！”朴乾煜把人拥得更紧了一点，笑眯眯地开口：“一搬完，我就快马加鞭地跑回来了！”

      石马修翻个白眼：“别说那些我听不懂的词！”

      -

      见石马修心情有所好转，朴乾煜掀开被角，丝滑地钻进了Omega的被窝。又有些心虚地开口：“哥今天是不是对我的表现不太满意？”
      石马修又翻个白眼：“相当不满意！特别不满意！”

      “那依您看，我哪里还能改进呢？”朴乾煜一贯是很上道的，与其猜石马修的心思，不如直接问出来。
      在此之前，他先把人在怀里按紧了，免得待会再扑腾。

      “一点前戏都没有！”
      “好的，不过我认为这是情节设定。”

      “也没有Aftercare！！”
      “其实本来是有的——临时接了个电话，耽误了时间，下次坚决不接了。”

      石马修撇撇嘴，抱怨的声音也越来越响：“而且在我喊停之后还一直不停！”
      “可是真的是要停下吗？”朴乾煜顿了顿，无奈道：“做爱的时候，哥的每句话都像是在跑火车。我分不出来是真是假。”

      “当然是真的啊！”石马修直接急了，却被年轻人轻易地压制住了。

      尽管朴乾煜的脸上写满了不相信，他还是想了个不错的主意：“那哥选一个安全词吧，以后说出这个词，我就知道该停下来了。”
      “但是这个词又不能太常见，要不然会产生误会。”

      石马修哼哼唧唧了半天，最后吐出了没头没尾的四个字：“FAN、QIE、CHAO、DAN！”
      朴乾煜自然是听不懂中文的：“什么意思呢？”

      “地球上最好吃的东西。”石马修摆摆手，懒得跟讨厌番茄的人讲话，在朴乾煜怀里寻了个舒服的姿势睡着了。

      -

      朴乾煜原本最讨厌的东西是番茄。
      在这天之后变成了番茄炒蛋。

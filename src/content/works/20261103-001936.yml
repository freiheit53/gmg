title: 马帕乡村爱情
updated: 2026-05-03
status: ongoing
chapters:
  - title: "01"
    body: |
      　　
      硬座车厢里男人们身上的汗臭味混合着劣质香烟的焦苦味熏得石友萱直想流眼泪。
      她从来没觉得自己是个娇气的人，在整个石家屯儿里，没有男人犁地比她还快，也没有女人挑的担比她更重。
      一点臭味又算得了什么？她帮爹妈挑粪浇地的时候，连眉毛都不会皱一下，更何况是——

      不知是哪个天杀的偷摸脱了鞋，一股浓烈的脚臭直冲鼻腔，石友萱实在没忍住，干呕了两下。
      正打瞌睡的朴敢旭闻声清醒过来，一脸担心地看着女人：“媳妇，你咋了？”
      石友萱紧紧捂着嘴，额角挂着几滴冷汗。
      朴敢旭似乎想到什么，瞬间瞪大了眼睛，视线不断飘向她平坦的小腹：“该不会是……有了吧？”

      石友萱想不通男人是怎么联想到那里去的，伸出闲着的那只手狠狠地锤了他一下，又羞又臊地吐出两个字：“晕车。”

      朴敢旭恍然大悟，他从随身的斜挎包里掏出了一块白馍馍，递给石友萱：“吃点，能压一压。”
      石友萱无语地摆摆手，她知道男人的鼻子惯是不灵的，却也没想到周围的毒气竟不能影响他分毫。

      再香的馍馍放到这车厢里都变臭嘞！

      绿皮火车在旷野中晃晃悠悠地前进着，石友萱不知不觉迷糊了一会儿，很快又被臭味熏醒。
      再一转头，朴敢旭却不见了。她只当男人是去解手，没当回事儿，头一沉又睡着了。

      石友萱这一觉居然睡得很香，嘈杂的车厢和呛人的臭味都已离她远去，颠簸的火车似乎变成了小时候的摇篮。
      她梦见自己和朴敢旭包下了一整个山头，山上种满了她爱吃的水果，一年四季都有不同的果子吃。
      朴敢旭个子高，用力一蹦就能摘到树顶上最甜的果子，她捧着竹筐站在一旁，两个人各司其职，忙得不亦乐乎。

      今天的筐里装满了橙黄透亮的橘子，个个饱满圆润。
      石友萱剥开一个橘子，顿时清甜的汁水四溅，入鼻是阵阵橘子特有的香气，又带着微微的苦涩。
      她忍不住深深地吸了几口，嘴角也愉悦地上扬。

      石友萱微笑着缓缓睁开眼睛，时间约莫着是后半夜了，车厢里没人聊天，只剩此起彼伏的鼾声。
      她整个人几乎趴在了朴敢旭的怀里，男人拥着她的后背，头轻轻地垫在她的肩膀上。

      任谁来看，他们都是拥抱的姿势，还是最密不可分的那种——意识到这点后，石友萱悄悄地红了脸颊，把头埋得更深了一些。

      这时，她却意外地嗅到了梦里的那股清香。
      只不过比起甜味，苦味更加明显一些。

      可是，这里怎么会有橘子呢？
      绿皮火车上怎么可能会有橘子呢？

      过了一会儿，石友萱摸索着从朴敢旭的怀里掏出了几片干瘪的物件，既不柔软也不光滑。
      借着昏暗的灯光，她难以置信地看了又看，闻了再闻，才终于确认，气味的来源是这些皱皱巴巴的橘子皮。

      朴敢旭居然真的为她找到了橘子。

      石友萱把橘子皮捧在掌心，极其珍惜地嗅着，忽然明白了自己不再晕车的原因——果香完全掩盖了车厢里的臭味，难怪她觉得好受多了。
      热流不断从她的胸膛涌过，匮乏的语言表达不出此刻的心情，她也想要为朴敢旭做点什么。

      石友萱把唇贴上朴敢旭的耳朵，胡乱地亲了几口，见他没有反应，又轻声呼唤着：“旭……”
      手不老实地顺着胸口一路向下，毫无阻力地伸进了男人的裤裆，握住便直接撸动起来。
      因而性器醒得要比熟睡着的朴敢旭更早一点。

      等到那东西彻底抬头，石友萱俯下身子，伸出舌尖从裂口处缓缓划过，充分湿润过后，进而含住了整个顶端，卖力地舔舐着。

      朴敢旭在过度的刺激中睁开眼，以为自己还在做梦，大手下意识地抚上女人的后脑勺，用力地按了下去。
      石友萱的嘴巴被男人彻底塞满，连呼吸也变得困难，无助地“唔唔”了两声，又伸手拧了拧他的胳膊。

      持续的痛觉让朴敢旭终于意识到这并不是一场过分真实的春梦。
      想起他们还呆在拥挤的绿皮火车上，朴敢旭顿时又惊又气，想要把无法无天的石友萱揪起来，却又无法舍弃源源不断的快感，一时陷入两难。
      环顾四周，没人醒着，但随时可能有人醒来。朴敢旭立刻脱下外衫，罩在了女人的头顶，挡住了所有可能的视线。

      他拼命忍住呻吟的欲望，咬牙切齿地开口：“你早晚有一天得要了我的命。”
      石友萱眼睛亮晶晶的，透过外衫的缝隙看向他，嘴边动作却不停，发出啧啧的水声：“旭不喜欢吗？”
      “……不喜欢。”朴敢旭整张脸都憋红了，却依然嘴硬，他不想鼓励女人以后再做这种危险的事情。

      石友萱以为自己没能让朴敢旭舒服，舔得更加卖力了，双手扶住末端，快速地吞吐着整根性器。
      朴敢旭爽到说不出一句完整的话，捏住她的脸颊，还是没忍住顶了几下胯，石友萱笑眯眯地照单全收：“就说你不可能不喜欢的。”

      没过多久，朴敢旭眼前直冒白光，他连忙提醒身下人：“我、我快到了……”
      他本意是让石友萱早点撤开，免得被液体呛到，得到的回答却是女人愈发深入的吞咽，那种温度和触感都是他无法想象的。
      朴敢旭瞬间缴械，洋洋洒洒地喷在了石友萱的喉咙里。

      而石友萱只是轻咳了两声，接着躺倒在他的大腿根，脸颊紧贴着男人半勃的性器，一脸无辜地望着他，亮晶晶的狐狸眼一眨一眨。
      朴敢旭被这淫靡又纯情的画面弄得面红耳赤，赶忙提上了裤子，把那个还在兴奋的东西藏了起来。

      他低着头故作严肃地教训：“以后不许这样了！”
      “知道啦。”石友萱自知今天的举动过分了，不好意思地吐了吐舌头，眼尖的朴敢旭却在她的舌尖发现了一丝可疑的白浊。

      老天爷，他早晚要死在石友萱的手里。
  - title: "02"
    body: |
      　
      某天晌午，金贵斌和朴敢旭并排蹲在路边啃干粮的时候，正好撞见沈全锐开着他的那辆黑色轿车，风尘仆仆地驶向通往石家屯儿的泥地。

      “娘的，快别看你那破书了！”金贵斌突然怪叫一声，吓得朴敢旭一个激灵。
      “可别怪当兄弟没提醒你，看好你媳妇！”他用手肘使劲捣了一下朴敢旭，嘴里嘟囔：“万一哪天真跟沈家那小子跑了，你哭都没地儿哭。”

      朴敢旭皱着眉头，出声制止：“别胡说，友萱姐不是那样的人。”
      他紧紧盯着手里的课本，却一个字都读不进去，只得叹了口气，“今年地里收成不好，她去沈夫人那儿做点活计，补贴家用。”

      “什么活还得让大少爷亲自来接？”金贵斌瞪大了眼睛。
      朴敢旭摇头：“谁跟你说他是去接友萱姐的呢？”

      -

      很快，沈全锐的车回来了。
      副驾驶坐着的偏偏正是石友萱。

      没等两人看清楚女人的神情，那辆轿车又一溜烟儿地跑远了。驶过之处，扬起了阵阵尘烟。
      眼尖的金贵斌立刻站起身来，大叫出声：“瞧瞧！瞧瞧！我刚刚说什么来着？！”

      朴敢旭当然也看见了，咬了一大口干粮，继续低头读他的书。
      午饭是石友萱前两天蒸的白馍，刚出锅时蓬松香甜极了。只可惜现在变得又干又涩，竟噎得他一句话都说不出来。

      -

      半夜三更，朴敢旭翻来覆去地睡不着，骑上他的那辆破自行车，鬼使神差地去了石家。
      他单手翻过泥巴砌的院墙，轻巧地落在院子里，抬头一瞧：屋里黑漆漆的，连个鬼影儿都没有。

      朴敢旭倚在柴火旁，沉默地望着星空。
      刚处对象的时候，他们不好意思明说想要过夜，便喜欢用“看星星”这种傻瓜似的借口，一待一整宿。

      星星总是很好看，石友萱也是。
      可是他怎么都想不起来两个人最近一次看星星是在什么时候了。

      朴敢旭就这么有一搭没一搭地回忆了一宿。
      直到天光大亮，他才终于相信，石友萱是真的一整晚都没回来。

      -

      日上三竿，逛早集的人群渐渐散去，摊子前也没了生意。
      盛夏的太阳又太毒，一宿没睡的朴敢旭随手拿了本课本蒙在脸上，昏昏沉沉地打着盹儿，忽然闻到一股奇异的果香——他从来没闻到过这种味道。

      朴敢旭好奇地取下课本，只见石友萱正安安静静地坐在他身旁，手里剥着一颗橙黄色的果子。
      那果子小巧玲珑，形似光滑的鹅卵石，不断溢出清甜的汁水。正是他刚才闻到的那种香气。

      朴敢旭断定它绝非本地的作物，不禁又添了几分疑心，脸上却未露出分毫，兴高采烈地招呼女人：“友萱姐，怎么过来了也不喊醒我呀？”
      “看你睡得正香呢。”石友萱温柔地笑笑，接着喂给他一颗刚剥好的果子：“尝尝！这叫芒果，沈夫人说是大老远从南边儿运过来的嘞！”

      果然是从沈家拿回来的。
      想通这点的朴敢旭有些笑不出来了，借着女人的手狼吞虎咽地吃掉了芒果，却没尝出什么滋味。

      他的脑海里只剩下一个念头：
      要是跟着他这个世代为农的穷小子，恐怕一辈子都没机会吃上这种新鲜玩意儿。

      “甜不？”石友萱一脸期待地看着他。
      朴敢旭勉强挤了个笑容，点点头：“甜呐！”

      “那这些你拿着慢慢吃！学习辛苦，多补补！”石友萱顺手把身旁的花布袋塞进了朴敢旭的怀里，袋里装了不少芒果。
      原本就烦的朴敢旭看见一袋芒果之后更烦了，忙不迭地还给女人：“不用不用，我尝过滋味就行了！姐姐自己留着吃吧！”

      “你小子跟我还客气啥？”石友萱大大咧咧地摆摆手，扔下花布袋就走了。

      金贵斌在旁边偷听了半天两人的对话，见石友萱走远，趁机凑过来，使劲闻了闻空气里的余味，感叹道：“可真香啊！”
      又好奇地问朴敢旭：“这芒果，是啥滋味啊？”

      朴敢旭黑着脸把花布袋扔给了金贵斌，极其不耐烦地开口：“拿走、赶紧拿走！”
      顿了一下，又说：“吃完记得把布袋还我。”

      -

      集市没散，朴敢旭却心烦意乱地早早收了摊，骑上车直奔石家。
      他必须得跟石友萱谈谈。

      两人处对象的时间不算短了，朴敢旭自然是相信石友萱的。
      他自认为世界上没有比他更了解石友萱的人了，只是他阴暗的里人格正在脑海里一刻不停地大喊大叫。

      你是不是不想再跟我过这种苦日子了？
      是不是终于下定决心要抛弃我了？？

      朴敢旭又急又气，脚下蹬得飞快，车链几近脱落，眼看着就到了石家。

      又是大门紧锁。

      他不想再像个贼似的翻墙，于是从怀里掏出一串钥匙，摘出从来没用过的一枚，光明正大地从院门走了进去。

      石友萱惯是个勤快的，下午两三点的时候绝不会懒在家里。更何况今年地里收成不好，她心里更是着急，到处帮人做工，怕是要到日落西山才会回来。
      想通这点后，朴敢旭暗骂自己是气昏了头，愣头青般不管不顾地跑来，却连面都见不上。

      朴敢旭实在太累了，他决定在家守株待兔。
      他转身进了里屋，简单收拾后四仰八叉地躺在了床上。床褥上似乎仍残留着温度，呼吸间尽是石友萱的气息，他很快就迷迷糊糊睡着了。

      -

      朴敢旭这一觉睡得相当不安稳，中途醒了好几次，不断起身张望，石友萱却一直没有回来。
      到了晚上八九点钟，屋里黑得伸手不见五指，他又一次从噩梦中惊醒，至此睡意全无。

      明明是伏天，朴敢旭浑身上下却被冷汗浸透，恐慌感如潮水般涌出，让他久久无法回神。

      他太害怕失去石友萱了，宁愿装聋作哑，也不想再孤身一人。
      可心里始终有个念头缠绕着他，几乎要将他勒死：他为什么要阻止石友萱去追求更幸福的人生呢？

      朴敢旭缓缓起身走到窗前，给自己倒了一杯白开水。
      还没来得及喝下，窗外突然亮了起来，刹那间犹如白昼，刺眼的光线使他不得不眯起了眼睛。

      沉浸在愁绪里的朴敢旭只当是哪家邻居买了时兴的白炽手电筒，并没在意，随手推开了窗户透气。

      却见沈全锐的车大摇大摆地停在了石友萱家门口。
      明晃晃的远光灯，似乎是在给谁照路，路上却不见人影。
      朴敢旭定睛一看，那孤男寡女正坐在车里有说有笑，好不快活。

      耳边似有惊雷响过，他匆匆套上汗衫就冲了出去。

      -

      沈全锐一路没吭声，临着石友萱下车才终于腼腆地开口：“姐，这两天真是太感谢你了。”
      “都是乡里乡亲的，不用这么客气！”石友萱爽朗地笑了笑，露出一口大白牙。她本就是乐于助人的性子，不论哪家有了难处，都会尽力帮上一把。

      “这是我们的一点心意。”沈全锐突然从外衣口袋里拿出一个精致的首饰盒，硬要塞给石友萱。
      “哎哟，不用不用，这太贵重了！”石友萱震惊之下，急得口齿不清，连忙摆手拒绝。她都不用打开首饰盒，就能猜到里面必然装着多么值钱的物什。

      城里人都这么豪横吗？

      “母亲让我务必把这个交给你，要不是多亏了姐，我们囡囡可能早就……”沈全锐说着说着有些哽咽，眼里泛起点点泪光。
      看着沈全锐这几天生熬出来的黑眼圈，石友萱不禁叹了口气：“有这么多人记挂着她，囡囡也是个福大命大的。”

      不知想起了什么，她又轻笑着开口：“其实沈太太已经许诺我最想要的谢礼了，其他的就不用了。”

      -

      朴敢旭连鞋都顾不上穿好，刚从屋里冲出来，就见到了石友萱还给沈全锐首饰盒的一幕。

      好啊，这两人大半夜还送上礼物了。

      他快要憋出内伤，却在人前努力装作一副云淡风轻的模样，扬声招呼道：“友萱姐！”

      见到朴敢旭出现在自家门口，石友萱意外极了，下一秒就化成了满脸的兴奋。
      她迫不及待地推门下车，小碎步跑到男人的跟前：“小旭，怎么突然过来啦？”

      “我不能来么？”朴敢旭没好气地嘟囔，手却很诚实地揽住了石友萱的腰，一把扯进了自己怀里。
      又对着刚下车的沈全锐明知故问：“这位是？”

      朴敢旭当然是认识沈全锐的，两个人先前甚至一起打过几次球，同龄人之间的相处也算是愉快。
      而现在这么做也只是为了宣示主权罢了。

      “啊，这是沈太太的儿子，一直在上海念书的，放假才回来。”石友萱完全没注意到朴敢旭的异常，乐呵呵地回答。
      又主动介绍起来：“小沈，这是我对象，朴敢旭，也是咱们县的，和你一样都是明年高考呢。”

      沈全锐也客气地笑笑：“我们以前见过的。”

      “我怎么不记得——”朴敢旭拖着长音，完全没有自报家门的打算，一手紧扣住石友萱的腰，极其挑衅地看着沈全锐。
      石友萱推了推男人的胳膊，示意他好好说话。

      朴敢旭瘪嘴道：“可能是小时候吧。”

      沈全锐意外地挑了挑眉，好像被当成情敌了呢。
      他无视了那个吹胡子瞪眼的傻大个儿，礼貌地跟石友萱道别：“姐，那我就先回去了。”

      “行啊，我过两天再去看囡囡。”石友萱挥挥手，叮嘱道：“路上小心！”

      沈全锐的车很快就开远了。

      石友萱还没来得及质问，就听见朴敢旭阴森森地开口：“努努是谁？”

      -

      “没谁，”石友萱眼神有些闪躲，她答应过沈太太不外传的，只得极其生硬地转移话题：“哎呀，今天天儿太热了，我得洗个澡再睡。你要一起洗不？”
      没等朴敢旭回复，又慌慌张张地说：“哎呀，缸里的水不多了，我再去打点儿回来。”
      说完就提起了手边的桶，准备出门打水。

      这一幕落在朴敢旭眼里反而有些好笑。
      石友萱惯是不会撒谎的，她甚至编不出一个像样的理由。就算编得出，也会被他一眼看穿。

      扯一个拙劣的谎，还不如指望朴敢旭洗完澡就把这件事忘了。

      朴敢旭叹了口气，接过石友萱手里的桶，只留下一句“在我回来之前想好怎么解释”就出门了。

      -

      用冰凉的井水抹了把脸，再被夜风一吹，朴敢旭终于算是冷静了下来，重新回想起这两天发生的事情。
      哪怕是先前石友萱和沈全锐交谈的画面，也实在太过寻常，而他倒像是反应过度了。

      毕竟石友萱注视着自己的那双眼睛，依然是那么亮晶晶的。

      -

      朴敢旭拎着桶回来时，院子里已经挂好了旧棉布，灶上也烧起了热水，石友萱正坐在板凳上搓洗着泡在盆里的脏衣物。
      一见男人，她便笑眯眯地开口：“小旭先洗吧，正好把身上的汗衫换下来，我一并洗了。”

      朴敢旭点点头，脱下上衣递给石友萱。他没去洗澡，反而蹲在她的对面，一言不发地看着她。
      没记错的话，石友萱还欠他一个解释。

      “怎么啦？”女人歪着头疑惑地问他：“现在不想洗？”
      “努努是谁？”朴敢旭又耐心地问了一遍。

      石友萱洗衣的动作迟疑了一下，吞吞吐吐地说：“啊，那个，算是小沈的妹妹吧，最近身体不太好。”
      “哦……”朴敢旭听得出这个回答多少带点水分，于是换了个问题：“那他为啥要送你回来？”
      “我没让他送啊！是小沈他自己非得送！我拒绝过了！”石友萱嗓门越来越大，像是在努力避免什么。

      “没想到沈少爷还是活雷锋。”朴敢旭对着石友萱笑了笑，轻飘飘地甩出了最让他耿耿于怀的问题：“那昨天晚上姐没回家，是跟他在一起吗？”
      “你怎么知道我没回家……”石友萱喃喃自语，攥着衣服的手半天没动作。

      她终于后知后觉地明白了男人的意思。

      -

      石友萱猛地把手里的衣服摔进盆里，拧着细眉质问他：“挨千刀的！你敢怀疑老娘偷汉子？”
      朴敢旭脖子一缩，立刻怂了：“没有啊……我不是想听姐说说昨晚是怎么一回事吗？”

      说到这里，朴敢旭悬着的心倒是放下了一大半。
      因为石友萱实在太火冒三丈、太理直气壮了。

      “听我说？”石友萱伸出湿漉漉又颤悠悠的手指着他，几乎哽咽：“朴敢旭，在你心里就是这么想我的？我们这么久了，你不信我？”
      “怎么会呢？”朴敢旭换了个温和点的说法：“姐晚上没回家，不知道你在哪里做什么，我也很担心啊……为什么不能提前跟我说一声呢？”

      “因为忙完已经下半夜了，直接在沈家睡下了，我又该怎么跟你说呢？”想到了什么，石友萱“唰”地落下一行泪来：“啊，我还傻乎乎地给你送芒果吃，你那时候怎么就不能直接问我呢……为什么要怀疑我呢……”

      朴敢旭哑口无言，总不能说自己害怕问出口的瞬间就会失去一切，只好拖到无法再忍受的时候才问。
      他保持着蹲着的姿势，一点点蹭到石友萱的面前，伸出手抹掉了她的眼泪，又把她拉进怀里。

      “姐，是我不好……别哭了……”朴敢旭轻轻吻着石友萱的脸颊，他听出了女人的委屈，决定不再追问。

      可石友萱却抽抽嗒嗒地解释起来：“昨天就是因为太晚了才没回来……我从来没做过对不起你的事……你要是不信，明天我们一起去找小沈问清楚……”
      “哎哟，哪用啊！”朴敢旭不停吻着女人的鬓角，把人搂得更紧了一点，轻声安慰道：“友萱姐说的我都信。”

      -

      朴敢旭不怕石友萱暴跳如雷，就怕她掉眼泪。
      石友萱一哭，他的心也跟着绞起来，什么都顾不上了。

      他用上了这辈子最温柔的语气来转移话题：“灶上的水要凉了，姐先去洗澡吧，衣服放着我来洗。”
      女人柔软的手攀上他的胸肌，然后狠狠拧了几下。

      无视了朴敢旭的惨叫，石友萱撅着嘴：“我们一起洗，脏衣服晚点儿再说。”

      -

      两人洗完澡，舒舒服服缩在被窝里说着小话儿。直到朴敢旭的眼皮几乎要打架的时候，石友萱才主动讲起了这几天的事情。

      “你是不是觉得我有事在瞒着你？”石友萱哼哼唧唧，下一秒却爽快承认了：“确实有事情瞒着你！但和小沈没有关系。”
      闻言，朴敢旭顿时睡意全无，他搭在女人腰上的手下意识地收紧又放开，只是安静地等待下文。

      石友萱翻身在朴敢旭怀里找了个更舒服的姿势，得意道：“现在不能告诉你，过两天就知道了！”
      听她语气轻快，似乎不是什么坏事，朴敢旭便没那么紧张了：“啥呀？这么神秘。”

      “嗯……好东西！给小旭的好东西！”
      “……那努努又是啥呀？”

      “哎呀，你咋就那么好奇！”
      “从来没听说过沈家还有个妹妹呀。”

      “也不是妹妹……囡囡是沈家最受宠的一条小狗。”
      “啊？”
      “但是小沈不让别人说它是「小狗」。”
      “啊？？”
      “他说是家人，是妹妹，不是畜生。”
      “……”

      “囡囡也是个倒霉的，不知道啥时候让邻居家的公狗配上种了，昨天难产了。这不，小沈听说我懂接生，就火急火燎地把我接过去了。”

      “那它生了几只？”
      “生了五只呢。囡囡是头胎，没经验，又没奶水，小狗们差点没活成！可给我累坏了！”
      “又是接生，又是喂奶，怪不得姐忙活了一宿……”

      “可不是么！连觉都没咋睡就给某人送芒果去了，但人家不领情！”
      “姐……咋还生气呢……”

      “囡囡是名种狗，却生了一窝小土狗，还遭了这么大罪，沈家恨极了那家邻居，正准备讨个说法呢。这都是人家的家务事，沈太太嘱咐了不要外传，所以我一开始也不好跟你细说。”
      “不过话说回来，小狗们都很健康，白白胖胖的。”
      “那就好……”

      -

      又一天晌午，金贵斌和朴敢旭并排蹲在路边啃干粮的时候，沈全锐开着他的那辆黑色轿车停在了他们两人的面前。

      朴敢旭立刻起身，拍了拍裤子上不存在的灰，走上前看这人是何来意。
      沈全锐点点头当作打了招呼，从副驾驶的窗户递给他一打用布条捆好的书，扬声道：“你的。”

      “这是什么？”朴敢旭茫然地接了过来，沉甸甸的。
      “友萱姐托我妈从城里刚捎回来的，最新的复习资料。她担心你自学跟不上城里的进度，”沈全锐从头到脚打量了他一番，然后“啧”了一声：“真不知道友萱姐瞧上你什么了。除了这个，她什么都不要。”

      朴敢旭沉默了片刻，问他：“你打算考什么大学？”
      “XX大学。”沈全锐提防道：“你想干嘛？”
      “知道了。”朴敢旭把书抱在怀里，语气平淡：“我明年肯定考得比你好。”
      闻言，沈全锐翻了个白眼，发动了车子。

      金贵斌关心地开口：“兄弟，他啥意思啊？”
      “没啥，”朴敢旭珍惜地把新书摞在了自己的旧课本上，低头翻了翻，突然想起了什么：“对了，我媳妇的花布袋呢？你怎么还没还给我？”

title: 意外揍了老师的我却被捞上岸了
updated: 2025-05-03
summary: “……你俩挺般配的。”金奎彬翻了个白眼，“俩神经病凑一块儿了。”
status: finished
chapters:
  - body: |
      
      01.

      朴乾煜推开咖啡厅的门，左右环顾了一圈，立刻锁定了自己此行的目标。
      就像金奎彬总是说的那样——靠近窗边的卡座，年轻男人正悠哉悠哉地倚在沙发上，捧着手机聊得火热，面前摆着一杯咖啡和一片尚未开动的芝士蛋糕。

      朴乾煜走近几步，结合着从金奎彬那里获得的只言片语，在吧台前装作纠结点单的模样，偷偷观察着男人。

      总是坐在咖啡厅里靠窗的角落——确认；
      棕色短发，白白净净，身型偏瘦——确认；
      喜欢芝士蛋糕——就在桌子上摆着呢，确认；
      戴细边眼镜——朴乾煜用力地眯了眯眼，还是看不清楚，但总之那人是戴了眼镜的，基本确认；
      很可爱——确认（这是非常客观的评价）；

      那么这人应该就是他要找的章昊了。

      -

      “请问是章老师吗？”有点礼貌但不太多的开场白。

      陌生男人低沉的声音打断了正在吃瓜的石马修，他有些不爽地从手机里抬起头来，却意外地看见了一张青春洋溢的脸庞。

      石马修不动声色地打量着年轻人，不管是身材还是脸蛋都是他喜欢的类型，可惜似乎来者不善。
      他没正面回答问题，直说：“你有什么事情吗？”

      这句话落在朴乾煜的耳里就是承认的意思。
      于是他也自报家门：“我是金奎彬的哥们，朴乾煜。”

      石马修轻哼一声，示意他继续往下说。
      朴乾煜暗自握紧拳头，语气强硬道：“我也不跟您兜圈子了，请您尽快跟金奎彬分手吧。”

      石马修的确知道章昊最近谈了个小男朋友的事情，却不明白面前的年轻人兴师问罪的缘由，好奇地发问：“为什么？你喜欢他呀？”

      “怎么可能？！”朴乾煜瞳孔地震了一瞬，连忙义正词严地驳斥：“您是老师，他是学生，怎么可以谈恋爱呢？”

      “可我是中学老师，他是大学生。”石马修故作无辜地眨眨眼，托着腮道：“更何况我从来没有教过他。你就算举报到教育厅，也抓不到我的任何错处。”

      “这说不通的。”朴乾煜一时语塞，急切道：“我认识奎彬快二十年了，他这个人心思特别单纯。请您不要再玩弄他的感情了！”

      “你这家伙说话真够搞笑的，怎么就玩弄他的感情了？”石马修翻了个无语的白眼，连工于心计的章昊都栽在金奎彬的手里了，全世界也就剩下面前这傻大个还相信他是个善茬子。

      “那您为什么不愿意公开和他的关系呢，甚至让他对朋友们都要保密，”朴乾煜直勾勾盯着男人的眼睛，据理力争：“难道不是因为觉得他年纪轻、好拿捏吗？玩完就扔掉了，都不用负责任。”

      石马修越听越糊涂，这都哪儿跟哪儿啊。
      以他这么多年对章昊的了解，不公开恋情肯定有他自己的考量，又哪里轮得到外人插嘴。更何况当事人金奎彬乐在其中。

      不过这替兄弟出头的小孩还挺有意思的。
      他心底有点痒痒，恶趣味犯了。

      “朴乾煜是吧？你的意思我明白了。”石马修清清嗓子，决定终结这段无厘头的对话：“想要‘我’跟金奎彬分手很简单啊……”
      他故意不把话一口气说完，不上不下地停在那里，句尾音调轻轻上扬，莫名充斥着勾人的意味。

      朴乾煜聚精会神地等待着男人的回答。
      下一秒，他差点举起拳头，锤翻这个为师不尊的家伙。

      “其实，我还挺喜欢你这种类型的。”石马修轻佻地勾起唇角，指尖在年轻人精瘦的胳膊上虚虚地划过，大言不惭道：“你跟我谈恋爱，我马上就把金奎彬踹了。”

      -

      章昊下课后匆匆忙忙赶到咖啡厅，就看见石马修被身形高大的陌生男人揪住衣领的一幕。
      他一边尖叫着“不要打架”，一边冲过去分开两人，接着拦在石马修的面前，没好气地说：“这位先生，你再动用武力，我就要报警了。”

      朴乾煜简直被气昏了头脑，他怎么都想不到金奎彬的恋爱对象是如此轻浮的人，居然、居然敢这么直白地撩拨他。
      他不停深呼吸，努力克制自己的情绪，语气极其生硬：“我会把今天发生的事情一五一十地告诉奎彬。”

      “……奎彬？”章昊呆滞地眨了眨眼睛，没明白两人之间的矛盾怎么又会跟自己的男朋友扯上关系，确认道：“你说的是xx大学表演系的金奎彬吗？”
      “是的，”朴乾煜点点头：“我是他的好哥们。”

      闻言，章昊勉强挤出了个还算礼貌的微笑，朝年轻人伸出了手：“你好，我是章昊，金奎彬的男朋友。”

      -

      “……所以，这其实是一场误会。”章昊优雅地切着蛋糕，总结道：“你把马修错认成了我，他就顺势调戏了你。”

      朴乾煜的脸色由黑转红，理智也在逐渐回笼，许多先前被他忽略的细节开始一一浮现：

      石马修戴的是无边框眼镜，不是细边眼镜；
      桌上的芝士蛋糕是石马修给章昊点的，他根本没动过；
      而那些看似贴切的外貌描述，纯粹是文字上的巧合，站在两个人的面前就会知道两个人的差别到底有多大；
      至于“很可爱”嘛……咳咳。

      朴乾煜承认了自己的疏忽，低着头回答：“是我弄错了。”

      而坐在一旁的石马修幸灾乐祸地模仿着他那时的语气：“请～您～不～要～再～玩～弄～他～的～感～情～了～”

      “你！”朴乾煜气不过，拧着眉毛，咬牙切齿地说：“要不是你冒名顶替，我怎么可能会弄错！”
      “喂，我可从来没说过‘我是章昊’啊！”石马修乐得前仰后合：“再说了，是你先没礼貌的，我这充其量算是回击。”

      “行了马修，别逗他了。”章昊无奈地笑了笑，强行打断了石马修的二轮调戏，又对着朴乾煜郑重道：“谢谢你对奎彬的关心，他能有你这么讲义气的哥们，我真的很为他感到高兴。“
      “只是我们两个人之间的事情，不方便在这里细说。但请你相信，我同样认为，保护奎彬不受伤害比什么都重要。”

      “好、好的。”许是章昊的真诚触动了朴乾煜，他发自内心地道歉：“今天是我冲动了。谢谢您的包容，章老师。”
      章昊挑了挑眉，这称呼简直把人叫老了十岁，赶紧摆摆手：“没关系，你像奎彬一样叫我昊哥就行了。”

      “对对，你叫我马修哥就行。”石马修笑嘻嘻地插话。
      闻言，朴乾煜瞬间脸黑，不想如了他的意，故意别扭地说：“好的，石老师。”

      “Whattt——”石马修句尾拖着长音，大声地抱怨着：“你还是不说话的时候比较可爱！”
      朴乾煜扁扁嘴：“彼此彼此。”

      02.

      天微微亮，窗外刚有几声鸟叫，朴乾煜已经在床上烦躁地打了半天的滚儿，绝望地意识到自己失去了睡眠。
      他随手揉了揉睡成鸡窝的碎发，简单洗漱之后，背上游泳包就出了门。目的地是家附近的游泳馆。

      其实朴乾煜原先是没那么喜欢游泳的。

      年纪再小一点的时候，他喜欢篮球足球这种热热闹闹的项目，几个朋友，一块空地，消磨掉大半天的时光；
      上大学之后，搬来这座陌生的城市，身边的人越来越少，他喜欢上了打网球，总能和金奎彬打得有来有回；
      直到现在，金奎彬也没空搭理他了。

      一个人去游泳也没什么不好的，消耗一下无处释放的精力，久而久之倒是养成了习惯。三天不游，浑身难受。

      把手机锁进更衣室柜子前，朴乾煜最后一次检查了时间：六点十分。

      他还是第一次在这个时间出现在游泳馆。
      希望独享泳道会是他早起的奖励。

      -

      出乎意料的是，游泳池里已经零星游着几位顾客了。
      朴乾煜在心中暗暗对早起派们致以崇高的敬意，草草拉伸几下后，一头扎进了冰冷的池水。

      他平日里总嫌弃这个游泳馆二十五米的泳道太短，扑腾不了几下就触边了，实在游不过瘾。
      游到最后，往往不是精疲力尽，而是翻身翻烦了。

      再一遇上顾客多的日子，那更是成倍的灾难，必须得和很多陌生人共用泳道，总感觉连水都是浑浊的。
      但如果真让他每天早上六点爬起来游泳，只图个清净，那也是万万不可能的。他宁愿躲在人少一点的深水区不出来。

      朴乾煜原本晕晕乎乎的大脑，在冷水的刺激下逐渐胡思乱想起来——
      好端端的，他怎么会突然睡不着觉呢？
      又是哪根筋没搭对，才会想在这个时间点游泳呢？

      过度走神的代价是，朴乾煜一而再无视了身体发出的信号。
      只是一点肌肉的牵引痛又不碍事。

      等到一阵阵钻心的疼痛唤醒他的时候已经太晚了。
      该死，怎么会在泳道的正中央抽筋了。

      -

      右腿剧烈的痉挛感让朴乾煜顿时失去了行动能力。
      池边看似近在眼前，他却连伸直双腿都做不到。

      更糟糕的是，朴乾煜习惯性地游进了深水区。
      他下水前便观察过了，这里一个人都没有——耳朵清净，水也干净，完美的选择。

      可这同样意味着不会有人注意到他的情况。

      一瞬间濒死的恐慌感蔓延到了五脏六腑，冰凉的血液争先恐后般涌入他的后脑勺，紧接着毫不留情地炸开，直叫他头晕目眩、心跳过速。
      他想要求救，却猛呛了几口水、不仅发不出声音，连呼吸都变得费劲起来。

      朴乾煜本能地抱住了自己痉挛不止的大腿，努力回想起学过的自救知识，试图转换成仰卧姿势并舒展身体，防止继续下沉。
      极其勉强地翻过了身，他来不及大口呼吸新鲜的空气，便大声呼喊道：“救——救救我——”

      疼痛的时间总是过得异常缓慢。
      持续抽筋的右腿根本没办法放松，朴乾煜相当不稳定地漂浮在水面，祈求有人听到了他的呼唤。

      -

      水下的石马修隐约听见了有人喊叫的声音。
      他立刻从泳池里抬起了头，环顾四周，没发现什么异常。

      “救、救救我——咕噜咕噜咕噜——”

      石马修听不清内容，却疑心自己曾经在哪里听过这个声音。
      他眯着眼睛朝声音的方向望去，没有人影，只见到扑腾的水花。

      不好，有人溺水了！

      意识到这点的石马修连忙横穿泳道，朝深水区奋力游去，双腿频繁交替地拍打着水面，留下一阵阵白沫。

      他早就发现了这个游泳馆的安全员总是消极怠工，觉得大清早人少，又都是熟客，不会出什么乱子，经常偷溜出去摸鱼。
      等到真出事就太迟了——不过还好，至少他离得不算太远，几个呼吸间已经游到了溺水者的背后。

      溺水的是个身形高大的青年男人，在水里沉沉地垂着脑袋，似乎已经失去了意识。
      体型比他想象中的大了许多，这有点棘手。

      石马修深吸一口气，潜进水里，双手用力托起青年的背部，让他的脑袋得以露出水面。
      然后从背后圈住他的肩膀，极其艰难地拖着人向池边游去。

      陷入昏迷的男人几乎和尸体没什么区别，完全无法调整自己的重心，加上水的作用力，他活像是驮着一袋浸满了水的棉花，没游几米便气喘吁吁。

      石马修一度怀疑这个年轻人得有两百斤。

      于是石马修也开始高声呼救，大喊着他熟识的顾客的名字：“成韩彬！！沈Ricky！！！你们快来帮忙——有人溺水了——”

      -

      几个人手忙脚乱把青年拖上岸之后，石马修全身脱力地跪坐在池边，他终于有空望向了青年的脸——我操，这不是那个谁，咖啡馆那个愣头青吗？！

      他用力扇了两下朴乾煜的脸颊（注：并不是打击报复），年轻人纹丝不动，面色却因为长时间的窒息而发灰。

      这样下去不是办法！

      石马修紧急回忆着学过的急救知识，双手交叉放在朴乾煜的胸膛上，不停地用力按压。
      按压十余次后，朴乾煜无意识地吐出了几口清水，却依旧没有要转醒的意思。

      “救护车过来恐怕还得一段时间……”围观的人群开始七嘴八舌地出主意：“要不试试人工呼吸？”
      闻言，石马修想都没想，立刻伸手掰开了朴乾煜开始泛紫的嘴唇，猛吸一口气，紧紧地贴了上去。

      双唇相接的瞬间，某股奇异的感觉如触电般传遍全身上下，让石马修忍不住颤抖起来。
      年轻人那双冰冷而柔软的唇瓣，与他的完美贴合。在这一刻，石马修甚至迷信地觉得，他们生而就是要接吻的。

      只可惜这双唇的主人仍然一无所知。

      他拂去心头胡乱的心思，缓慢而坚定地送入空气，直到肺部因缺氧而感到疼痛，总算才分开。

      石马修顾不上调整自己的呼吸，深吸一口气，再次重复之前的动作，慷慨地与年轻人分享着氧气。

      万幸的是，人工呼吸很快就起了作用。
      新鲜空气的涌入让朴乾煜极其痛苦地咳嗽起来，没过多久便逐渐恢复了意识，睁开了眼睛。

      -

      朴乾煜这才知道，溺水的人并不是毫无知觉的。

      泳池水声的嘈杂，周围人群的议论，身旁凌乱的呼吸，他听得一清二楚，只是没有办法做出反应。
      还有按在胸口上的重量，唇瓣紧贴时的温度和那人身上若有若无的香气……

      朴乾煜怀疑自己在做春梦。
      只不过是窒息play。

      氧气重新注入肺部的瞬间，朴乾煜感觉血液开始疯狂地涌向身体的各个角落。
      呛进气管的水逆流而上，变成了近乎呕吐的咳嗽。

      他从没觉得离死亡这么近过。

      奋力睁开双眼的下一秒，朴乾煜认出了石马修。
      不知是被水打湿或是被汗打湿，男人苍白的脸上写满了担心与紧张，与初见时的神采飞扬判若两人。

      见他醒来，石马修明显松了一口气，脸上的笑容越来越大，连声呼唤着他的名字：“帕果努——！！”

      无意间，一颗带着凉意的水珠从石马修的发梢滴落，重重地砸在了朴乾煜的胸膛，四溅成了碎片。

      朴乾煜昏沉的大脑却接收到了某股暖意。

      他握住石马修按在他胸口的手，只是一扯，便把人带进了怀里，然后抬起沉重的双臂轻轻地圈住了他。
      体温毫无阻隔地传递过来，朴乾煜顿时感觉暖和多了。

      -

      “喂，朴乾煜，你还好吗？”石马修被拽了个趔趄，顺势把下巴枕在他的肩头，吐字也变得黏糊。
      朴乾煜一边放肆地挤压着男人紧实的背部肌肉，一边哑着嗓子开口：“……身上好痛。”

      石马修莫名听出了一番委屈的意味，轻声安慰道：“哪里痛？救护车马上就到了，你再坚持一会。”说着就要挣脱他的怀抱。

      纵使石马修的脸皮再厚，也承受不住围观的熟人们充满暗示的目光。
      沈泉瑞不停朝他挤眉弄眼，就差掏出手机拍照了。

      两个只穿了泳裤的男人。
      在众目睽睽之下抱得难舍难分。

      石马修逃一般地起身，取代他的位置的是一块大号浴巾，勉强能把朴乾煜的躯干盖住。

      唯一的热源离开后，朴乾煜的意识渐渐再次出走，眼睛也闭上了，嘴里不停嘟囔着：“好冷……马修哥……”

      石马修蹲在一旁，心脏仍在为那个过于暧昧的拥抱而砰砰作响，却假装镇定地揉搓着年轻人冰凉的手心，试图多传递一些热量给他。

      03.

      被刺鼻的消毒水味道唤醒。
      朴乾煜迟钝地意识到自己正躺在医院的病床上，抬了抬僵硬的胳膊，却感到一阵阵针扎的刺痛。

      “哟，游泳健将醒了。”朴乾煜不用睁眼都知道这是哪个烦人的家伙的声音。
      坐在病床旁的金奎彬捧着手机，头也不抬，嘴里念叨着：“医生检查下来没什么问题，但还是得打完这些吊瓶。在这之前你还是给我老老实实躺着。”

      “……你怎么在这里？”朴乾煜的声音嘶哑得厉害。

      “昊哥告诉我，有人游泳游进医院了。”金奎彬摇摇头，嘲笑了两声：“我用屁股想都知道，你这小子肯定没热身就下水了。就像你永远都改不了穿拖鞋打球的臭毛病。”

      朴乾煜紧抿着唇，好半天才吐出两个字：“意外。”

      “切！”金奎彬似乎是想起来了什么，突然来了兴趣：“对了，你和昊哥居然认识啊？怎么认识的啊？昊哥还神神秘秘的，一个字都不愿意告诉我。”

      “嗯……”朴乾煜顿了顿，斟酌着字句：“我是先认识的马修哥。”
      事实如此，这不能算他撒谎。

      提起那天在咖啡厅的事，朴乾煜就一阵阵头疼。
      要不是看到这小子最近一副为情所困的德行，动不动就借酒消愁，甚至因为宿醉旷了好几次重要的专业课，毕业都要亮红灯，他才不想插手别人的感情生活。

      没想到丢人丢了个大的。
      金奎彬反而高兴得像没事人一样了。

      “没错！听说是马修哥把你送来医院的！”金奎彬回忆着几个小时前见到的画面：“我赶来的时候，他坐在床边一直拉着你的手，看起来担心得不得了……”
      他突然怪叫了一声，狂拍着自己的大腿：“不对，你俩是不是背着我有点事儿啊！！”

      “他人呢？”朴乾煜自动无视了后半句话。
      “上课去了，说是晚点再过来。”金奎彬用暧昧的眼神上下打量着他，“想不到你们早就私通了！”

      “才不是。”朴乾煜下意识就想要反驳，却忽然想起了人工呼吸的事情，双颊不禁微微发烫。
      不想被金奎彬继续打趣，于是把头一扭，不再理他。

      -

      朴乾煜再次睁眼的时候，天已经彻底暗了。
      病房里一片漆黑，只有几台监测仪器发出微弱的光芒，纱质的窗帘透出了几分城市夜景。

      他转过头，却意外撞见了一双亮晶晶的狐狸眼眸。

      “你醒啦？身体还难受吗？”看不清石马修的表情，朴乾煜却听得出，他的声音里总是带着笑意的。

      朴乾煜幅度不大地摇摇头，又怕男人没看到，哑着嗓子开口：“应该没事了。”

      “没事就好！”石马修的声音听起来更加轻快了：“你想吃点东西吗？我在家简单炒了几个菜。”
      “啊……”朴乾煜有点懵，“其实我叫外卖就行……”

      “吃外卖怎么行？”石马修随手拍开床头的小夜灯，念念叨叨：“我本来也得做饭，做一人份还是两人份没区别。你就不要跟我客气了！”
      说完，他动作利索地展开了床边桌，把带来的饭盒摆在上面，又为两个人都布好碗筷。

      饭盒里装着几道冒着热气的家常小炒，饭香直冲朴乾煜的鼻腔，肚子也非常应景地叫了两声——他原本是没觉得饿的。

      “吃！”下达命令后，石马修便自顾自地开动了起来。
      朴乾煜举着筷子，犹豫再三后开口：“谢、谢谢马修哥……”

      闻言，石马修抬起头，盯着他的眼睛，轻轻笑了一下。

      -

      石马修离开后，病房里只剩下他一个人。
      朴乾煜再一次握着他的手机翻来覆去。

      医生不让他离开医院，说是必须得观察两天。
      朴乾煜却觉得他明明强壮得能打败一头猎豹，溺水只是一次偶发事件，为什么非要住院。

      石马修听了之后没有像金奎彬一样嘲笑他，却极不认同地摇了摇头，表情有些凝重。
      他一边剥着芒果（注：金奎彬买来探望病号的礼物），一边皱着眉头开口：“溺水这种事可不是闹着玩的，你得乖乖地听医生的话。”

      这种时候倒是挺像个老师了。朴乾煜暗自嘀咕。

      临走前两个人交换了联系方式，朴乾煜连连说要找机会请客吃饭，石马修没推辞。
      毕竟这次真是欠了个超级大的人情，说是救命之恩也不为过。

      只可惜穷鬼大学生目前的承诺价值有限，就算拼命打工也负担不起高档餐厅，一时间没什么主意。

      04.

      “朴乾煜，你行不行啊？？”
      “不是，我很猛的，你先别急。”
      “切，你要是不行就去下吧。”
      “不要对我用激将法！！”

      “啊啊啊，好疼！！！”
      “马修哥再坚持一会儿！我马上就来了！！”

      “Nice！！”石马修兴奋地把耳机一摘，转头看向朴乾煜：“想不到你游戏打得不错啊！这波TP非常关键！”
      朴乾煜无语地撇撇嘴，对着这双亮晶晶的狐狸眼也说不出什么重话，小声嘀咕：“我都说了，我这英雄后期真的很猛，你得给我一点发育的时间……”

      “但你前期被对面单杀确实很不应该！”石马修念念叨叨，顺手下载了这盘的游戏录像，说着就要开始复盘，被朴乾煜的大手一把按下。

      真没想到石马修打游戏是这种较真的风格。
      ……怪不得他找游戏搭子能找到朴乾煜的头上。

      -

      出院的那天，朴乾煜主动给石马修发了郑重的感谢信息，只收到了四个字的回复：“不用客气ㅎㅎㅎ”。

      朴乾煜纳闷了半天，是自己写得还不够正式吗？
      过了好久才明白，原来小老外压根读不懂这些复杂的语句和高深的词藻，早知道就该翻译成英文的。

      又过了几天，他主动邀请石马修去看一部近期讨论度很高的国产电影，顺便吃顿晚饭，想不到也被拒绝了。
      回复是：“没有英文字幕的话我看不懂呐ㅠㅠ”

      接连两次碰壁，朴乾煜有点不知道该怎么接近石马修了——呃，他的意思是报答他。

      直到某天，手机突然弹出一条来自石马修的信息：“那什么……你平时玩英雄联盟吗？”
      朴乾煜顿时来了兴趣，立刻飞快地打字回复：“当然。我是S5的老玩家，知道Marin吗？我的上单都是跟他学的。”

      回复也来得很快：“太好了！那你今晚有时间吗？”

      -

      顺理成章地接受了语句暧昧的邀请，朴乾煜提前一会儿抵达了两人约定好的网咖。

      他下意识订了私密性不错的双人包厢，不为别的，只是觉得两个人第一次“约会”选在大厅里的卡座会有点奇怪（注：石马修的原话是“上分”）。
      又顺手买了两杯咖啡，至于吃什么，还是让石马修决定吧。自己只要付钱就好。

      “哇——”石马修对网咖里的许多设施都感到新奇，“等会玩桌上足球吧！我好多年没玩过了！”
      “马修哥是第一次来韩国的网咖吗？”朴乾煜有些惊讶，毕竟这个地方是石马修选的。
      “嗯！”石马修坦诚地点点头，咬着吸管随口说：“之前都是在家里和朋友们语音开黑的。”

      “其实我们也可以？”朴乾煜试探性地开口，心里想的是如果石马修想玩游戏的话，就能随时喊他上线。
      担心小老外误会他的意思，又连忙补充道：“毕竟那样就不用跑来跑去了啊哈哈哈！”

      石马修笑眯眯地回答：“可是我想见到乾煜呀。”
      说完伸手捏了捏他的手臂肌肉。

      朴乾煜忽然觉得口干舌燥，仰头猛灌了一口冰美式。
      没救了，他居然觉得这杯没加糖的咖啡好甜。

      -

      玩了两三个小时的游戏，朴乾煜提议去吃点夜宵（注：绝对不是缓兵之计）。
      比起传统的韩餐，两个人一拍即合地选择了连锁的炸鸡品牌。

      石马修双手捧着新鲜出炉的炸鸡翅，忽然发出一句感叹：“真想不到，乾煜连口味都跟我这么像！”
      “那我还是没哥那么喜欢吃牙膏……哦不，薄巧。”朴乾煜用委婉的语气回复了冷酷的内容。

      “什么嘛！？”石马修疑似有几分炸毛，毫不留情地反击道：“哼哼，那还不是因为和某人排位连跪，我必须得补充点薄巧冰激凌降降火气！”

      “原来是这样啊，”朴乾煜装模作样地叹了一口气，脸上写满了为难：“都怪我太菜，没法带你赢。唉！马修哥以后还是找更厉害的人一起玩吧！”

      “哎呀！我没有那个意思！”
      “哥不要拿那个戴了三十分钟的手套摸我啊啊啊！”
      “我是说，以后也要和乾煜经常出来玩！”
      “……知道啦知道啦！”

      05.

      隔天的放学时分，金奎彬准时把他的银白色跑车停在了中学门口的路边。

      眼前晃过了一个过分熟悉的背影，他震惊地摘下了墨镜，又揉了揉眼睛，确认不是自己眼花后，降下了车窗：“帕果努——！你在这儿干嘛呢？！”

      朴乾煜穿着一身灰色运动装，长腿半跨在自行车上，一只脚随意地蹬在地面，像是在等人。
      他对于在这里碰见金奎彬毫不意外，撇撇嘴：“你来做什么，我就是来做什么的。”

      “哟，我来接男朋友下班。您是？”金奎彬从头到脚打量着朴乾煜，不怀好意道：“骑自行车接人还挺稀罕的。”
      “你懂个屁，这叫节能减排。”朴乾煜头都懒得抬，正焦急地敲打着手机屏幕。

      好烦，马修哥怎么还不下班。

      安静片刻的金奎彬还是没忍住八卦起来：“不是，你那辆刚买的摩托呢？这就卖啦？”
      朴乾煜顿了一下，回忆起昨晚骑摩托车送石马修回家的情形，带着微妙的笑意开口：“马修哥说太危险，以后不许我骑了。”

      “……你俩挺般配的。”金奎彬翻了个白眼，“俩神经病凑一块儿了。”

      -

      踩着放学的铃声，章昊极其准时地冲出校门，拎着办公包就坐上了金奎彬的副驾驶。

      临走前还跟朴乾煜简单地打了个招呼，问他周末要不要一起去郊外的音乐节玩。
      又朝他暧昧地眨眨眼，说是石马修到时候也会去。

      朴乾煜听完后支支吾吾地答应下来，他那天没有其他的安排，也找不到任何拒绝的理由。

      又过了一会儿，石马修终于慢悠悠地出现了，手里拎着一个保温盒，朝他挥挥手。

      等人走近了，朴乾煜十分自然地接过饭盒，好奇地问：“里面装的什么？”
      “过会儿你就知道了，”石马修自觉地爬上自行车后座，一把搂住朴乾煜的腰，摇头晃脑道：“我们出发咯——！”
      朴乾煜被男人幼稚的语气逗笑，忍不住模仿起来：“出发咯——！！”

      没骑出去多远，上了一天班的石马修就彻底失去了坐相，懒洋洋地靠在朴乾煜的身上，欣赏着路边的风景。
      感受到后背的热度，朴乾煜的心也开始砰砰作响，下意识放缓了车速，怕他一不小心摔下去。

      “怎么骑得这么慢？”石马修随口搭话。
      朴乾煜故意表现出一副气喘吁吁的模样逗他：“有点重。”

      “Whattt——”石马修这辈子头一回听到这种说法，难以置信地发问：“我重吗？”
      仗着身后的人看不见自己的表情，朴乾煜对着空气无声地乐了半天。

      笑得差不多了，他正准备安抚几句，以免真的把人惹毛了。
      就听见石马修幽幽地开口：“你掉进水里的时候我都没嫌你重……”

      “啊，不是，那个，”朴乾煜以为石马修生气了，语速飞快地解释道：“不重不重，哥一点儿都不重，我刚才是开玩笑的。”
      “开玩笑？”石马修没好气地重复，顺势捏住他腰间的软肉，狠狠地揪了一下，“开玩笑是吧？”

      朴乾煜又痒又羞，连忙阻止道：“请乘客不要干扰驾驶啊啊啊——”

      -

      目的地的前进方向正巧与晚高峰的车流相逆，一路畅通无阻，晚风也舒服地扑在两人的脸上。

      石马修倚在朴乾煜宽阔的后背上，安静地望着霓虹闪烁，内心是久违的安定。
      他胡乱摸了一把年轻人的肚子，有一搭没一搭的闲聊起来：“你对这里的路还是蛮熟悉的嘛，骑了这么远，都不用看导航。”

      他知道朴乾煜是上了大学之后才搬来这座城市的。
      从某种程度上来说，他们两个都算是异乡人。

      “无聊的时候，总喜欢骑着车到处转转。”朴乾煜轻声回答：“吹吹风听听歌什么的。”
      石马修把耳朵贴在朴乾煜的身上，努力地捕捉着他的心跳声，回答得驴唇不对马嘴：“其实我来到这里之后，时常也会感到孤单……”

      或许是风声太大没听清楚，亦或是感知到男人情绪不佳，朴乾煜敏感地转头看向他：“嗯？”
      石马修迅速掩饰了表情，夸张地开玩笑道：“我说——你有这力气不如顺路再送两份外卖——”

      “切，”朴乾煜回身专心骑车，又问他：“我要是送外卖的话，马修哥会点吗？”
      “那得看你有什么，我对食物可是很挑剔的。”石马修轻哼一声，顺着他的话胡说八道。

      于是朴乾煜报起了菜名：“炸鸡、红薯、香蕉、薄巧冰激凌……”每一样都是石马修爱到不行的。

      石马修听得目瞪口呆，“你怎么什么都知道？这是怎么做到的？！你好可怕！！”
      “不是，”朴乾煜爆笑了半天才纠正他的用词：“这种时候哥应该说，不愧是乾煜！！”

      -

      朴乾煜寻了处背风的陡坡，停了车。前方便是安静的江水。
      这次野餐纯属临时起意，没准备垫子之类的东西，两人只好席地而坐。

      石马修兴冲冲地从饭盒掏出两个包装精美的三明治，“我下班前重新烤过了，还热乎着。”
      他递给朴乾煜一个，细声叮嘱着：“怕你不够吃，我多做了几个。不要跟我客气。”

      “谢谢马修哥，”朴乾煜毫不犹豫地咬下一大口，咀嚼片刻：“好吃！不过这配菜好像有点……”
      他低头研究半天，有些不确定地开口：“是梨吗？”

      “对！”石马修高兴地点点头：“我加了啤梨！还有一些我自己腌制的火腿。”
      “真是不太常见的组合呢……”朴乾煜又咬了一大口，好奇地提问：“马修哥是怎么想到要在三明治里面加啤梨的？”

      “不是我想到的，”石马修顿了顿，冲他温柔地笑笑：“这是温哥华的做法。”

      朴乾煜听完没再说话，几口就把三明治消灭了。
      伸出手，又向石马修讨了一个。

      -

      “哇——没想到我们居然全部吃完了！”石马修向后伸着懒腰，几乎要躺在草坪上，长舒了一口气：“本来还有点担心来着。”

      “为什么？”朴乾煜歪着脑袋，满脸疑惑地看着他。

      “等下，”石马修突然伸出手把年轻人的头扶正，自言自语道：“这样好多了。”
      朴乾煜眨眨眼，没理解石马修的意思，只是直愣愣地注视着他的动作。

      “你刚才问为什么担心？”石马修干笑了两声，耸耸肩膀：“大家都说我做饭不好吃，所以我很少做东西给别人吃的。”

      朴乾煜第一次在石马修脸上看到了落寞的表情。
      他盯着男人的眼睛，格外认真地说：“可是我不觉得。我就很喜欢……今天的三明治。”

      “啊，是吗？”听到如此肯定的回答，石马修伸手揉了揉他的头发，笑眯眯地说：“下次给你烤布朗尼蛋糕吃。”

      朴乾煜点点头，嘴里嘟囔着：“以后马修哥不要再做给他们吃了。”

      -

      聊得差不多了，石马修若无其事地提起：“这周末你有时间吗？”
      “啊……音乐节吗？”朴乾煜没正面回答他的问题：“刚才在校门口遇见昊哥，他提了一句来着。”

      “那你会来吗？”石马修一脸期待地望向他，扯住他的衣袖连连撒娇：“你来嘛～什么都不用准备，只要来陪我玩就好～”
      朴乾煜觉得有些好笑，故意不给出肯定的答复，只说：“得看情况呢。”

      “我可不想再当电灯泡了，”石马修撅着嘴，语气不佳：“他俩实在太烦人了！”
      “是吗？可是昊哥看起来不像是恋爱脑啊。”朴乾煜没见过那两人明目张胆秀恩爱的样子，实在想象不出是什么场景。

      “那是他会装！你被骗了！！”石马修激动地几乎要从草坪上蹦起来，“你真的要相信我，章昊绝对是个恋爱脑！！！”

      “以前每次和他出去玩都特别开心，现在简直像是变了一个人。”石马修沉浸在自己的回忆里，喃喃自语：“啊，不过可能也是因为以前还有泰来……”
      “泰来？金泰来吗？”朴乾煜一脸吃惊。

      “什么呀，你连泰来都认识吗？这地方这么小吗？”石马修抬手戳了一下他的胸口，“那我们早该认识才对！”
      朴乾煜若有所思，似乎想通了一些事情，不过没对着石马修说出自己的猜想，只是轻笑着回答：“是见过几次的学长。”

      “反正总之就是！”石马修继续咬牙切齿地控诉：“现在不管做什么，章昊都得带上他那个小男朋友，烦都烦死了！我为什么要在那里当电灯泡啊啊啊！！？”

      “我懂了，”朴乾煜强忍着笑意，假装同仇敌忾道：“金奎彬谈恋爱之后，也没空跟我打球了！说什么他的时间都是属于昊哥的，简直可恶啊！”
      “对吧？！”石马修狂拍着大腿，突然话锋一转：“所以你这周末必须得来！！知道吗？”

      毫无上下文关联的几句话，目的性却很明确。
      朴乾煜被彻底逗笑，嘴角几乎要咧到耳根：“好啦好啦，我会去的。”

      06. 

      周末一早，金奎彬准时把车停在了朴乾煜家楼下。

      还没来得及跟副驾驶的章昊问好，后座车窗里伸出来一个小老外的脑袋，朝朴乾煜露出了史上最大的笑容：“帕果努早上好——！！”
      为了这次的音乐节，石马修特意挑染了几撮白色，使得原本就蓬松的卷发看起来更像一顶大蘑菇了。

      “早啊，马修哥。”朴乾煜回了他一个同样大的笑脸，拉开后座车门，动作利落地钻了进去。

      发现石马修几乎要被大大小小的背包淹没，朴乾煜失笑：“怎么准备了这么多东西？我们似乎不是去旅游吧……”而他的随行包里只装了几样必需品。
      “因为我之前答应你什么都不用带！”石马修今天格外兴奋，笑声就没停过：“哼哼，欧巴说到做到。”

      “咳咳，”金奎彬出声打断了两人的热聊，透过后视镜看着他们：“车里好像还有两个人。”
      “昊哥早！”朴乾煜有点礼貌但不多，理所当然地无视了挤眉弄眼的金奎彬。

      章昊点头问好，却同样不怀好意道：“你俩今天打扮得挺像一对，提前约好的？”
      “没有啊，”石马修挽着年轻人的胳膊，没注意到他逐渐红透的脸颊，很天然地回答：“这是我和乾煜的心电感应～你不要太羡慕啦～”

      -

      石马修必须参加这次音乐节的理由是，他中学时代最喜欢的乐队第一次来韩国表演，这也是他第一次有机会在现场看他们的演出。

      恰好章昊有喜欢的音乐人同场表演，两人一拍即合，决定在音乐节后方的草坪上露营。
      又买了两张充气沙发，打算美美地躺上一天，再喝点小酒。既不影响看演出，又不至于站一整天累成狗。

      所以哪怕要当电灯泡，石马修也忍了。

      不过一搭好营地，他就拖着朴乾煜东走走西逛逛，看见什么都觉得新鲜，倒把那两个人忘了个干净。

      金奎彬半个身子陷在充气沙发里，相当无语：“天黑之前，我能喝上他俩买回来的啤酒吗？”
      闻言，躺在另一张充气沙发上的章昊哈哈大笑：“我合理怀疑他们是去种大麦了。”

      “昊哥？”两人身后传来了青年男人的声音，又夹杂一丝的迷茫，“……奎彬？”

      -

      石马修和朴乾煜端着啤酒返回的时候，正巧撞见了这一幕。

      三个人僵硬地站在营地中央，保持着熟识却不亲密的距离。
      章昊主动牵住金奎彬的手，而站在对面的金泰来表情晦涩，上下打量着两人。

      石马修嘴里喊着“泰来啊——”就得过去打招呼，却被读懂空气的朴乾煜一把拽住了胳膊，“马修哥，我们先别过去添乱了。”
      “？”石马修不明所以，听话地停下了脚步。

      下一秒他就看见金泰来极其愤怒地揪住了章昊的衣领，几乎要挥下拳头，然后立刻被金奎彬大叫着强行拉开。
      而章昊一脸平静地说着什么，丝毫没有生气的意思。

      “我操！怎么还打起来了！！”石马修不知道自己该帮哪边，但绝对不能放任他的好朋友们在大庭广众之下上演全武行的戏码。
      他放下啤酒拔腿就跑，却被眼疾手快的朴乾煜拦腰抱住，在原地动弹不得。

      “你放开我！”石马修在朴乾煜怀里不停地扑腾，他以为年轻人是怕他在一片混乱里挨揍：“放心吧，他们没人打得过我的！而且我是去劝架，不是去打架！”

      “不是，”朴乾煜心里暗自感叹石马修的力气可真够大的，一边用足了吃奶的劲儿环住他的腰：“泰来哥是奎彬的亲哥，这种家务事还是让他们自己解决吧……”

      “啊！？”石马修彻底呆滞住了，重复了一遍才想明白：“亲哥？哎哟！他俩玩这么大？！”
      朴乾煜低声回答：”所以我想，这应该就是昊哥不愿意公开恋情的理由。”

      -

      放不下心的石马修拉着朴乾煜在暗中观察着局势，打算随时冲过去劝架。

      想不到章昊主动支开了金奎彬，要和金泰来单独聊一会。
      不知道两人说了什么，只见金泰来的表情逐渐从暴怒变得平静，最后长长地叹了一口气，上前紧紧拥抱了章昊。

      “看来昊哥几句话就把泰来哥拿下了。”朴乾煜八卦地点评着剧情。
      “我可从来没听说过泰来有个这么大的亲弟弟。”石马修撅着嘴，似乎不太开心。

      “他们是同父异母的兄弟，在学校里都装作不认识的。”朴乾煜体贴地拍拍他的后背，开导道：“其实我是在偶然间得知的，哥不知道的话也不奇怪。”
      石马修继续低头生着闷气：“好吧……我真的不知道……”

      “对了，马修哥应该还不知道吧？”朴乾煜主动岔开了令人郁闷的话题：“我也有个亲哥，现在已经工作了。”
      “嗯？长得像你一样好看吗？”石马修没经思考，调情的话脱口而出。

      朴乾煜听完后脸红了一瞬，紧接着严肃地补充：“我哥结婚了！不许打他的主意！！”
      “啊，那可太遗憾了……”石马修莫名其妙地感叹道。

      “你在遗憾什么？嗯？？”
      “反正就是遗憾哈哈哈！哎哟，别挠我，我开玩笑呢哈哈哈哈！！”

      -

      两个人端着啤酒回到营地，金泰来已经不见了。

      章昊神色自若地跟金奎彬吐槽：“我就说他们去种大麦了吧，连裤子上都有泥巴。”
      金奎彬许是被刚才的架势吓得还没回神，跟着干笑了两声。

      石马修低头一瞧，多半是两个人蹲在附近看戏的时候，不知不觉蹭上的。

      “哦，马修哥刚才不小心摔了个屁股蹲。”朴乾煜若无其事地伸手拍掉他屁股上沾的土，趁机狠狠捏了一把。
      “那还不是因为——”石马修话说了一半，再说下去就要暴露，炸毛道：“你真坏！”

      章昊举起啤酒，仰头灌了一口，脸颊挂着微妙的红晕：“我喜欢的乐队快出场了，我们等下就分头行动。”

      “OKOK——”石马修巴不得早点把这对情侣赶走。

      两个人感兴趣的表演都比较晚，他前一天晚上特意嘱咐了朴乾煜带上游戏机，打算联机玩宝可梦打发时间。

      -

      章昊中途回来取了件外套，本以为会撞破两人的奸情，却只看见石马修依偎在朴乾煜身旁睡得正香。

      “马修的睡眠质量真好，这么吵的音响居然都能睡着。”章昊轻声吐槽着，再仔细一瞧，朴乾煜的眼皮几乎也要合上了，不禁笑出了声：“你俩也真是的……”
      朴乾煜强打着精神跟他打了声招呼，章昊连忙提醒：“等会看演出记得带雨衣，要变天了。”

      年轻人一边说着“好的好的”，一边倚在石马修肩头睡着了。
      宝可梦原来还有这么好的催眠效果。章昊摇摇头。

      -

      朴乾煜是在天空降下第一道闷雷的时候，才想起了章昊的叮嘱。
      而此时的他和石马修已经处在人群中央的位置了，后面不断涌来的观众将他们一层层困住。

      “怕是要下雨了，我回去拿雨衣吧。”朴乾煜凑到石马修的耳边，轻声道歉：“对不起，昊哥提醒过我了，我睡醒之后忘记了。”
      “不用啊，没关系的。”石马修满脑子都是台上的演出，根本不担心淋雨这种小事：“你就算拿到雨衣，也很难挤再进来呀！”

      朴乾煜紧抿着唇，没说话，像是自责，又像是在想办法。
      石马修主动捏捏他的手心安抚，非常乐观地说：“况且不一定会下雨。”

      -

      喜欢的乐队出场还没到五分钟，豆大的雨点就噼里啪啦地砸在了观众的身上。
      人们纷纷用起各种工具避雨，石马修甚至看见有个大哥直接往头上套了一个黑色塑料袋。

      石马修正要招呼朴乾煜一起看塑料袋，却忽然发现头顶的雨停了。
      朴乾煜脱掉了自己的外套，盖在了他的头上。

      他还没来得及感动，一转头先看见了某人在倾盆大雨里只穿着一件黑色的背心，雨点乱七八糟地落在他的头上和身上。
      石马修又急又气，声音带着不易察觉的颤抖：“你这小子疯了吗？”

      “马修哥……”朴乾煜一脸无奈，怎么还生气了，他只是做了自己想做的事情。
      石马修立刻回身取下头顶的外套，双手举高，搭在了朴乾煜的脑袋上。

      顶着外套的朴乾煜叹了一口气，捏了捏男人沾染雨水的脸颊：“哥要是被淋湿了怎么办？”

      “我有办法！”石马修灵机一动，直接钻进朴乾煜的怀里，紧紧地圈住了他的腰。
      “这下一件衣服就能盖住两个人啦！”他咧着嘴巴傻笑，在心底感叹自己简直是绝顶聪明。

      朴乾煜抬手调整了外套的位置，确保石马修不会被打湿太多。
      一低头便和那双亮晶晶的狐狸眼撞上，就再也没办法移开目光。

      他哑着嗓子开口：“这样的话哥就看不到演出了。”边说边暗自箍紧了石马修的腰。

      石马修装作左右为难的模样，嘴角却轻轻上扬：“唉，那我只好看乾煜了。”
      “只看我不好吗？”朴乾煜脱口而出，说完又觉得后悔，怕暴露本性吓到石马修。

      闻言，石马修唇边的弧度越来越大，忽然踮起脚尖，吻了他一下。

      -

      蜻蜓点水般的吻，却把朴乾煜整个人都烧红了。
      他支支吾吾半天没说出一句完整的话。

      石马修嘟嘟囔囔：“又不是没亲过……”
      嘴里说着潇洒的话，明明自己的脸颊也红得要命。

      “那不一样！”
      “哪里不一样？”

      “就是、就是不一样。”
      “那次我们可是亲了好多下呢。”

      -

      不想和小学生拌嘴，朴乾煜双手捧住了石马修的脸颊，深深地吻了下去。

      搭在头顶的外套也因为他的动作幅度过大而滑落，正巧盖住了两个人的脑袋，仿佛把世间的一切都隔绝在外，无人能够窥探分毫。

      两人的眼前除了彼此，什么都没有。

      石马修动情地回吻着朴乾煜，音响里意外地传来了他中学时代最爱的情歌，和耳边年轻人凌乱而沉重的呼吸声交织在一起，让他几乎要落下眼泪来。
      快要三十岁的他在遥远的陌生国度里遇见了少年石马修最想要得到的爱。

      -

      “朴乾煜，和我谈恋爱吧。”
      “好！”

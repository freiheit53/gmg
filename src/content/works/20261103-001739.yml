summary: 我啥时候写的来着？
status: finished
chapters:
  - title: 251004 完
    body: |+
      

      刚洗完澡的朴乾煜带着一身水汽推开房门，却发现有位不速之客正窝在他的电脑椅上悠闲地刷手机。

      朴乾煜揉了揉眼，惊讶道：“怎么这么晚过来啦？”
      “我们浴室的灯又坏了！”石马修瘪着嘴，头也不抬：“经理不许我摸黑洗澡，说万一摔倒了可怎么办，就把我赶过来了。”
      朴乾煜点点头：“正好现在浴室没人，哥快去洗吧，明天一早还得彩排呢。”

      石马修闻言立即起身，在和朴乾煜于狭窄的房门口擦肩而过的瞬间，他极其顺手地捏了捏年轻人的屁股，还笑嘻嘻地留下一句：“借用下你的哦～”
      朴乾煜随口答应道：“行。”

      -

      是梦，朴乾煜却觉得不对劲。

      小猫不停地舔舐着他的脸颊，它的舌头上却没有倒刺，只留下了一串湿漉漉的水痕。
      压在胸前的明明是一团热乎乎的猫咪，重量却像有一百多斤，直叫他喘不过气来。
      下半身倒是莫名有点兴奋，他下意识地抚了上去，不愧是热血沸腾的年纪，小兄弟大半夜还这么精神抖擞。

      等等。谁踏马把我内裤脱了。

      朴乾煜猛地睁开眼睛，和心虚的石马修四目相对数秒后，他明白了一切。

      哪里有什么小猫咪？
      分明是一只馋嘴的狐狸。

      -

      “哥……”朴乾煜把尾音拉得很长，相当无奈道：“你知道我们明后天还有两场演唱会吧？”
      石马修眨了眨眼睛：“当然知道。”

      “那你这是在做什么？”
      “我睡不着嘛……”

      “怎么会睡不着呢？”
      “闭上眼睛全都是舞台！”

      “好吧，但是我得睡觉了。”
      “没关系呀，你睡你的！我自己玩一会！”

      朴乾煜认命地闭上眼，下一秒就被握住了小兄弟。
      一整天的超负荷运转让他困得要命，没力气配合石马修的深夜play，只是皱了皱眉，头一歪很快又睡了过去。

      -

      湿热紧致的快感让朴乾煜忍不住呻吟出声。
      他再次从沉梦中苏醒。

      眼前的一幕更是让他清醒了许多：石马修自顾自地「借用」了朴乾煜的小兄弟，正一丝不挂地骑在他的身上，挺翘的臀部快速地吞吐着，性器也随着动作一颠一颠。
      在昏黄灯光的映照下，他的皮肤甚至透出了淫靡的红色。

      见人醒来，石马修也顾不上解释太多，开口便是浪叫：“操……好深好舒服……”
      朴乾煜连忙捂住他的嘴，警告道：“小点声，宿舍隔音不好。”
      身体倒是很诚实地耸动起来，接连几下都是尽数没入，恨不得将他再凿出个洞。

      石马修被强制静音后，一时间房间里只剩下不绝于耳的水声和床板“嘎吱嘎吱”的摇动声。

      -

      在高频的顶弄下，石马修的高潮来得很快。
      他想要尖叫，却不敢发出声音，只得死死咬住自己的手掌，整个人都抖得厉害，几乎要流下生理泪水。

      见状，朴乾煜叹了口气，身下动作仍旧粗暴得很，无情得像是要把石马修彻底贯穿。
      又一把将人拉进怀里，用唇瓣堵住了他的所有哭喊。

      石马修却颤抖得更厉害了。
      唇齿厮磨间，尽数洒在了年轻人的小腹。

      本就困顿的朴乾煜也不再坚持，挺入几下后便匆匆拔出，释放得乱七八糟。

      -

      次日清晨，朴乾煜又是被胸口的重量压醒的（为什么要用「又」）。
      他的胸前除了趴着睡得正香的石马修，还矗立着一只「真正」的猫咪，蓝色的竖瞳正警惕地盯着房间里的不速之客，尾巴不停甩来甩去。

      昨晚一番折腾后，那床实在没办法再睡，两个人无奈之下又鬼鬼祟祟地溜回了马修的房间。

      朴乾煜伸出手把猫赶走，轻声抱怨道：“Gia好重，该减肥了啊……”
      “跟孩子胡说什么呢？”不知何时醒来的石马修没好气地掐了一下年轻人的脸颊。

      “哥，它差点压死我！”朴乾煜哼哼唧唧地告状，手臂把男人箍得更紧了一点：“不分青红皂白就怪罪我，我看Gia才是你的「My First」吧！”
      石马修随口回答道：“你们都是My First呀。”

      “一个人怎么可以有两个First呢？”朴乾煜对这个答案很不满意，说着就要伸腿把人踢下床：“那哥以后还是搂着猫睡吧，少来扰人清梦。”

      “吃Gia的醋呢？”
      “哼。”

      “哎哟，Gunwookie怎么这么可爱呢。”
      “没你的猫可爱。”

      “我知道了！”
      “？”

      石马修突然大喊一声：“Gia过来！”
      暹罗猫闻声飞快地跳上了床，高仰着脑袋，在两人交缠的身体上优雅地踱步。

      他指着朴乾煜，对Gia一脸认真地说：“叫阿爸。”
      猫自然是没搭理石马修，甩了甩尾巴又跳下了床，它还是对去高处探险更感兴趣一点。

      朴乾煜听到“阿爸”两个字，脸颊一下子全红了。
      嘟嘟囔囔半天没说出辩驳的话，半推半就地接受了自己的新身份，也就没了吃醋的道理。

      -

      Gia：咪的天。人居然想要让猫说话。

  - title: 240423 写一半忘了
    body: |
      
      朴乾煜挂着两个沉重的黑眼圈，没精打采地走进了路边不起眼的小店。
      他已经记不清自己连续几天只睡了两个或三个小时。
      但他永远忘不掉他弄丢小熊的那一天。

      据说，朴乾煜还不到三岁的时候，每天晚上就得抱着小熊睡觉了。
      简而言之，小熊见证了他从几十厘米高的毛毛头长成了二十二岁的成年男性。

      经过多次缝缝补补的小熊早已破烂不堪，稍微用些力气都能让它四肢搬家。
      朴乾煜却当个宝贝一样走到哪儿带到哪儿，直到不小心在某次外宿时把它弄丢。

      他像疯子般找遍了所有可能的角落，始终一无所获。
      一想到他的宝贝小熊现在正躺在某个垃圾桶里和烂瓜皮臭果子交流感情，朴乾煜的五脏六腑都要挤到了一起。

      -

      不愧是奎彬力荐的老店，十几平方的店面完全被各种各样的毛绒玩具塞满，只留出了一条可供客人经过的小路。
      “店主肯定是个小个子，”被悬挂着的玩偶哐哐砸了好几下脑袋的朴乾煜在心里嘀嘀咕咕。

      来到柜台前，却没见到任何人，从沿街的橱窗来看分明已经进入营业状态了。
      朴乾煜试探性地开口：“你好，有人在吗？”

      “啊！客人你好~”声音来自柜台后的毛绒玩偶堆，那里恰好是顾客的视线盲区，有人正趴在上面小憩。
      是个不错的摸鱼地点呢。朴乾煜心想。

      说话的人睡意朦胧，顶着一头炸开的蒲公英般的粉发，强打精神走到了柜台前。
      朴乾煜从他脸上清晰的黑眼圈判断出，这个人和他一样，昨晚也没睡个好觉。

      “你好，我来取定制的小熊。”朴乾煜对着同样睡眠不足的人客气道。
      “朴先生是吗？”粉毛低头在平板电脑上戳了几下，跟他确认订单信息，“你还需要支付xxxxx韩元。”

      朴乾煜爽快地刷卡结账，小个子店员丢下一句“稍等”就头也不回地钻进了背后的房间。
      他忽然觉得有哪里不太对劲。

      两分钟后，粉毛从房间取出了一个精致的包装盒。
      朴乾煜倒没急着拆，纠结了几秒钟，还是问出了心底的问题：“或许，你就是那位石师傅吗？”

      除了如出一辙的外国人口音，他还仔细瞧了瞧，这人长得和石师傅的头像一模一样！（蓬头垢面版）

      朴乾煜先前以为石师傅最起码有四十岁了。
      他想不到看起来跟他差不多年纪的人有什么要把网名改成“AAA专业毛绒玩偶定制石师傅”的必要。
      头像啊，说不定是广告模特之类的。

      闻言粉毛迟缓地眨了眨眼睛，似乎不敢相信自己听到了什么白痴问题，却还是好脾气地回答道：“是我，这家店是我一个人经营的。”

      “石师傅？”朴乾煜难以置信地重复了一遍。
      石师傅一脸疑惑地歪了歪头，“为什么这么惊讶？”
      “那个网名……”听起来比本人大了二十岁啊。

      “哦哦！你说那个！！”粉毛忽然兴奋了起来，开始眉飞色舞地跟朴乾煜讲述自己网名的由来。

      简单来说，他先前的网名起得比较随意，社交媒体也是年轻人的画风，比起手工匠人看起来更像个学徒。
      很多线上的客人不敢轻易把心爱的玩偶托付给他，也不会委托过于复杂的订单，无形中流失了很多业务。

      他冥思苦想了许多天，最终选择模仿好友列表里开锁师傅的网名和语气，成功建立起了一个中年手艺人的互联网形象。

      还别说，这招儿真挺管用的。
      朴乾煜这不就被唬来了吗？

      -

      “总之，网名只是招揽生意的手段，”粉毛把他手里漂亮的包装盒推向了朴乾煜，示意他打开看看，一边笑吟吟道：“卖的东西不好的话，是留不住客人的。”

      朴乾煜小心翼翼地打开盒子，是他记忆里的小熊，有着几乎一样的毛茸茸的大耳朵和亮晶晶的豆豆眼。
      只是不再穿着那件破破烂烂、洗到没办法再洗的毛线背心，制作者为它精心编织了一件全新的毛衣。
      反而像极了他幼时第一次见到小熊的模样。

      朴乾煜心知肚明，眼前的并不是自己先前的那只小熊，却还是控制不住被内心强烈的失而复得感冲击。
      他鼻头一酸，几乎说不出话来，只是低头咬着唇角。

      粉毛没注意到他异常的神情，还在自顾自地介绍着自己的作品，脸上写满了毫不掩饰的骄傲。
      他对自己“生”的毛绒玩偶向来都很满意。

      “总之，如果还有哪里需要调整，随时可以送回店里，除了人为损坏都免费保修的哦~”粉毛暂时结束了他的长篇大论。
      朴乾煜的情绪仍然比较激动，但不想在第一次见面的人面前丢脸，轻声回复了一句：“谢谢，我很喜欢。”

      “你喜欢就好！这次不要再弄丢啦！”
  - title: 250621 完
    body: |
      
      平稳行驶的保姆车上，成员们昏昏欲睡。

      “Gunwookie……”石马修努力凑近朴乾煜耳边，用着只有他们两个人能听见的音量抱怨：“你都好久没陪陪我了……”
      朴乾煜哭笑不得地回答：“我们现在不是正待在一起吗？”

      “我是说，”石马修难得吐字清晰：“我要做爱。”
      闻言朴乾煜扬起眉毛，故意捏了一下石马修的屁股，笑得暧昧：“怎么这么突然？前几天放假刚做过呢。”

      “哈！”石马修像是回想起了什么，在座位上激动地弹了两下，音量也不再受控制：“你居然还好意思提上次！你小子特么的……”
      在成员们听见石马修的劲爆发言之前，朴乾煜赶紧捂住了他的嘴，连忙承诺：“好好好，这次全听哥的。”

      石马修瞥他一眼，脸上写满了不信任：“真的？”
      “真的，”朴乾煜捏着男人的后颈，柔声安抚道：“我什么时候骗过你？”

      石马修在沉思片刻后宣布：“我要操你。”

      ^

      漫长的练习结束，成员们陆续离开，石马修“咔嗒”一声反锁上了练习室的门。
      下一秒，他把身后的年轻人紧紧地压在了门上，踮脚吻了上去。没有犹豫，没有试探，只有满溢出来的欲望。

      “这么急。”朴乾煜刚开口调笑了一句，就被男人用力抓住了屁股，隔着一层衣物胡乱地揉搓起来。
      莫名酥麻的感觉让他忍不住喘息出声，脸颊逐渐变成了粉红色，身体也立刻起了反应。
      他再次小心翼翼地确认：“我们要在这里吗？”

      “嗯，”石马修埋头吮吸着朴乾煜的脖颈，不方便留下吻痕，却不能阻止他留下细细密密又湿湿热热的唇印，喑声道：“怎么了？”
      朴乾煜摇摇头，他只是没那么喜欢地板。

      他低头盯着石马修极其漂亮却沾染了情欲的侧脸，手掌不自觉抚上男人的后脑勺，指尖划过了微湿的碎发，心头忽然涌上阵阵欢喜，甚至盖过了第一次被操的紧张。

      这种画面只有他才能看到。

      ^

      其实朴乾煜根本不介意谁在上面。
      只要是石马修就好了。

      ^

      不知不觉两人的衣物散落一地，未着寸缕的朴乾煜跪坐在地板上，抬头望着穿戴也不再那么整齐的石马修。
      两个人对视的瞬间，空气里像是有些火星炸开了。

      “怎么办，你现在看起来好色哦。”石马修毫不保留地夸奖道，伸出一只手抚摸着年轻人早已红透的脸颊，只恨不能掏出手机拍照留念。
      朴乾煜乖巧地在手掌上蹭了蹭脑袋，接着歪头舔了一下男人的掌心：“我还能更色一点。”

      石马修轻笑着开口：“那就让我看看吧。”

      ^

      朴乾煜膝行到石马修身前，鼻尖几乎要顶住他的小腹，不费力气地扯下了男人身上仅剩的几块布料。

      早已起立的性器弹到了朴乾煜的脸颊旁，他顺势在上面蹭了蹭，又单手握着仔细端详起来。
      他早就见过这东西无数次，只是从来没想过有一天要被它插入——石马修的个头不高，但性器的尺寸绝对不能算小，说不紧张是骗人的。

      再一抬头，石马修已经不再掩饰脸上的坏笑。
      没等他想好说什么，性器就蛮横地顶进了他的嘴里，带着轻微的咸湿和苦涩，却是石马修的味道。

      朴乾煜顺从地含住了顶端，胡乱吮吸几下后便开始规律地吞吐起来，整根性器很快就被舔弄得湿漉漉的。
      被爱人温暖湿润的口腔紧紧地包裹，身体和心理获得了双倍的愉悦，于是石马修不再忍耐自己的呻吟：“唔……好舒服……Gunwookie好会舔……”
      闻言朴乾煜更加卖力地舔舐起来，一时之间练习室里只剩下难耐的喘息和啧啧的水声。

      朴乾煜没忘记自己的任务，故意含着那东西说话：“友铉欧巴……好大好喜欢……”说完又狠狠一吸。
      他知道男人有欧巴病，不介意偶尔在口头上让他爽一爽。

      果然石马修听到这句话，立刻抓紧了身下人的头发，控制不住地用力顶向了他的喉咙深处，几乎整根没入。

      低头看见朴乾煜红红的眼角却又开始后悔，不该对他那么粗暴，尽管一开始是他招惹的。

      ^

      石马修一把捞起地上的朴乾煜，温柔地吻着他红肿的唇角，手却极不老实地揉搓起他的屁股。

      跪久了，朴乾煜的腿有些脱力，又被男人极其色情地摸了屁股，双腿一软差点就要再跪回去。
      石马修把他带到镜前，对着镜子里脸红的年轻人不怀好意道：“看清楚我是怎么操你的。”

      “把腿并紧。”

      ^

      石马修一开始就没打算在练习室里操朴乾煜，两人什么都没准备，他才舍不得弄伤他。
      但一整晚看着年轻人又长又直的大白腿在自己面前晃来晃去，想玩腿交也是人之常情。

      ^

      石马修借着刚才唾液的湿润，从背后深深地插进了朴乾煜的腿根，和他想象中一样的温热紧实，肉感十足。
      他喘着粗气夸奖道：“宝贝好紧……好棒……”

      没等朴乾煜说什么，石马修双手握住他的腰，直接大开大合地动作起来，顿时爽得不知东南西北。
      过分的快感让石马修不自觉沉溺其中，没注意到朴乾煜颤抖的双腿和几乎贴住镜子的上半身。

      直到一声脱口而出的呻吟唤醒了他。
      两个人心知肚明，大腿是不会产生快感的。

      ^

      石马修愣了两秒，立刻会意地握住了年轻人挺立的性器，调笑道：“Gunwookie也很喜欢，对吧？”
      右手缓慢撸动着，又伸出了左手捏住了他的乳尖。

      听着朴乾煜越来越高的呻吟声，石马修再一次兴奋地撞进了他的腿根：“Gunwookie真是欧巴的好孩子。”

      “呜……”朴乾煜不知道自己是怎么了，分明没有被石马修真正插入，却爽得像是被彻底贯穿了。
      腿间进进出出的性器烫得可怕，温度几乎要把他融化，灭顶般的快感让他的高潮很快到来。

      “我们一起。”石马修胡乱舔舐着朴乾煜的后颈，身下的动作也变得急躁且粗鲁，快速撸动着年轻人的性器，甩出了几滴清澈的水珠。

      镜子里的朴乾煜双眼失神，嘴唇红肿，刘海乱七八糟地贴在额上，一副被欺负得狠了的样子。
      忽然感觉腿根处涌出了一股热流，浓稠的白浊一路沿着大腿滴落到地板上，留下了星星点点的痕迹。

      还没等他反应过来那是什么，眼前有阵阵白光闪过，他猛地仰起头，尽数泄在了面前的镜子上。

      结束后的石马修紧紧拥着他，长舒了一口气，黏黏糊糊地开口：“舒服吗？”
      朴乾煜点点头，衔住了石马修的唇瓣，温柔地吮吸着。
  - title: 240515 写不下去了贴了大纲
    body: |
      　　
      “果努，”刚说两个字，金奎彬就没忍住对着手机打了个酒嗝，“你能不能来小菊菊酒吧接我，我好像，喝得没办法自己回去了……”
      “小菊菊酒吧？”朴乾煜皱着眉头复述了一遍这个诡异的名字，听起来实在不太正经。
      导航了一下地点位于他家附近的四五公里，于是爽快答应了：“知道了，我现在开车过去。”

      从走到酒吧门口看见亮粉色的霓虹灯开始，朴乾煜就感到一种说不出来的别扭。
      路过的每个人看他的眼神都有些不对劲，在上下打量他一番之外，还有更多晦暗潮湿的东西，他一时间没有抓到。

      一开始他以为是自己的穿搭出了问题。
      低头瞧了瞧，急急忙忙出门只套了黑色连帽衫和牛仔裤。
      尽管算不上时尚，但半夜跑出来接人穿这身衣服总没关系吧。

      直到看见了舞池里成群结对的奇装异服、甚至衣不蔽体的家伙们，还遇到了几个朝他不停抛媚眼并试图拦下他的陌生男人，朴乾煜总算意识到这里是什么地方。

      妈的，金奎彬没事儿跑男同性恋酒吧买醉干什么？！！

      -

      若非朴乾煜真的扛不动金奎彬，他早在半个小时之前就把人打晕送回家了。
      而不是现在坐在吧台听这个醉汉讲着他没完没了的失恋感想。

      “你知道吗帕果努，他甚至都没考虑一下就拒绝我的表白了……”金奎彬双手捂脸，让人看不清楚他的表情，却没停下念念叨叨的嘴：“连一秒钟都没考虑啊……”
      朴乾煜低头划着手机，偶尔敷衍他几句，“不喜欢你呗。”

      “我不相信他对我一点感觉都没有……”
      “否则为什么，为什么总是送给我那么贵重的礼物？”
      “有钱烧的。”朴乾煜继续专心扣手机，日常任务还没清完呢。
      　
      金奎彬已经醉到直不起身子，整个人几乎挂在朴乾煜身上，热乎乎的朝他喷着酒气。

      头顶忽然传来两声轻笑，“Hi baby~你就是奎彬的男人吗？”
      声音又顿了一下，“总是放任他一个人来这里买醉很危险的哦。”
      有些奇怪的韩语口音让朴乾煜好奇地抬起了头。

      声音来自站在吧台里的小个头调酒师，一头蓬松又轻佻的粉色头发，衬得皮肤白白嫩嫩，像枚软糯的草莓大福。
      对视时明亮而湿润的眼睛，搭配着尚未褪去婴儿肥的脸颊，简直是在向全世界宣布“我很好欺负”这件事。

      明明是乖巧可爱的长相，一开口却问了个抽象得让朴乾煜狂冒鸡皮疙瘩的问题。

      他这辈子从没用过、将来也绝不会用到“某个男人的男人”这类词汇。
      再退一万步说，就算真的非得使用这个词，那对象也不可能是金奎彬——他俩在穿开裆裤的年纪就是好哥们了。
      譬如说，“及川彻的男人”，听起来是不是顺耳多了。
      好像也没有。还是从字典里删除这个词吧。

      ”谢谢，酒醒之后我会劝劝他的。不过，我是直的。”朴乾煜矢口否认，多犹豫一秒钟都是对自己前二十二年直男人生的不尊重。
      “哦是吗？”很明显这个粉毛没相信他的话，不当回事地撇了撇嘴，调笑道：“现在喜欢来gay吧玩的‘直男’还真多呢。”

      -

      “Anyway，我挺喜欢你的。”粉毛自顾自说着话，接着把一个装满白色液体的玻璃酒杯推向了他，“这杯算我请你的~”

      以为是鲜奶油鸡尾酒之类的特调，朴乾煜正想回答自己开车过来不方便喝酒，定睛一看，这酒怎么还冒着热气儿。
      他饶有兴趣地拿起酒杯端详，温热纯净的液体、却闻不到一丝酒精的气味（并不是鼻炎发作）。
      随即抿了一小口，居然真的是牛奶，没有添加任何额外内容的牛奶。

      到底是什么样的人才会在酒吧里请别人喝牛奶呢？

      他仰头打量着正在吧台里不停忙活的粉毛，动作干净利落地在瓶瓶罐罐中间打转。
      酒吧生意不错，却不知为何只有一位调酒师，因而男人没跟朴乾煜搭上几句话就被其他顾客喊走了。

      摇酒时不经意露出了饱满且流畅的上臂肌肉，肤色却白嫩得像是从来没有晒过太阳，引来旁边几声不怀好意的口哨。
      朴乾煜也因为意外而多瞧了几眼，看不出是会去健身的朋友。
      而粉毛只当作没听见，聚精会神地配制着手里的酒，每个步骤严谨得像是在做某项科学实验。

      不仅是胳膊线条，手指也很好看呢。
      还有脸蛋也……

      等等，不是，我在想什么呢？
      这个酒吧有问题，我他妈被传染同性恋了。
      朴乾煜在心底默默吐槽道，端起牛奶咕咚了一口。

      注意到朴乾煜在他身上停留了许久的目光，粉色头发的家伙一咧嘴笑了起来，灿烂得让他晃了一下神。
      又冲着他努了努嘴，示意他看向面前的吧台。

      原来酒杯底下还压着一张黑色的名片。
      只是先前他的注意力全被这杯牛奶吸引走了，所以没有察觉。

      “是我在做的副业，欢迎来照顾生意哦，”粉毛忙里偷闲凑到朴乾煜面前，做作却并不油腻地朝他wink了一下：“‘直男’也欢迎~”

      黑底白字的名片上孤零零地印了一串推特账号，至于姓名、电话和地址之类的常规信息一概没有说明。
      反面印着一颗烫银工艺的狐狸脑袋，像极了粉毛刚才眨眼时的模样，这么熟练的营业，说是地偶他也信了。

      但冰冷的名片和男人给他的印象又形成了古怪的反差。
      神神秘秘又鬼鬼祟祟，不像可以摆在明面上谈论的工作。

      不过话说回来，调酒师通常会做什么样的副业呢？

      -

      事实证明，过于旺盛的好奇心确实会害了朴乾煜。

      作为警察预备役（也就是警校生），调查一下互联网灰色产业也是理所应当的事情吧？
      绝不是对粉毛男人产生了同性恋之类的兴趣。
      想到如此绝佳理由的朴乾煜，回家后随即键入了那串账号。

      FOX...MATT...SM???

      开头的两个单词不难理解。
      FOX指代名片上的狐狸图案，而MATT是男人的名字。

      后面两个字母让朴乾煜下意识有点紧张。
      屏住呼吸，然后凝重地按下了回车键。

      好消息：主页里并没有视觉冲击的内容。
      坏消息：每条推文都贴心地附上了内容警告。

      「      
      　　  内容警告：裸体、暴力、敏感内容
      　　  作者已将这个帖子标记为显示敏感内容。
      　
      　　                                                              显示       」

      以防产生不必要的误会，朴乾煜做贼心虚地反锁了房门，尽管他早就到了父母不会随意推门进来的年纪了。
      蹑手蹑脚钻进被窝，戴上耳机后郑重地点击了“显示”。

      固定机位的镜头对准的是一双戴着白色外科手术手套的手和另外一个男人赤裸但鞭痕累累的私密部位。
      朴乾煜一眼就认出调酒师那双比成年男性小一号的手，那另一方的自然就是“客人”。

      真的会有人花钱找揍啊！
      不是，你居然真的下手这么狠啊！

      除了不安分地上下其手之外，视频里还出现了许多根本无法想象的工具，甚至比他在刑侦课上见过的还要惊悚一些。
      两根手指拧着细长如毛线针般的尖锐物体在朴乾煜的认知里只能作为出口的部位进进出出，扯出一串串晶莹清澈的水珠和男人难以自抑的嘶吼。

      最后全部化为了一滩狼狈和几声喟叹。
      那双手只是沉默地劳动着，全程一言不发。

      而画面之外，朴乾煜的脑海里正在经历地震。

      -

      活了二十二年的朴乾煜从来没鉴赏过这么多男性器官。
      出于雄性生物某种莫名的自尊，他不太客观地认为在同样的状态下，还是自己的更大一点。
      尽管这些想法永远没机会去验证。

      一口气看完了主页里的所有视频，除了那双永远戴着手套的手之外，粉毛男人没有出过镜，也没有说过任何一句话。
      视频里只有客人们挨打时不停求饶和被控射后舒服的哼哼声。

      从反馈来看，用户体验确实不错；或许还提供了客制化服务，这么多的视频几乎没有重样的，他总能搞出一些新玩意儿。

      如果从结果反推，那么这些视频和他在锁门后观看过的所有限制级内容并没有什么本质上的区别，只是主角换了性别。
      但由于主角是他在现实生活中接触过的人，事情就变得无比诡异了起来——他没办法控制自己不去联想更深一步的内容。

      朴乾煜几乎怀疑这个粉色头发的家伙是不是有双重人格。
      怎么可以实物那么软萌，却在隐姓埋名的角落里举起了鞭子。

      而且仅有一面之缘，就如此随意地给自己发放了入场券……
      不知道是太放心朴乾煜，还是对自己的健身成果太有自信呢。

      -

      摄入过量小视频的结果是，朴乾煜硬得有点难受了。
      对于血气方刚的二十二岁男人来说，这实在再正常不过了（并不是对同性恋产生兴趣的意思），他选择大方地接纳自己的欲望。

      但不想看着这种东西做手活儿。
      坚决死守住直男的最后一道底线！

      他决定关掉这个该死的主页，并且永远不会再打开了。

      在今晚之后本就不会跟那个男人有什么交集了。
      就算金奎彬下次哭着求他，他也绝不可能踏入小菊菊酒吧一步了！

      朴乾煜消化着过于复杂的心理活动，手指无意识地点击了“关注”。
      关注成功之后，软件还贴心地给他推荐了几个同类型的博主，只看头像缩略图就能想象到里面的内容会有多么精彩。

      “卧槽！”被视觉攻击的朴乾煜终于回神，慌慌张张捧着手机，飞快地取消了关注。
      只好自我安慰，应该不会有人注意到他用实名账户手滑了几秒钟这件事。

      -

      朴乾煜换了个舒服点儿的姿势，正准备欣赏自己平日最爱那部的影片并彻底忘掉那个让他心神不宁的家伙时，手机不合时宜地弹出了一条新私信提醒。

      MATT：Hi Babyyyy~~~
      MATT：你果然会来

      朴乾煜顿时一惊，猛地从床上坐了起来。
      本以为自己取消得够快就不会被发现。
      现在不仅被发现了，还透过主页的信息认出了自己的身份。

      这人难道真的是狐狸变的吗？
      不想加深误会，朴乾煜果断回复了消息。

      WOOKIE：你好
      MATT：我的手艺怎么样？
      WOOKIE：不是
      WOOKIE：我以为是调酒视频才点进来的

      MATT：骗骗哥们儿就算了
      MATT：别把自己也骗了(^^)
      WOOKIE：……
      WOOKIE：我不太了解你们的圈子
      WOOKIE：真的只是好奇

      MATT：好吧 调啥不是调呢？ㅋㅋㅋ
      MATT：现在这世道赚点儿钱多不容易啊~
      WOOKIE：……

      辩论队出身的年轻人少见的出现了哑口无言的时刻。
      不管哪个星球的词典都不会把“调酒”和“调教”归类为同一个用法吧？！！

      朴乾煜有点恼火，又有点好笑。
      明知对方在胡搅蛮缠，却说不出难听的话。
      反而想要看他还能讲出什么别的歪理来。

      WOOKIE：不担心被抓吗？
      MATT：我这顶多算擦边
      MATT：你不说我不说谁知道？ㅋㅋㅋ

      WOOKIE：可是你揍过那么多人 
      WOOKIE：他们都知道了……
      MATT：WHATTTTT 
      MATT：什么叫我揍他们？！
      MATT：你是这样理解我精心制作的视频吗？？！！！

      WOOKIE：抱歉;;
      WOOKIE：不太熟悉你们的术语
      WOOKIE：你懂我的意思就好
      MATT：不是……
      MATT：你还真是直男啊？
      WOOKIE：是的

      MATT：晕 
      WOOKIE：我今晚是去接朋友的
      MATT：okkk 小直男~
      MATT：改天给你上一课 
      MATT：打工太累 困了
      WOOKIE：晚安
      MATT：晚安(^^)

      被突如其来的信息打断许久，身上的热度逐渐褪去，朴乾煜也丧失了做手工劳动的劲头，迷迷糊糊睡着了。

      -

      第二天清晨，朴乾煜神情恍惚地站在卫生间里搓着内裤——他梦遗了。
      竟然在青春期结束的五年后梦遗了。

      他不愿回忆自己在梦里和粉色头发的家伙具体发生了什么。
      只有冰冷濡湿的内裤还残留着梦境的一些实感。

      这一切突破了朴乾煜的认知——他从来没设想过自己跟同性之间会有任何的可能，但当下迷茫错乱的头脑也没法作出其他回答。
      啊，不管怎么想都是金奎彬的错。

      WOOKIE：醒了没
      GYUVINIE：111
      WOOKIE：你认识昨天那个粉色头发的调酒师吗？
      GYUVINIE：马修哥？
      GYUVINIE：当然认识
      GYUVINIE：你真该尝尝他的手艺

      WOOKIE：……
      WOOKIE：倒也不必
      GYUVINIE：不过你突然问他做什么
      WOOKIE：他说你总是一个人过去买醉很危险
      WOOKIE：我也这么觉得

      GYUVINIE：啊~马修哥真是个小天使
      WOOKIE：小天使？拿鞭子抽人的那种？
      GYUVINIE：怎么听不懂你说的话
      WOOKIE：没事儿 应该是你的酒还没醒(^^)

      GYUVINIE：我明明很有分寸的
      GYUVINIE：昨天不就打电话叫你来了吗？
      WOOKIE：你有个锤子分寸 
      WOOKIE：吐了我一车的事情你这么快就忘了？
      WOOKIE：下次我可不会去接你了

      GYUVINIE：啊？？！我真的不记得了！
      GYUVINIE：对不起对不起对不起对不起对不起
      GYUVINIE：洗车费我转你了啊啊啊
      WOOKIE：骗你的 八嘎
      WOOKIE：少喝点吧！

      朴乾煜耐着性子听金奎彬絮絮叨叨讲了半天有关石马修的情报。
      直到从他的嘴里撬不出什么新鲜的东西（甚至用了询问犯罪嫌疑人的技巧），朴乾煜才主动结束了这场漫长的对话。
      结论是，金奎彬真的对调酒师的“副业”一无所知——那么是否也就意味着，他的邀请是有选择性的，而自己出于某种未知的理由刚好被他选中了。

      朴乾煜陷入了一秒钟的纠结，随即立刻做出了决定。
      他不喜欢拖泥带水和瞻前顾后，所谓的心理障碍和想要探索的事情相比有些不值一提，如果因为几个贴标签般的词语就把自己的人生限制住才是真的愚蠢。
      那么就去瞧瞧看吧。

      WOOKIE：很难跟你解释
      WOOKIE：但如果方便的话 想见一面
      MATT：Welcome~

      -



      没控制好车速，朴乾煜比约定时间早到了半个多小时。
      过度紧张让他在密闭的车里感到缺氧，下车大口大口地呼吸着冰冷的空气。

      顺着石马修留下的地址，朴乾煜站在某个公寓前，按响了门铃。
      提前这么久到访，不知道会不会被当成不受欢迎的客人。

      -

      “噢——你来了——”透过电子猫眼认出了朴乾煜，石马修趿着拖鞋小跑过来开了门，穿着一身卡通睡衣，一条毛绒绒的大尾巴在身后摇来摇去。
      朴乾煜没忍住多看了几眼，想要亲自摸摸看。
      “现在开始吗？”石马修挠了挠后脑勺，有些为难情地说：“……可是我的动画片还没有看完。”

      “没关系，是我来得太早了。”朴乾煜脱下带着浓重寒意的羽绒服，换上了客用拖鞋。
      石马修熟稔地接过他的外套放到一边，屋里暖气开得很足，朴乾煜的脸颊不自觉开始发烫。

      他故作随意地打量起工作室的陈设——比起某些少儿不宜的意味，这里似乎更像一个宅男的秘密基地。
      最后他的视线落在客厅内的超大尺寸屏幕上，播放着他再熟悉不过的动画片。

      “你也在追这个吗？”朴乾煜有些吃惊，又觉得在情理之中，这番最近红得不可思议——作为原作粉，他有很多很多的话想说。
      一瞬间朴乾煜忘了自己是来干什么的，脱口而出：“这周的更新我还没看。”

      闻言石马修扬了扬眉毛，举着遥控器的手顿住，笑眯眯地回答朴乾煜：“正好，那就一起看吧！”
      他斜靠在沙发上，找了个足够舒服的姿势，放任自己淹没在厚重的毛毯里，又拍了拍旁边的空位，示意朴乾煜赶快过来。

      这么怕冷吗？朴乾煜脑内莫名闪过了这个念头。
      他在沙发的另一角正襟危坐，好奇地摸了摸石马修的毛毯，似乎觉得不太合适，又把手缩了回去。

      石马修看着拘谨的朴乾煜，忽然“噗嗤”一声笑了：“坐那么远干什么，我又不会把你吃了。”
      随手扔了一个毛绒抱枕给他，转过头把动画调到了刚开始的位置，按下了播放键。

      朴乾煜偷偷瞥了几眼石马修的侧脸，神情轻松得像是这个房间里没有第二个人。
      他也不自觉塌下肩膀，让身体陷进柔软的沙发，怀里紧紧抱着石马修扔给他的玩偶，逐渐沉浸在动画剧情之中。

      -

      “啊——怎么可以停在这个地方？！”片尾曲跳出来的瞬间，石马修大声地抗议起来，手脚并用地几乎把被窝掀了，皱成一团的脸上写满了不爽：“又要等一个礼拜了……”
      “或许你想知道后面的剧情吗？”朴乾煜轻笑着，他从来都不是故意剧透的那种人，但石马修过于夸张的反应实在太有趣，本能地想要逗逗他。

      “想！”石马修的眼睛顿时亮了起来，对他来说，读大段文本的难度系数太高，早就死了那条补原作的心。
      “男女主角啊……唉……”朴乾煜故意拖长了语调，一副痛心疾首的模样，吐出了一些不痛不痒的关键词：“真的好可怜啊……”

      眼见着石马修的嘴巴慢慢张大，成功地被他的几句话吊起了胃口，朴乾煜有点编不下去了，开始抿着嘴憋笑。
      这时候石马修还没意识到自己被耍了：“话不能只说一半啊！”

      朴乾煜乐得前仰后合：“想知道的话就去看漫画吧！”
      “呀！！我是外国人看不懂啊！”石马修抓着朴乾煜一条胳膊摇来摇去，无论如何都想立刻获得答案。

      朴乾煜低头看着握着自己胳膊的热乎乎的手，明显比他的小好几个尺寸，不知道联想到了什么，脸瞬间红了。
      他像是失去所有语言般支支吾吾：“你放心吧……他们的结局很幸福……”



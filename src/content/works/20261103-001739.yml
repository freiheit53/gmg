title: 未命名短篇合集
updated: 2025-10-04
summary: 我啥时候写的来着？
chapters:
  - body: |+
      

      刚洗完澡的朴乾煜带着一身水汽推开房门，却发现有位不速之客正窝在他的电脑椅上悠闲地刷手机。

      朴乾煜揉了揉眼，惊讶道：“怎么这么晚过来啦？”
      “我们浴室的灯又坏了！”石马修瘪着嘴，头也不抬：“经理不许我摸黑洗澡，说万一摔倒了可怎么办，就把我赶过来了。”
      朴乾煜点点头：“正好现在浴室没人，哥快去洗吧，明天一早还得彩排呢。”

      石马修闻言立即起身，在和朴乾煜于狭窄的房门口擦肩而过的瞬间，他极其顺手地捏了捏年轻人的屁股，还笑嘻嘻地留下一句：“借用下你的哦～”
      朴乾煜随口答应道：“行。”

      -

      是梦，朴乾煜却觉得不对劲。

      小猫不停地舔舐着他的脸颊，它的舌头上却没有倒刺，只留下了一串湿漉漉的水痕。
      压在胸前的明明是一团热乎乎的猫咪，重量却像有一百多斤，直叫他喘不过气来。
      下半身倒是莫名有点兴奋，他下意识地抚了上去，不愧是热血沸腾的年纪，小兄弟大半夜还这么精神抖擞。

      等等。谁踏马把我内裤脱了。

      朴乾煜猛地睁开眼睛，和心虚的石马修四目相对数秒后，他明白了一切。

      哪里有什么小猫咪？
      分明是一只馋嘴的狐狸。

      -

      “哥……”朴乾煜把尾音拉得很长，相当无奈道：“你知道我们明后天还有两场演唱会吧？”
      石马修眨了眨眼睛：“当然知道。”

      “那你这是在做什么？”
      “我睡不着嘛……”

      “怎么会睡不着呢？”
      “闭上眼睛全都是舞台！”

      “好吧，但是我得睡觉了。”
      “没关系呀，你睡你的！我自己玩一会！”

      朴乾煜认命地闭上眼，下一秒就被握住了小兄弟。
      一整天的超负荷运转让他困得要命，没力气配合石马修的深夜play，只是皱了皱眉，头一歪很快又睡了过去。

      -

      湿热紧致的快感让朴乾煜忍不住呻吟出声。
      他再次从沉梦中苏醒。

      眼前的一幕更是让他清醒了许多：石马修自顾自地「借用」了朴乾煜的小兄弟，正一丝不挂地骑在他的身上，挺翘的臀部快速地吞吐着，性器也随着动作一颠一颠。
      在昏黄灯光的映照下，他的皮肤甚至透出了淫靡的红色。

      见人醒来，石马修也顾不上解释太多，开口便是浪叫：“操……好深好舒服……”
      朴乾煜连忙捂住他的嘴，警告道：“小点声，宿舍隔音不好。”
      身体倒是很诚实地耸动起来，接连几下都是尽数没入，恨不得将他再凿出个洞。

      石马修被强制静音后，一时间房间里只剩下不绝于耳的水声和床板“嘎吱嘎吱”的摇动声。

      -

      在高频的顶弄下，石马修的高潮来得很快。
      他想要尖叫，却不敢发出声音，只得死死咬住自己的手掌，整个人都抖得厉害，几乎要流下生理泪水。

      见状，朴乾煜叹了口气，身下动作仍旧粗暴得很，无情得像是要把石马修彻底贯穿。
      又一把将人拉进怀里，用唇瓣堵住了他的所有哭喊。

      石马修却颤抖得更厉害了。
      唇齿厮磨间，尽数洒在了年轻人的小腹。

      本就困顿的朴乾煜也不再坚持，挺入几下后便匆匆拔出，释放得乱七八糟。

      -

      次日清晨，朴乾煜又是被胸口的重量压醒的（为什么要用「又」）。
      他的胸前除了趴着睡得正香的石马修，还矗立着一只「真正」的猫咪，蓝色的竖瞳正警惕地盯着房间里的不速之客，尾巴不停甩来甩去。

      昨晚一番折腾后，那床实在没办法再睡，两个人无奈之下又鬼鬼祟祟地溜回了马修的房间。

      朴乾煜伸出手把猫赶走，轻声抱怨道：“Gia好重，该减肥了啊……”
      “跟孩子胡说什么呢？”不知何时醒来的石马修没好气地掐了一下年轻人的脸颊。

      “哥，它差点压死我！”朴乾煜哼哼唧唧地告状，手臂把男人箍得更紧了一点：“不分青红皂白就怪罪我，我看Gia才是你的「My First」吧！”
      石马修随口回答道：“你们都是My First呀。”

      “一个人怎么可以有两个First呢？”朴乾煜对这个答案很不满意，说着就要伸腿把人踢下床：“那哥以后还是搂着猫睡吧，少来扰人清梦。”

      “吃Gia的醋呢？”
      “哼。”

      “哎哟，Gunwookie怎么这么可爱呢。”
      “没你的猫可爱。”

      “我知道了！”
      “？”

      石马修突然大喊一声：“Gia过来！”
      暹罗猫闻声飞快地跳上了床，高仰着脑袋，在两人交缠的身体上优雅地踱步。

      他指着朴乾煜，对Gia一脸认真地说：“叫阿爸。”
      猫自然是没搭理石马修，甩了甩尾巴又跳下了床，它还是对去高处探险更感兴趣一点。

      朴乾煜听到“阿爸”两个字，脸颊一下子全红了。
      嘟嘟囔囔半天没说出辩驳的话，半推半就地接受了自己的新身份，也就没了吃醋的道理。

      -

      Gia：咪的天。人居然想要让猫说话。


      在宫里的某个角落捡到了朴小旭的日记本……





      正祖二十一年秋十月朔日

      今日书堂里来了一位长得特别高的新同学。

      长得跟大哥二哥一样高！

      可恶，居然要本王子仰视他！！

      这个人是吃什么长大的？？





      正祖二十二年春二月十七

      先生让我们高声诵读课文，石友铉总是不张嘴。

      本王子觉得他是在故意跟先生作对，有点生气地问他是不是哑巴！

      他却歪着脑袋小声问我哑巴是什么意思？

      哎呀！这个人是不是傻子啊！





      正祖二十二年春三月初四

      这个石友铉怎么连自己的名字都不会写？？

      本王子抓着他的手写了好几遍（当然是因为我是学长！） 

      手不大，劲儿倒是挺大的。

      他在学会写名字之前肯定得先折断好几根毛笔。





      正祖二十二年春四月十一

      说来也奇怪，先生居然不会因为没完成功课而责罚石友铉，也不会主动辅导他……是因为他出身卑微吗？

      本王子很生气！先生奉行的有教无类之道都是假的吗？





      正祖二十二年春四月廿六

      今日金家的孩子们带了好几个风筝来书堂。

      同学们都去放风筝了，只留石友铉一个人在座位上习字。

      我问他怎么不跟大家一起玩？他摇摇头，继续习字。

      所以本王子也没去放风筝，没意思！！





      正祖二十二年春五月廿八

      放学时石友铉突然偷偷塞给我一小盒红豆年糕，说是娘亲为他生辰亲手做的，想分给我尝尝。

      我随口问他过的是几岁生辰，他却说是十五岁？？？



      以前从来没有这么大的孩子来读书堂！！

      哎呀！他不会真的是个傻子吧！





      正祖二十二年春五月晦日

      本王子实在太好奇了，就向保姆尚宫打听了石家。

      她说那是驻守在北方的将军家族，世代忠良。

      可是这就更奇怪了啊……

      石家明明也是贵族，为什么不教孩子读书呢？





      正祖二十二年夏六月初五

      天气慢慢热起来了！

      本王子讨厌夏天！！！





      正祖二十二年夏六月十三

      今日石友铉居然特意给我带了他娘亲熬的绿豆汤！

      他是怎么发现我怕热的？？

      说起来从来没在宫中喝到过这种味道呢。

      真羡慕他有个手艺好的娘亲啊！





      正祖二十二年夏七月廿二

      今日意外听见李家的孩子笑话石友铉是野种。

      我直接冲上去揍了那小子一顿。



      唉，这些话脏了本王子的耳朵就罢了，可千万别让他听见……





      正祖二十二年夏七月廿三

      课前，李家的大人带着鼻青脸肿的小辈来跟我道歉，说是孩子口无遮拦，无意间冲撞了三王子。



      很可笑不是吗？

      出手打人的人获得了道歉。

      什么都没做错的人反而成了“野种”。





      正祖二十二年夏八月廿五

      金奎彬邀请同学们休日的时候一起去他家的别庄玩水，我自然答应了！本王子可是泅水高手！

      想不到石友铉主动提出也要参加。

      可恶，是想趁机展示自己的肌肉吗？





      正祖二十二年夏八月廿八

      今日我在泅水时抽筋了，孩子们都吓得不知所措，石友铉不知何时游过来救了我。

      本王子欠他一条命！



      那时我冻得直发抖，搀扶着我的石友铉也抖得厉害。

      我向他郑重道谢，他却一脸惶恐，只说什么邸下不必向小人行如此大礼。

      我第一次觉得，“邸下”的称呼像是一堵墙，把我和大家分隔开了。





      正祖二十二年夏八月再晦

      今日父王在大殿上问石友铉想要什么赏赐，他居然又一言不发，装哑巴！！！

      急得本王子失了体统，冒冒失失地大喊：父王是一国之主，只要不过分，你求什么他都会应允的。

      他立刻跪伏得更低了些：只求做三王子的侍从，常侍身旁。

      父王不甚在意，随口封他为八品侍直，又赐了通行令牌，方便今后留宿宫内。



      可是我想不明白。

      大哥已被册封为世子，品行和才学皆在我之上；

      二哥虽为庶出，他背后的母族却势力甚广。

      怎么会有傻子选三王子呢？

      我明天必须要跟他讲清这其中的利害，哪怕是要请父王收回成命。





      正祖二十二年夏八月晦日

      大清早石友铉就拎着自己的全部家当来了我宫中，我被打了个措手不及，只好让他在偏殿先安顿下来。



      我问他：四位王子中，为什么偏偏选了我？

      他轻声细语：邸下一贯对小人极好，小人自该报答邸下。

      听完我的心底有一股无名火涌出，于是拂袖而去。

      他就一声不吭地跟在我身旁。



      课堂上，我总算冷静下来，继续劝他：你该去寻个更好的主子。

      他摇摇头，满脸为难：邸下是信不过小人？

      许是声音太大，先生不再讲课，严厉地看着我们。



      我提笔写给他看：如果你想留下，今后不许再自称小人。

      石友铉看了好半天，表情不停变换。

      我急了，抢过纸继续写：不愿意还是不识字？

      他认真写了很久才把纸还给了我。



      偌大的纸上只有一个狗爬般的“好”字，旁边画着一张傻乎乎的笑脸。



      这家伙以后上疏也打算用画的吗？

      本王子必须得监督他习字了！！！





      正祖二十二年秋九月廿二

      自从父王钦点石友铉为侍直后，书堂里再也没有人敢对他指指点点了，哪怕是出身再显赫的孩子都得客客气气称呼一句“友铉兄”。

      就连先生近日都给他开了几回小灶。



      只是这家伙的心思似乎完全不在学习上，上了快一年的书堂，读简单的课文依旧磕磕绊绊。

      但不知为何，每次看他一脸痛苦地之乎者也，我总会笑个不停。





      正祖二十二年冬十一月初八

      不是，石友铉怎么又长高了！

      什么时候才轮到本王子长个子啊？！





      正祖二十二年冬十二月廿六

      本王子合理怀疑石友铉这几天夜里做贼去了。

      先生只要一张嘴，他就开始打哈欠。



      今日更是直接趴在课桌上，一口气睡到了午膳时间，还嘟嘟囔囔地讲起了梦话。

      我竖起耳朵凑过去偷听，却发现自己一个字都听不懂。

      这难道是他自己发明的语言吗？！



      我坏心眼儿地掐了一把他的脸颊肉，他终于从梦中惊醒，猛地站了起来，像是要跟谁干架似的。

      我手捧着课本，装作被他惊扰的模样，一脸不悦地看着他，他挠挠脑袋又坐下了。

      本王子再三努力控制表情才没笑出声来，逗石友铉实在是太好玩了！！





      正祖二十三年正月初十

      今早本王子的脑袋还蒙在被子里的时候，石友铉就兴冲冲地来敲门了。

      他带着一身的寒气大步流星地进了屋，又把内侍关在了外面。



      我在被窝里打了个哆嗦，没好气地问他大清早干嘛来了。

      石友铉笑眯眯地从怀里掏出一个包裹给我：邸下的生辰是大日子，我可不能迟了。



      带着余温的包裹拆开是两个锦盒。



      第一个锦盒里装的是一大份红豆年糕。

      我捻起一块塞进嘴里，品了品：是你娘亲做的？

      石友铉点点头：我见邸下似乎喜欢，便请娘亲又做了一回。

      他说着说着忽然有些难为情：哎呀，邸下什么好东西没吃过呢？吃红豆年糕庆祝生辰是我家乡的习俗，倒让邸下见笑了。



      我心头一紧，不知道能说什么。

      只好低头嚼着红豆年糕，打开了第二个锦盒。



      锦盒里是一只漂亮的木雕老虎，通体修长矫健，一副蓄势待发的模样。

      从深浅不一的刀痕看得出来雕刻的人并不那么熟练，但每个棱角都打磨得极其光滑，定是费了不少功夫。

      我眼尖地瞧见了他包着纱布的指尖，却没点破。



      石友铉轻声说：我有时觉得邸下像一只老虎。

      以为他要说出什么恭维的话，我挑挑眉：为什么?

      想不到他却笑得灿烂：因为太爱吃肉了！！！



      气得我一把将他拽倒在床上，扑上去在他的脸颊上结结实实咬了一口。

      他目瞪口呆地看着我，半天说不出话来。

      我心情大好：你不知道老虎爱咬人吗？



      石友铉似乎有些生气，许是碍于身份不好发作，只好撅着嘴巴。

      于是我干脆从侧面抱住了他，讲出了先前没能开口的话：这是我收到过最好的生辰礼物，谢谢友铉哥。



      听到我喊他哥，石友铉吓坏了，连忙捂住我的嘴，生怕被第三个人听了去。

      他脸色涨红，声音颤抖：邸下怎能、怎能如此称呼？

      我撇撇嘴：为何不能？你也可以叫我乾旭啊，我不喜欢你叫我邸下。

      他猛地低下头，扔下一句邸下别开玩笑了，头也不回地跑了。



      我把玩着木雕老虎，头一次觉得当王子也没什么意思。





      正祖二十三年春四月十二

      今年春天，我也到了要上弓马课的年纪了。

      说实话，我对骑马摔跤射箭这些东西真没什么兴趣，父王也并不指望我上阵杀敌，能学点防身之术足矣。

      但石友铉——我从未见过这家伙在课堂上有如此兴致勃勃的时候。

      今日不仅摔遍了全班同学（手下留情了才没把我摔得太狠），甚至连授课的将军都能打个平手。

      看来本王子今后的人身安全很是有保障啊！





      正祖二十三年夏七月朔日

      这不是错觉，本王子开始长高了！！！

      上这么多弓马课还是很有好处的嘛！





      正祖二十三年冬十一月廿三

      偶感风寒，整个人晕晕乎乎的，像是被打了一记闷棍，身体也是忽冷忽热，只得蜷缩在床上。

      石友铉怕我无聊，特意带了一打志怪话本来给我解闷，都是平日里先生不允许我们读的闲书。



      我借口头晕，指使石友铉读给我听。

      想不到他念故事的时候倒是毫不磕绊，讲到关键之处更是眉飞色舞，活像市井里的说书先生。

      我不禁听得入了迷，跌跌撞撞地掉进了他的故事里。





      正祖二十三年冬十一月廿四

      今日我听出石友铉的声音带上了鼻音，便不许他再来探病了。



      我冲他摆摆手：话本留下，人可以走了。

      他撅着嘴，满脸写着不情愿，却编不出一个留下的理由，最后跺着脚走了。



      这傻子，也想害上风寒吗？





      正祖二十四年夏六月初九

      今日晚膳前，我让石友铉同我一起比比个子。

      他似乎对我的提议很惊讶，但没有拒绝。

      我们背靠背站着，由殿里个子最高的内侍作见证。



      初夏时节，两人的衣服都穿得很薄。

      我感受到背部隐约传来的热度，屏住了呼吸，努力站直身体。

      内侍高兴地宣布：邸下高过侍直大人！



      我暗自松了一口气，转身冲石友铉咧嘴。

      他不甚在意地摆摆手：我都多久没长过个子了！

      我们便嘻嘻哈哈地笑作一团。



      仰视石友铉的日子真是一去不复返喽！





      正祖二十四年夏九月廿四

      母妃使人传话，父王将纳一位邻国王女为嫔，让我不必担忧，这只是安抚邻国的权宜之计。

      说起来，宫里也许久未见新人了，上次操办还是在册封君夫人的时候，距今已过去两年有余。

      比起后宫生变，我更忧心的是，母妃怕是已经开始替我相看人家了。





      正祖二十四年秋十月初五

      今日母妃召我前去，递给我一本厚厚的册子，详细记录了适龄贵族嫡女们的画像与姓名。真是怕什么来什么。

      我随手翻阅，却越翻越心惊——母妃定是为此筹谋了很久，甚至可能早就有了心仪的人选，召我来或许只是走个过场。



      但我不愿自己像地雄哥那般任人摆布。

      地雄哥大婚之时，我尚且不满十岁，不懂得发生了什么，却怎么都忘不掉他那张苦涩的笑脸。

      我问他：大哥今日做了新郎官，不快活吗？

      他揉了揉我的头顶，扯出了一个比哭还难看的笑。

      后来我才知道，地雄哥那时分明是有喜欢的女子的，只是再热烈的爱意终究还是抵不上世子之位的分量。



      我佯装镇定：母亲，这是何意？

      母妃轻叩着册子：旭儿过了年便满十五了，议亲之事耽误不得。

      我咬着牙回答：可儿臣对儿女私情并无兴趣。

      母妃上下打量着我，嗤笑了一声。



      我谎称有事先行告退，母妃摆摆手让我走了。

      那册子依然留在她的宫中。

      可我知道，这仅仅只是个开始。





      正祖二十四年冬十一月初三

      我今日在后苑中第一次见到刚刚入宫几日的宁嫔。

      宫中先前从未有过金发的女子，口中讲的语言也让人似懂非懂，本王子不免多看了两眼。

      再往旁边一看，石友铉也愣住了。



      我莫名有些不悦：喜欢？

      石友铉连忙让我噤声：觊觎嫔妃是要掉脑袋的大罪！邸下可要慎言。

      我不停追问：那是为何看呆了？

      他的声音越来越低：邸下不是知道我家里的情况嘛……



      我自然是早就派人查过石友铉的底细的，本王子可不想哪天不明不白地被最信任的身边人取了脑袋。

      只是他从来不会提起他娘亲以外的亲人，我也不会主动提起他的过往。



      我不动声色：知道，如何呢？

      石友铉攥着自己的衣袖，看起来有些紧张：我发现，我能听懂宁嫔娘娘的语言……是我娘亲曾教过我的。



      想来就是那时我听不明白的那些梦话吧。



      我挑挑眉：她刚才说了些什么？

      石友铉警惕地环顾四周，才轻声说：宁嫔娘娘在跟陪嫁侍女抱怨不习惯宫中生活。



      我居高临下地打量着石友铉，没讲话。

      他被我盯得有些发毛：邸下怎么啦？



      我伸手摸了摸他的头顶：友铉哥若是金发，怕是会比宁嫔更漂亮呢。

      石友铉闻言顿时脸红得像个苹果，本王子很满意！





      正祖二十五年元日

      今日的新年宫宴上，母妃亲自领了她远房侄女来见我，意思也非常明确：要我娶她。

      我一时无法脱身，只得礼貌性地攀谈了几句。

      母妃不断称赞她知书达理，是贵女中的典范。说话滴水不漏，家世背景亦让人挑不出错来。



      可是我就是觉得哪里不对。

      回头想找石友铉，却想起来他回殿中取大氅了。



      继续硬着头皮聊了几句，却发现对方随口背出了我几年前写的小诗，不禁让我后背一凉。

      真是有备而来啊。



      总算等到石友铉回来，我却远远瞧见他和宁嫔有说有笑，好不快活。

      两人保持着疏远的距离，但脸上的笑意是不会骗人的——我几乎没见过他笑得如此轻松的时候。



      再也坚持不下去了，我匆匆向母妃请辞。

      几个箭步冲到了石友铉面前，一句话都没说，只是用力扯着他的手腕，想带他去一个没有其他人的地方。



      石友铉的笑容僵在脸上，逐渐变成了害怕。

      是在害怕我么？



      我突然觉得没意思，于是放开了他。





      正祖二十五年春二月十一

      渐渐的，宫里人都知道了石侍直听得懂宁嫔的语言，风言风语随之流传开了。

      一会儿有人说石侍直是邻国安插在三王子身边多年的细作，一会儿又有人说石侍直与宁嫔私交过甚，凭借通行令牌，在后苑行不轨之事。



      地雄哥听说此事后，也曾旁敲侧击过我，让我当断则断，莫要因小失大。

      父王倒是有时会请石友铉去充当他和宁嫔间的翻译，他并没觉得有什么问题。



      而我只是在听完汇报后，摆摆手让暗卫去抓造谣和传谣者，只要被抓到就打一顿板子，再赶出宫去。



      至于石友铉，我拿他没办法，他亦拿我没办法。

      自宫宴后，我们的关系一直处在一种微妙的平衡，我不再提那天的失控，他也不提。





      正祖二十五年春五月廿二

      又到了春狩的时节，本王子惯是不想去的，骑马射箭没什么意思，反倒有可能会受伤，得不偿失。

      石友铉依然是那么别别扭扭的，就连讲话的时候都不愿直视我的眼睛，因此我也懒得指使他帮我收拾包袱，自己简单收拾了一下就出发了。





      正祖二十五年夏六月初八

      半月过去，身体总算好了大半，也能提笔写字了。

      重新记录一下这阵子的事情。



      出发前，我鬼使神差地把木雕老虎塞进了包袱，或许当时是想着能靠它缓和我和石友铉之间的关系吧。

      没想到它居然阴差阳错地救了我一命。



      往常出门都是石友铉帮我背包袱的，这次我却偏不肯，把自己打的包袱歪歪扭扭地斜背在胸前。



      所谓春狩，自然是要骑马的。

      王公贵族们浩浩荡荡地从都城出发，得在马上颠簸大半天才能抵达狩猎场。

      石友铉怕我骑得不舒坦，每次都会贴心地准备软垫，这次也不例外。



      他沉默地递给我软垫，我正打算得意地接过，再说几句缓和气氛的好话，却发现他依旧不肯直视我的眼睛，甚至恨不得撇过头去。



      我气急了，拿马鞭指着他，咬牙切齿地说：你真是好样的！

      石友铉平静极了：小人不知邸下是何意？

      我脱口而出：石友铉，我在你眼里便是如此不堪吗？



      不等他的回答——料他也给不出什么回答，我狠狠地一甩马鞭，策马飞奔而去。



      胸口的怒火还未散去，变故便发生了。

      早已埋伏在沿路的刺客突然射出了冷箭，一支接着一支。

      或许一开始他们的目标并不是我，但既然遇到了落单的王子，又岂有放过的道理。



      我扬起手中的马鞭挡掉了致命的一箭，却眼睁睁地见另一箭直冲我的心脏而来。

      结结实实“咚”的一声，没入了我的胸口。



      还没来得及反应，又一箭深深地扎进了我的肩头。

      剧痛之下，我身子一歪，从马上栽了下去，顿时失去了意识。



      当我再次睁眼的时候，先撞进的是石友铉通红的双眼。

      他把我的手抓得很痛很痛，嘶哑地喊了一声“小旭”。

      我扯了扯嘴角，身上痛得厉害，心情却莫名很好。



      石友铉突然哭了，眼泪啪嗒啪嗒掉个不停，像是悲痛欲绝，又像是劫后余生。

      我用尽力气回握了他，吐出一句“别哭，没死呢”。

      他捂住了我的嘴，让我省着点力气——又或许是不许我提那个“死”字。



      我本想问他，那一箭正中心脏，我怎么可能没死呢？

      但我也不愿再看他为我哭泣的模样，于是闭目养神起来。



      后来才知道，是木雕老虎替我挡住了那一箭。

      我问石友铉有没有替我好好收起来，他却垂着眼说那时只顾着担心我会不会死，哪里顾得上死物呢。



      我心头一紧，嘴上却不饶人，撅着嘴说：它可是我的救命恩人！都替我死了！

      他抬起眼看我，眼眶还是红红的，却笑得异常温柔：那，我就让它再活一次吧。

title: 没错现在是2029年
updated: 2025-01-10
status: finished
chapters:
  - title: 上
    body: |
      
      大半夜的，朴乾煜被人蹭醒了。
      更具体地说，在自己身前撅着屁股不停磨蹭的人，是他的好哥哥石马修。

      男人身上一丝不挂，在昏黄灯光的照射下，隐约透出了被情欲染红的肌肤。
      微微垂落的发梢湿得几乎要滴下水来，似乎刚沐浴完，整个人带着热腾腾的气息。

      石马修的后背就这么紧紧地贴在朴乾煜的胸前，屁股不甘寂寞地摇来摇去，伴随着极小声的哼哼唧唧，像是找到了某种让自己快乐的方式。

      或许朴乾煜没被吵醒才算奇怪。

      -

      朦胧中看到这幕场景的朴乾煜觉得有些惊悚。

      倒不是说三更半夜屋里进贼了，他们的确是这次澳大利亚行程的临时室友。

      他和石马修的关系，已经在很长一段时间里处于说不清道不明的阶段——尽管所有人都以为他们在交往。
      搂搂抱抱早就是家常便饭，更进一步的东西，两个人却从来没有讨论过。
      况且朴乾煜本人目前很享受这种过于暧昧的状态，并不着急捅破那层窗户纸。他们之间还有很长的时间。

      只是绝对还没到这种程度……吧？

      不行，再让他这么蹭下去真的会出大事的。
      在呆愣了几秒钟后，朴乾煜果断地握住了石马修的腰，试图让他停止动作。

      妈的，他早就知道手感很好，但是怎么会这么好。

      -

      腰被朴乾煜的大手制住之后，满脸写着欲求不满的石马修反而更兴奋了，不禁发出一声甜腻的低吟。
      他一向喜欢在床上被朴乾煜粗暴地对待，非常喜欢。

      身后的年轻人在自己锲而不舍的干蹭中终于醒来，石马修知道即将会发生什么。
      熟悉的硬度早已抵住了他的腿根。

      他愉悦地向后伸出手，凭感觉在朴乾煜身上随意摸索着，指尖划过裸露在外的皮肤，勾起一阵阵颤栗。

      下一秒，手也被用力握住，动弹不得。
      想要抽回手，却被紧紧地包裹在朴乾煜的手心。

      不知为何，石马修觉得哪里有些不对劲，朴乾煜不该是这样的反应。
      于是他试探性地开口，声音里带着明显的撒娇意味：

      “你生气了吗？”
      “……老公”

      -

      朴乾煜顿时倒吸了一口凉气。
      老公？谁是你老公？不会是在跟我说话吧？

      余光不经意扫过被自己紧握住的手，发现无名指上戴着一枚闪闪发光的钻戒。

      他举起石马修的手仔细端详，那颗钻石并不算小，怪不得刚才手心被硌得有点难受。
      意识到这枚戒指的存在和它所代表的某些意味，朴乾煜的心里顿时五味杂陈，无意识皱起了眉头。

      那边石马修还在没完没了地碎碎念：“我知道这些天在外面旅游很累，不该吵你睡觉……”
      “但也不至于这么小气吧姓朴的！这可是我们的蜜月欸！！”

      闻言，朴乾煜忽然福至心灵，难以置信地翻过自己的手背，只见无名指上赫然戴着一枚一模一样的钻戒。

      好家伙，原来真的是我啊。

      -

      “不做就不做呗！小气鬼！！”石马修越想越郁闷，他说了这么多，朴乾煜还是不为所动。
      所以专捡对方听了会生气的话说：“顶多就是我、我找别人去！”

      果不其然，朴乾煜脸黑了一瞬，不过立刻恢复了表情管理。
      他忽然有了一件非常想要确定的事情。

      朴乾煜没接石马修的话，而是耐着性子提问：“对了，我们是哪年结婚的来着？”
      “今年！2029年！！怎么着，你睡晕了？”石马修眯着那双狐狸眼回头打量，无论是表情还是语气都欠揍极了。

      这个答案在朴乾煜意料之中：或许自己意外穿越到了另一个时间线，又或许是做了一个过分真实的春梦。
      但无论如何都没关系——因为他确信面前这个石马修是完完全全属于自己的。

      “没什么，”朴乾煜顿了一下，紧接着发出严正警告：“不许去找别人。”
      说完，捏着石马修的下巴，径直吻了上去。

      -

      先是嘴角，再是唇瓣，最后温柔地撬开齿关，不愿放过任何角落，以完全入侵的姿态占据着石马修的每一次呼吸。

      朴乾煜在享受甜蜜的同时，暗地观察着石马修每个细微的反应，以判断做得是否足够令人满意——他对于自己很久之前从Youtube学来的接吻技巧没什么信心。

      幸好在唇齿相接的瞬间，石马修就开始晕头转向，脑袋彻底被情欲搅成了一团浆糊，连朴乾煜的吻技一夜之间倒退五年这么大的BUG都没能发现。
      急急忙忙亲了一会儿，又再次摇着屁股求朴乾煜快点插进去，甚至毫无耐心地推倒男人，试图加快游戏进程。

      作为完全的体验派，朴乾煜不想交出第一次的主动权——哪怕是在做春梦的时候也不行。

      -

      “我已经扩张过了，”石马修撇撇嘴，不满意朴乾煜的办事效率，“你就直接——啊！”一声短促的惊叫过后，石马修绵软地塌下腰，上半身几乎紧贴着床单。

      原本只是屁股高高撅起，哄诱朴乾煜直接进来，男人却没打招呼地把脑袋埋了进去，在柔软的大腿根部啃咬几下后，自下而上地舔舐起了隐秘的穴口。

      一瞬间过于强烈的快感让石马修头皮发麻，语言系统全面瘫痪，吐不出完整的句子，只有本能地发出呻吟。
      他想要制止朴乾煜，伸出手却只能摸到一把空气，挣扎半天后狼狈地抓住了身下的床单。

      “呜……太刺激了……不要这个……”石马修几乎要被逼出眼泪，一边崩溃地摇头，一边蹬了朴乾煜肩膀一下，这才得以顺利逃出他的控制范围。
      没过四五秒钟，又被男人极其轻松地拖了回去。

      石马修那一脚好巧不巧地踢在朴乾煜肩头的陈年旧伤上，顷刻间疼得他旖旎心思消散了大半。

      出力又挨踢的朴乾煜气不打一处来，一把握住脚踝，将人拽了回来，恼怒地命令他：“老实趴好。”
      顺手在屁股上不轻不重地甩了一巴掌，声音清脆极了，偌大的掌印在白皙的肌肤上依稀可见。

      见朴乾煜在床上发起脾气，石马修的性器反而兴奋地抬起了头，隐约流出一股清液。
      他故意逆着朴乾煜的意思，用相当任性的语气嘟囔道：“马修不要～！”说完又挑衅地扭了扭屁股。

      果不其然屁股上又吃了一记巴掌。
      这下两个掌印可谓是对称了。

      石马修当即爽得呻吟出声，抓着床单的手止不住地轻颤。
      又刻意地翘起屁股让男人看清楚自己留下的每一处痕迹，轻晃着不存在的狐狸尾巴。
      他眼中含媚地勾引着朴乾煜，仿佛在说想要更多。

      朴乾煜见状也明白了石马修的想法，他不确定自己还能忍耐多久，又害怕过于急躁会弄伤身下的人。
      他眸色渐深，哑着嗓子道：

      “想要的话就自己掰开。”

      -

      纵使是一向在床上大胆的石马修面对如此羞耻的动作也忍不住脸红了几分。

      但此刻色欲熏心的他已经顾不得那么多了，反手抓住自己的臀瓣，献身般地用力一扯，露出了湿漉漉的穴口，在昏黄的灯光下透出淫靡的暗赤色。

      不必回头，石马修也知道朴乾煜肯定正在直勾勾地盯着那个地方，是野狼捕猎时的那种眼神。
      不由地从身体深处涌出阵阵空虚感，引得他的大腿轻颤，穴口不停翕动，想要立刻被占据、立刻被填满。

      这次朴乾煜声音里带着明显的宠溺：“马修真乖。”说完，再一次把脑袋埋进了石马修的腿间。
      不再是浅尝辄止地舔弄，他有预谋地伸进一根中指，仔细检查起石马修的准备成果。

      不同于独自扩张时的无趣，朴乾煜的手指在甬道内进出时的存在感格外强烈，再加上他柔软又火热的舌尖不断地挑逗，石马修逐渐到了崩溃的边缘。

      “啊——我草——！！”加拿大人难得的字正腔圆。
      “不许说脏话。”朴乾煜忙里偷闲发出警告，惩罚性地加上一根无名指，笔直地捅进了小穴。

      过度刺激让石马修几乎要把手里的床单扯烂，他听话地咬住了下唇，房间里只剩下断断续续的呜咽。

      朴乾煜的动作愈发急躁，指尖温暖紧致的触感引诱着他放弃理智，扯出一阵阵咕唧咕唧的水声。

      短短几分钟，石马修的意识几近出走，有种整个人都被朴乾煜吃掉了的错觉，他凌乱地吐出不成个儿的句子：“要到了……呜……要到了……”
      “才这样就不行了吗？”朴乾煜明知故问，另一只手若无其事地从石马修被冷落许久的性器上滑过，果然是充分勃发的状态。

      石马修无助地点点头又摇摇头，眼前似有白光闪过，但还不足以抵达那个点，只差一点点。
      他口齿不清地指使起人：“前面也要……再摸一摸……”

      见朴乾煜没空理会他，石马修打算自食其力，还没等握住性器，就被一双大手制住了。

      “不许碰前面，”朴乾煜有点郁闷，以为是自己哪里做得还不够，才满足不了如此贪心的石马修。
      他手里的动作不停反而更加凶狠了，三根手指完全没入再一齐拔出，不断搅动着穴口的嫩肉。

      朴乾煜一字一顿道：“想看哥被我的手指干射。”

      闻言石马修崩溃地呜咽着：“老公……求你了呜……摸摸我……马上就要到了……老公老公老公……”

      朴乾煜被老公N连叫得晕头转向，咬牙切齿地念着“狐狸精”，手却老实地抚上了石马修的性器。
      趁机端详了一下，白白净净，却伴有几根青筋暴起，和它的主人真是一个德行。

      手指在尖端轻轻一捻，拉出一条透明的银丝。
      “我们马修怎么就有流不完的水呢？”朴乾煜轻笑着抛出问题，倒也不指望忙于高声浪叫的狐狸能回答。
      随即大开大合地撸动起来，后穴里的手指也重新启动，这大概是当下最快帮助石马修释放的方式。

      在前后的双重夹击之下，石马修只剩下了大口大口喘粗气的份儿，脑海中的白光愈发强烈，过度的刺激使他浑身瘫软得像滩烂泥，最后尽数缴在了床单上。

      朴乾煜俯身抽了几张床头的纸巾，简单给两个人做了清理。
      接着扳过石马修的下巴，索要了一连串亲吻当作辛苦劳动的报酬。
  - title: 中
    body: |
      　　
      石马修迷迷糊糊醒来的时候正躺在朴乾煜的怀里。

      一开始石马修没觉得这有什么奇怪的，尽管他睡前的确老老实实地躺在了属于自己的那张单人床上——这并不意味着他不想对朴乾煜做点什么，只不过第二天紧凑的行程安排让他没工夫考虑这些事情。

      直到朴乾煜吻了一下他的额头，哑着嗓子道：“休息好了我们就继续吧。”
      接着像小狗般胡乱地亲吻着，在石马修的颈窝里留下一串湿漉漉的痕迹。

      “乾煜，”石马修后知后觉地发现自己浑身上下赤条条的，朴乾煜倒是穿戴整齐，这不太公平。
      他试图搞清楚眼下的状况：“继续什么？”

      “哥爽完就不管我了？！”朴乾煜难以置信地抬起头来，忍不住撅起嘴，委屈地盯着他。

      “不是，我没懂。”石马修想澄清自己并没有像朴乾煜所说的那样「爽到了」，他才刚刚睁开眼睛。
      准确地说，他甚至连三分钟之前发生的事情都不知道。

      但怎么听起来像个始乱终弃的流氓。

      朴乾煜拉着石马修一只手，按在自己的坚硬上，嘟嘟囔囔道：“为什么赖账，哥真是太过分了。”

      石马修被朴乾煜过于大胆的行径吓了一跳，下意识地想要收回手，却被紧紧握住，动弹不得。
      明明隔着几层衣物，掌心却仿佛感受到了那东西的热量。

      “可我们明天不是还有行程吗？”石马修明显地感觉到在他说完这句话之后，身后的男人僵住了。

      “……这样吗？”朴乾煜顿时喉头发紧，心跳过速。
      心思在坦白和装傻之间反复横跳，最后极其不安地提问：“对了，现在是哪年来着？”

      -

      “天哪！我们居然一觉穿越到四年之后了！！”
      “不，这好像不是重点……”

      听了朴乾煜好长一段找不到重点又遮遮掩掩的废话之后，石马修总算理解了眼下的状况。
      他简单粗暴地概括为：“……所以你刚才在和‘2029年的我’做爱，但突然被‘2025年的我’坏了好事。”

      “对不起，马修哥……”朴乾煜坐在床边，垂头丧气，一副做了错事被抓包的模样。
      实在不知道还能说什么，总之，先道歉吧。

      “这有什么的？”石马修耸耸肩，不以为意，语气也很轻松。
      “难怪醒来后一直觉得后面湿答答的，原来不是我的错觉。”说完还无厘头地干笑了两声。

      这话在朴乾煜听来却是另外一层意思——两个人糊里糊涂地陷入了这种境地，与他的一时贪欲脱不了关系，而面前的石马修对此完全一无所知。

      朴乾煜几乎要被内心强烈的愧疚感所淹没，使劲吸了吸鼻子，强忍住了不争气的眼泪。

      难道能够装作无事发生吗？
      又或者，石马修不会讨厌他吗？

      这样的故事情节任谁听来都会觉得不可理喻——他们分明不是可以上床的关系。
      朴乾煜深知自己已经越界，却依然贪心地说服自己沉溺在幻境之中。现在事情败露，他应当被责怪。

      “所以我们真的会在2029年结婚吗？”石马修却很快地接受了这个离谱的设定，甚至开始畅想未来。
      他举起戴着钻戒的手，借着床头的灯光细细端详。
      即使是在这样昏暗的光线下，钻石依然折射出耀眼的光芒，设计和制作不知耗费了多少心血。
      因而发自内心赞叹了一句：“好漂亮的戒指。”

      朴乾煜一言不发，低头凝视着自己手上那枚戒指。听见石马修随意地说出“结婚”两个字，本就不稳的情绪再度翻涌起来。

      他早已习惯石马修跳跃性的思维，从他嘴里蹦出来的那些莫名其妙的词语，并不能代表任何意味。

      结婚，只是他们曾经戏弄粉丝的玩笑话。
      可是当下的朴乾煜真的很想跟石马修结婚。

      -

      许是一直没有回应，石马修总算意识到朴乾煜的不对劲，随手扯了条浴巾围在身上，快步凑到他的跟前，用双手捧起了脸颊。
      本想说点什么来活跃气氛，却在面对那双通红的眼睛时愣住了。

      两人目光相接的瞬间，朴乾煜轻轻地眨了下眼。
      顿时两颗豆大的泪珠啪嗒啪嗒地掉了下来，在脸颊划下两道清晰的水迹后，消失在他的睡衣之中。

      石马修这下彻底慌了神，连忙用指腹抹去他脸上的泪痕，语气格外紧张：“怎么哭啦。”
      他胡乱猜想着朴乾煜忽然难过的理由：“害怕回不到现实世界吗？还是身体有哪里不舒服？”

      朴乾煜摇摇头，不敢望向石马修写满担心的眼睛，也说不出一个字，只是默默地流泪。
      于是石马修贴得更近了些，伸出双臂把朴乾煜整个人圈在怀里，不断轻拍他的后背，低声说着一些安抚的话。

      可是一直抱着朴乾煜的话，就没办法帮他擦干眼泪。

      石马修手足无措，显得愈发慌乱。思考片刻，他凑过去，温柔地吻掉了他脸颊上挂着的泪珠。
      他并不排斥那种咸涩的味道，但相较之下，他还是更希望年轻人永远都能笑得无忧无虑。

      一串脸颊吻的效果非常明显——朴乾煜哭得更凶了。


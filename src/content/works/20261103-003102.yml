title: 取向有点偏离世界观真是抱歉啦（并没有）
updated: 2024-05-03
summary: 真是一对天造地设的断子绝孙组合。
status: finished
chapters:
  - body: |+
      
      　
      朴乾煜的成年生日已经过去了一段时间。
      距离预测的分化时间越来越近，一些症状逐渐显露。

      又一次毫无预警的发热后，朴乾煜申请暂时搬离集体宿舍。
      所有人都心知肚明，以他目前的情况绝对不适合再继续住在未成年房间了，免得对真正的未成年人韩维辰产生不可预估的影响。

      石马修主动提出来陪朴乾煜度过这段重要且有意义的时期。
      毕竟他是Beta，几乎不会受到信息素的影响。

      石马修在照顾即将成熟的年轻人这点上也有着丰富的经验——金奎彬开始分化的前一分钟，正巧跟他一起外出逛街，在引起人群骚乱和警察的注意前，他顺利地把这个狂躁的Alpha扛到了附近的医疗单位。

      最终管理层讨论出来的结果是，韩维辰暂时搬到Beta们的房间，和金太来当一段时间的临时室友，而石马修和朴乾煜住到了一起。

      -

      朴乾煜很高兴石马修没有因为他要分化成Alpha而疏远。
      他已经感受到了Alpha们有意无意间散发的敌意——在团队里的Omege数量远远小于其他性别的情况下，作为一位即将新增的Alpha，他被一些人当作了竞争对手或者是什么假想敌。

      说真的，对于那些不太友善的目光，朴乾煜感到十分介意。
      他从来不觉得自己会和某个没有产生过充分情感连接的人发生关系，而这一切仅仅是因为信息素的相互吸引——那和被性欲支配的野兽又有什么区别？

      更重要的一点是，他喜欢的人，不会释放信息素。
      他天然地就不会成为那些人的“竞争对手”。

      -

      “怎么没来练习……”连续给朴乾煜打了几个没接通的电话之后，石马修心里暗道不妙，急急忙忙告假回宿舍找人。
      一推开房门就见到朴乾煜背对着他，在床上蜷缩成了一团，看上去难受极了。

      石马修连忙从医疗箱里掏出了早就备好的Alpha抑制剂，根本顾不得讲究什么手法了，直接撸起朴乾煜的睡衣袖子，给他在胳膊上扎了一针。
      又摸了摸年轻人的额头，滚烫得像块烤箱里的面包，他掏出手机准备请教一下经理要不要喂点退烧药。

      朴乾煜在昏昏沉沉中发现有人过来，稍微恢复了一点意识，本想说明几句身体的情况。
      直到他认出是石马修，一股强烈的委屈莫名涌上心头，黏黏糊糊地叫了一句“马修哥”，干脆伸手把人拉进了自己怀里。

      石马修不明白正发着烧的人怎么会有这么大的蛮劲，踉踉跄跄地倒在了床上。
      紧接着朴乾煜的四肢热乎乎地缠了上来，石马修开始觉得自己是烤箱里的另一块面包。

      不过哪有推开生病的弟弟的道理，石马修就着这个暧昧的姿势，轻轻拍打起朴乾煜的后背，祈祷着抑制剂早点生效。
      然而事总与愿违，随着石马修的靠近，朴乾煜越来越难以抵抗内心深处的燥热，无意识地撕扯起了两个人的衣服。

      石马修这才注意到，朴乾煜紧紧抱着的并不是被子，而是自己某件常穿的外套。
      还没等他想明白这件事，一颗毛绒绒的脑袋已经埋在他的颈间了。

      朴乾煜试探性地咬下第一口，又小心翼翼地伸出舌尖舔了舔自己留下的牙印。
      湿热的刺激让石马修不由自主地缩了缩脖子，双手捧起朴乾煜的脸颊，防止他继续到处乱啃——就算是最没常识的Beta也知道这个动作在Alpha和Omega的世界里代表着什么。

      “好热……好难受……”觉得嘴里少了点东西的朴乾煜嘟嘟囔囔。
      石马修轻声细语地像是在哄小孩：“乖，我们乾煜要变成大孩子了，再等一会药起效就舒服了。”

      “哥摸摸我……”朴乾煜强打着精神跟他对视，可怜巴巴的眼神让石马修心软了几分。
      算了，想啃就啃吧，自己又不是娇气的Omega，总不会掉块肉。

      -

      “不对劲……真的不对劲……”朴乾煜好似清醒了些，若有所思地念叨着。
      石马修也觉得哪里不对劲，说明书上明明写的注射后十分钟起效，可是十分钟早就过了，怎么一点作用都没有。

      反而随着他的安抚，朴乾煜肉眼可见的愈加兴奋了，长腿直接横跨在他的身上，不愿放他离开，下半身偷偷摸摸地蹭了起来。
      过了好一会儿，石马修才反应过来正抵着自己大腿根的是什么东西，脸色瞬间爆红，更加一动不敢动。
      他在心里帮生病的弟弟开脱的同时，顺便把抑制剂厂家的祖宗八代都问候了一遍。

      “哥，我好像，”朴乾煜忽然牵起石马修的右手，伸到了自己身后，“没有分化成Alpha。”
      石马修颤抖的指尖摸到了一滩泥泞。

      -

      这是什么意思？
      Beta本就不太够用的大脑这下彻底宕机了。

      没等石马修重新开机，朴乾煜已经无师自通地拉着他的指尖坐了下去。
      发情期让Omega的身体做好了准备，他极其顺利地吃进了一根食指。

      “好舒服……”朴乾煜餍足地眯起眼睛，手臂滕蔓般缠绕着男人，在他耳边缓缓喘息道：“哥哥帮帮我吧……”
      石马修整个人还沉浸在突如其来的震惊当中，手指却下意识听话地动作起来，朴乾煜体内火热的温度几乎要将他融化。
      他并不清楚自己的手法是否正确，只是机械而生硬地进出着，从朴乾煜的反应来看或许还不错。

      石马修这辈子从来没有跟其他人发展到这种程度，甚至他一向是对AO们避而远之的，却在这个时候顺水推舟地接受了。
      好吧，其实是他根本找不到任何理由拒绝他亲爱的弟弟。

      渐渐地，朴乾煜适应了体内的异物感，他直勾勾地盯着石马修过于专注而抿起的嘴角，红着脸示意他可以再加一根手指。
      石马修皱着眉头，思考了几秒钟同时吞入两根手指的可行性，最终决定按朴乾煜说的做。
      另一根中指被轻柔且缓慢地推入，直到被温软湿热的地方完全包裹，他满脸紧张地看着朴乾煜：“感觉还好吗？”

      回答他的是朴乾煜毫无章法的亲吻。
      高热的Omega在急促呼吸的缝隙里难耐地呻吟着，未经思考地吐出了一连串“好喜欢你”之类的胡话。

      石马修的内心突然被某种无可名状的柔软填满。
      分明闻不到任何信息素的他，却在唇齿交换间无端尝到了巧克力的味道。
      于是冲动地回应了朴乾煜，加深了这个不合时宜的吻。

      -

      汹涌澎湃的情欲烧得朴乾煜整个人意识恍惚。
      只能感受到石马修的手指在他的身体深处搅起一次次浪潮。
      但总差了那么一点、只差一点点。

      他开始觉得不满足，脑袋拱到石马修的耳边哼哼唧唧：“好想要马修哥——”
      一边热烈地亲吻着眼前的人，一边光明正大地把手滑向了他的腰带。

      在朴乾煜伸出手的刹那，石马修毫不犹豫地握住他的手腕，阻止了接下来将要发生的事情——尽管他早就硬得快要爆炸了。
      他没打算当什么正人君子，但有些事情是无论如何都不能做的。

      朴乾煜不敢相信石马修会在这种时候推开他，一下子愣在原地，眼角泛红。
      他努力压抑着的犟脾气彻底藏不住了，强行挣开石马修的钳制，不由分说地撕扯起了那根可怜的腰带。

      “小祖宗，停停停，”石马修主动凑过去亲了亲朴乾煜的脸颊，温声解释道：“进度太快了。”
      “而且我们什么都没准备……”他在脑海里尽力搜刮着韩语词汇，最后选择了最直白的说法：“你可能会，呃，怀孕。”

      朴乾煜终于迟钝地感到了羞赧，面红耳赤地消化起石马修话里的信息。
      没错，他这个倒霉蛋分化成了Omega，科普文章里提到的最容易受孕的第二性别。

      石马修见朴乾煜撅着嘴一言不发，以为他对这个回答不够满意。
      他沉吟了片刻，下定决心般把人推向了床头，随手抓了个柔软的抱枕垫在他的腰下，接着不假思索地低头含住了他的勃发。
      同时几根手指依然无师自通地托着他精瘦的臀肉抠挖，在素色床单上留下了深深浅浅的水痕。

      初经人事的朴乾煜哪里受得了这样的双重刺激，唇边逸出几声短促的惊叫。
      他控制不住地释放着浓郁又甜腻的巧克力味道信息素，修长的手指深深陷入了金黄的发丝之中。

      -

      趁着朴乾煜大口大口喘气失神的空隙，石马修吐掉嘴里的东西，简单清理了现场。
      他重新打开医疗箱，找到了原本为韩维辰预备的抑制剂，幸好日期还很新鲜。
      章昊在很久之前就提议过，得在宿舍提前预备一些Omega抑制剂——那时的他还以为是杞人忧天。

      石马修一靠近床边，朴乾煜立即亲昵地缠了上来，拽着他的脖子交换了一个湿漉漉的吻，似乎随时打算开启下一场。
      趁着朴乾煜意乱神迷的时分，石马修眼疾手快地为他注射了抑制剂，还顺手贴上了一张阻隔贴——他也不知道贴没贴对地方，今天过后真得恶补一下Omega生理知识。

      酥酥麻麻的疼痛让朴乾煜清醒了几分，他幽怨地瞥了石马修一眼，仿佛是在控诉他的无情。
      石马修被这个眼神逗笑，总算松了一口气：“抑制剂里有催眠的成分，等你醒了我们再好好谈谈。”

      “别担心，我一直会陪着你。”然后温柔地揉了揉他汗湿的头发。 

      -

      朴乾煜做了一个很漫长的梦。

      他回想起新年假期的最后一天，终于能和石马修单独行动。
      两个人在人生地不熟的大阪漫无目的地游荡，偶然遇见一个清幽寂静的寺庙，不自觉被吸引了进去。
      他们分明都不信奉任何神灵，却依然虔诚地许下了愿望。

      彼时的朴乾煜刚刚拿到属于他的分化预测，报告上白纸黑字地写着：

      「      70%Alpha
      　　  30%Omega     」

      所有人都认为朴乾煜会分化成Alpha，包括他自己。 

      直到看见报告的这一刻，朴乾煜才真正慌了，他没有任何一个同龄朋友收到的是如此模棱两可的结果。
      说真的，他从来没考虑过自己有分化成Omega的可能，脑海里一片空白。

      朴乾煜和石马修并肩坐在寺庙的某个角落里歇脚。
      这里除了无所事事的他们，一个游客都没有。耳边只有无休无止的溪流声。

      石马修早就发现了朴乾煜的心不在焉，他什么都没说，只是轻抚着他的后背，一下又一下。
      看着身旁男人永远含笑的侧脸，朴乾煜控制不住地把自己的焦虑全盘托出：“……如果真的分化成了Omega，我还能继续当爱豆吗？”
      “粉丝们会喜欢我这种……奇怪的Omega吗？”
      脑袋倚在石马修的肩膀上，无意识地撅起了嘴巴：“哥会不会觉得我太软弱了？”

      “我们Baby要长大了啊……真的很为你开心，”石马修眉眼弯弯地听年轻人倒着苦水，轻轻梳理起他有些凌乱的发梢：“就算分化成Omega，乾煜也会做得很好的。”
      他顿了一下，语气里带着坚定和不被察觉的决心：“至于其他的事情，别担心，我会保护你。”

      -

      朴乾煜忽然开始期待着分化的那天到来。

      分化成Alpha，我可以保护马修哥！
      分化成Omega，马修哥说他会保护我！ 
      一切或许不再那么糟糕了。

      刚满20岁的朴乾煜对着未知的神灵许下了心愿。
      无论如何，请让我跟马修哥在一起吧！

      -

      终于清醒过来的朴乾煜，看见被自己强行箍在怀里熟睡着的石马修足足愣了有三分钟。 
      这本该是出现在他梦里的画面。

      头疼得快要炸了，完全回想不起前一晚发生的事情。
      更要命的是，他们两个人的衣服去哪儿了？！

      如果在失去理智的时候伤害了石马修，那他一辈子都没办法原谅自己。
      ——但显而易见地，有些计划外的事情已经发生了。

      不是说有自信不会被性欲支配吗？！
      朴乾煜在心底痛骂着自己，不断设想最坏的结果。

      无论如何，等下先给马修哥道歉吧。
      或许还得做好挨一顿揍的准备。

      胳膊上两个隐隐作痛的针孔和下半身挥散不去的黏腻感时刻提醒着朴乾煜，他彻底分化成了一个Omega——真是怕什么来什么啊。

      眼前忽然闪过自己不受控制地喷了石马修一脸白浊的画面，甚至连他的睫毛上都挂了几滴。
      而石马修只是略显无奈地注视着高潮时的自己。

      那双狐狸眼里晦涩地藏了许多他读不明白的东西，但似乎不是生气或者厌恶的情绪，朴乾煜稍微安心了一点。

      -

      但现下的情况让他完完全全地僵住了。

      两个人在熟睡时抱得太紧了，无论他把手搭在哪里总能摸到光滑细嫩的肌肤，只好僵硬地一动不动。
      而石马修就枕在他的胳膊上安稳地睡着，胸膛随着呼吸有节奏地一起一伏，整个后背热乎乎地贴在他的身上。

      过于火热的温度让被子成为了多余的东西。
      这是他们在清醒时从未有过的距离。

      结果就是，朴乾煜硬了。
      并且直愣愣地顶着石马修。

      朴乾煜屏住了呼吸，他一边安慰自己：没关系，这个年纪晨勃也是很正常的事情。
      一边祈祷：马修哥千万不要在这个时候醒过来啊！

      这个念头甚至还没来得及在大脑里跑完一圈。
      就听见背对着他的石马修幽幽地说了一句：“大清早还挺有精神的。”
      接着反手推了他一下，示意他滚远点。

      “马修哥……”比起面子，朴乾煜更怕石马修真的不高兴了，于是叛逆地把怀里的人抱得更紧了一点，在耳边小声撒起了娇：“拜托、拜托别生我的气……”
      “知道了，总之先别让你那玩意儿戳我的屁股了。”石马修哑着嗓子认输道。

      “昨晚的事情真的对不起……”看不见石马修的表情，朴乾煜越说越心虚，在脑海里搜刮了他看过的肥皂剧里所有酒后乱性的桥段，吐出了男主角般的台词：“我会对哥哥负责的。”
      “嗯？”石马修花了几秒钟来思考朴乾煜话里的意思，无声地笑了笑：“那就负责吧。”

      朴乾煜红着脸凑上去亲了亲石马修的耳尖。
      嘿嘿，他看到了，哥的耳朵也是红的。

      -

      石马修在朴乾煜的怀里伸了一个超大的懒腰，又困困地倚在他的胸前，闭着眼睛说：“昊哥等下会过来。”

      “哥告诉大家了吗？”朴乾煜满脸紧张，声音越来越低：“那个，我的分化结果。”
      石马修抬手抚平年轻人不自觉皱起的眉头，安慰道：“放心吧，只告诉了昊哥，他会帮你的。”

      -

      章昊进屋的时候差点没被满屋甜腻的巧克力气息熏死。
      同样作为Omega，他能清晰地感知到，朴乾煜无意识释放的信息素里满溢的兴奋、愉悦和幸福。

      被这种情绪所感染的章昊瞧见了房间里这两个无所适从的家伙，忍不住笑出了声：“哎，不是，你们，搞这么大的？”
      石马修试图挽救一下朴乾煜的清白，非常无辜道：“昊哥，不是你想的那样。”
      朴乾煜面红耳赤地坐在旁边，一声不吭，眼睛却黏在了石马修身上。

      章昊朝天花板翻了个白眼，他拒绝跟石马修进行白痴对话。
      只有闻不到任何味道的Beta才能在这个熏得死人的房间里保持冷静，但凡从宿舍随便抓一个Alpha过来都能立刻把朴乾煜吃了。
      他一边指挥石马修去开窗通风，一边像不要钱一样狂喷着信息素消除剂。

      全部做完之后，石马修站了起来，打算把房间留给两个Omega——毕竟他不太方便探听Omega之间的对话。
